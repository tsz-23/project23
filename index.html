<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 23</title>
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project 23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;500;600;700&family=Fredoka:wght@500&family=Playfair+Display:wght@600&family=Caveat:wght@600&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/site-config.js"></script>
<script src="js/core.js"></script>
<script src="js/widgets.js"></script>
<style>
  :root {
    --apple-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
    --glass-surface: color-mix(in srgb, var(--card-solid) 80%, transparent);
    --glass-elevated: color-mix(in srgb, var(--card-2) 88%, transparent);
    --glass-border: color-mix(in srgb, var(--text) 10%, var(--line));
    --glass-spec: inset 0 1px 0 0 rgba(255, 255, 255, 0.09);
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding-bottom: 3.5rem;
    position: relative;
  }

  .homebar-wrap {
    position: sticky;
    top: 4.5rem;
    z-index: 85;
    display: flex;
    justify-content: flex-end;
    height: 0;
    overflow: visible;
    margin: 0;
    pointer-events: none;
  }

  .homebar {
    pointer-events: auto;
    margin-top: 0.55rem;
    height: fit-content;
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
    padding: 0.38rem 0.5rem;
    border-radius: 999px;
    background: color-mix(in srgb, var(--card-solid) 84%, transparent);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-spec), 0 12px 30px -10px rgba(0, 0, 0, 0.45);
    transition: all 0.24s var(--apple-ease);
  }

  .homebar.is-editing {
    border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
    box-shadow: var(--glass-spec), 0 16px 38px -8px rgba(0, 0, 0, 0.6);
  }

  .homebar button {
    border-radius: 999px;
    padding: 0.44rem 0.92rem;
    font-size: 0.84rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.38rem;
  }

  .blocks {
    --row: 116px;
    --gap: 16px;
    position: relative;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(var(--rows, 4), var(--row));
    grid-auto-rows: var(--row);
    gap: var(--gap);
  }

  .cells {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(var(--rows, 4), var(--row));
    grid-auto-rows: var(--row);
    gap: var(--gap);
    pointer-events: none;
    z-index: 0;
  }

  .cells[hidden] {
    display: none !important;
  }

  .cells i {
    border: 1.5px dashed color-mix(in srgb, var(--accent) 28%, transparent);
    border-radius: 22px;
    background: color-mix(in srgb, var(--accent) 3%, transparent);
  }

  .blk {
    position: relative;
    z-index: 1;
    min-width: 0;
    min-height: 0;
    grid-column: calc(var(--x) + 1) / span var(--w);
    grid-row: calc(var(--y) + 1) / span var(--h);
    transition: transform 0.22s var(--apple-ease), box-shadow 0.22s var(--apple-ease);
  }

  .blk.swap-target > .blk-body {
    border-color: var(--accent3, #00cec9) !important;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent3, #00cec9) 35%, transparent) !important;
  }

  .blk-body {
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
    padding: 1.05rem 1.2rem;
    border-radius: 20px;
    background:
      radial-gradient(120% 120% at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent) 0%, transparent 60%),
      var(--glass-surface);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-spec), 0 16px 36px -16px rgba(0, 0, 0, 0.42);
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .blk-body h3 {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 600;
    font-family: var(--body);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 0.55rem;
    flex-shrink: 0;
  }

  .blk-body h3 svg {
    width: 15px;
    height: 15px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .w-content {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .blk[data-type="events"] .w-content,
  .blk[data-type="tasks"] .w-content {
    overflow-y: auto;
    scrollbar-width: thin;
    padding-right: 0.15rem;
  }

  .blk[data-type="title"] .blk-body {
    background: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 0;
    box-shadow: none;
    padding: 0.4rem 0;
    overflow: visible;
    justify-content: center;
  }

  .hero {
    padding-right: 8.5rem;
  }

  .hero h1 {
    font-size: clamp(2.6rem, 9vw, 5.2rem);
    margin: 0;
    line-height: 1;
  }

  .blk[data-s="s"] .hero h1 {
    font-size: clamp(1.9rem, 5vw, 2.9rem);
  }

  .blk[data-s="l"] .hero h1 {
    font-size: clamp(3rem, 10vw, 6.4rem);
  }

  .hero p {
    max-width: 44rem;
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--muted);
    margin: 0.6rem 0 0;
  }

  .blk[data-s="s"] .hero p {
    font-size: 0.92rem;
  }

  .blk-body.link {
    padding: 0;
    display: block;
    transition: border-color 0.25s, transform 0.25s;
  }

  .blk-body.link:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  a.tile {
    display: block;
    height: 100%;
    box-sizing: border-box;
    padding: 1.1rem 1.2rem;
    text-decoration: none;
    color: inherit;
    position: relative;
    transition: transform 0.25s cubic-bezier(0.2, 1.2, 0.3, 1);
  }

  .tile .ico {
    width: 2.8rem;
    height: 2.8rem;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: var(--card-2);
    color: var(--accent);
    margin-bottom: 0.7rem;
    transition: transform 0.3s cubic-bezier(0.3, 1.6, 0.4, 1), background 0.25s, color 0.25s;
  }

  .tile .ico svg {
    width: 1.4rem;
    height: 1.4rem;
  }

  .blk-body.link:hover .ico {
    transform: scale(1.1) rotate(-6deg);
    background: var(--accent);
    color: var(--on-accent);
  }

  .tile h2 {
    margin: 0 0 0.2rem;
    font-size: 1.4rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tile p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .blk[data-type="page"][data-s="m"] .tile {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0 1rem;
    align-content: center;
  }

  .blk[data-type="page"][data-s="m"] .ico {
    grid-row: span 2;
    margin: 0;
    width: 3.4rem;
    height: 3.4rem;
  }

  .tile .go {
    position: absolute;
    right: 1rem;
    top: 1.1rem;
    color: var(--muted);
    transition: transform 0.25s, color 0.25s;
  }

  .blk-body.link:hover .go {
    transform: translateX(4px);
    color: var(--accent);
  }

  .li {
    display: flex;
    gap: 0.65rem;
    align-items: center;
    padding: 0.44rem 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    text-decoration: none;
    color: inherit;
    min-width: 0;
    flex-shrink: 0;
  }

  .li:last-child {
    border-bottom: 0;
  }

  .li .bar {
    width: 0.28rem;
    align-self: stretch;
    border-radius: 3px;
    background: var(--c, var(--accent));
    flex: none;
  }

  .li .t {
    flex: 1;
    min-width: 0;
  }

  .li .t b {
    display: block;
    font-size: 0.92rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  .blk[data-s="l"] .li .t b {
    white-space: normal;
  }

  .li .t small {
    color: var(--muted);
    display: block;
    font-size: 0.78rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.28;
  }

  .li .t .snip {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .li input.ck {
    appearance: none;
    -webkit-appearance: none;
    width: 1.24rem !important;
    height: 1.24rem !important;
    min-width: 1.24rem !important;
    min-height: 1.24rem !important;
    max-width: 1.24rem !important;
    max-height: 1.24rem !important;
    padding: 0 !important;
    margin: 0 !important;
    aspect-ratio: 1 / 1;
    border-radius: 50% !important;
    border: 2px solid var(--c, var(--accent)) !important;
    background: transparent !important;
    cursor: pointer;
    flex: 0 0 1.24rem !important;
    box-sizing: border-box !important;
    display: inline-grid !important;
    place-items: center;
    transition: transform 0.16s var(--apple-spring), background 0.16s;
  }

  .li input.ck:hover {
    transform: scale(1.1);
  }

  .li input.ck:checked {
    background: var(--c, var(--accent)) !important;
  }

  .li input.ck:checked::after {
    content: "✓";
    color: #fff;
    font-size: 0.75rem;
    font-weight: 800;
    line-height: 1;
  }

  .chip2 {
    display: inline-block;
    font-size: 0.68rem;
    padding: 0.04rem 0.46rem;
    border-radius: 999px;
    background: var(--c, var(--accent));
    color: #fff;
    margin-right: 0.22rem;
    font-weight: 700;
  }

  .soft {
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.4;
  }

  .more {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    margin-top: auto;
    padding-top: 0.35rem;
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
    font-size: 0.84rem;
  }

  .bigtime {
    font-family: var(--display);
    font-size: clamp(2rem, 4.8vw, 2.85rem);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .blk[data-type="clock"][data-s="s"] .blk-body {
    padding: 0.72rem 1rem;
    justify-content: space-between;
  }

  .blk[data-type="clock"][data-s="s"] .blk-body h3 {
    margin-bottom: 0.15rem;
    font-size: 0.72rem;
  }

  .blk[data-type="clock"][data-s="s"] .bigtime {
    font-size: clamp(1.45rem, 2.8vw, 1.8rem);
  }

  .blk[data-type="clock"][data-s="l"] .w-content {
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .blk[data-type="clock"][data-s="l"] .bigtime {
    font-size: clamp(3.3rem, 7vw, 4.9rem);
    line-height: 0.96;
    letter-spacing: -0.03em;
    margin: auto 0 0.25rem;
  }

  .blk[data-type="clock"][data-s="l"] .clock-sub-row {
    justify-content: center;
    gap: 0.55rem;
    margin-bottom: auto;
  }

  .blk[data-type="clock"][data-s="l"] #x {
    width: 100%;
  }

  .clock-sub-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    flex-wrap: wrap;
    margin-top: 0.2rem;
  }

  .tz-pill {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.12rem 0.48rem;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
  }

  .meter2 {
    height: 0.42rem;
    border-radius: 99px;
    background: var(--card-2);
    overflow: hidden;
    margin: 0.4rem 0 0.25rem;
  }

  .meter2 i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
  }

  .blk[data-type="weather"] .w-content {
    justify-content: space-between;
    gap: 0.42rem;
  }

  .wxm {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    color: inherit;
  }

  .wxm .wxi {
    width: 3.1rem;
    height: 3.1rem;
    flex: none;
  }

  .wxm .tt {
    font-family: var(--display);
    font-size: 2.15rem;
    font-weight: 800;
    line-height: 1;
  }

  .wx-s-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.38rem;
    flex: 1;
    align-content: stretch;
  }

  .wx-s-box {
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.38rem 0.55rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--muted);
    line-height: 1.2;
  }

  .wx-s-box b {
    display: block;
    color: var(--text);
    font-size: 0.84rem;
    font-weight: 700;
    margin-top: 2px;
  }

  .wxrow {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.35rem;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 0.45rem 0.5rem;
    text-align: center;
  }

  .wxrow.wxrow-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .wxrow div {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .wxrow b {
    display: block;
    color: var(--text);
    font-size: 0.88rem;
    margin-top: 2px;
  }

  .wxh {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 0.35rem;
    overflow: hidden;
  }

  .wxh div {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.38rem 0.2rem;
    min-width: 0;
  }

  .wxh .wxi {
    width: 1.45rem;
    height: 1.45rem;
    display: block;
    margin: 0.12rem auto;
  }

  .wxh b {
    display: block;
    color: var(--text);
    font-size: 0.82rem;
  }

  .wxd-list {
    display: flex;
    flex-direction: column;
    gap: 0.18rem;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 0.4rem 0.65rem;
  }

  .wxd {
    display: grid;
    grid-template-columns: 2.8rem 1.5rem 1fr auto;
    gap: 0.45rem;
    align-items: center;
    font-size: 0.8rem;
    padding: 0.14rem 0;
  }

  .wxd .wxi {
    width: 1.35rem;
    height: 1.35rem;
  }

  .qt {
    font-family: var(--display);
    font-weight: 600;
    line-height: 1.38;
    font-size: 1.05rem;
    margin: auto 0;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .blk[data-s="s"] .qt {
    font-size: 0.9rem;
    -webkit-line-clamp: 5;
    line-clamp: 5;
  }

  .word {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    min-height: 0;
  }

  .word b.w {
    font-family: var(--display);
    font-size: 1.45rem;
    line-height: 1.15;
  }

  .blk[data-s="s"] .word b.w {
    font-size: 1.18rem;
  }

  .word p {
    font-size: 0.85rem;
    line-height: 1.38;
    margin: 0.28rem 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .timerb {
    display: flex;
    gap: 0.85rem;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: inherit;
    flex: 1;
    min-height: 0;
  }

  .trow {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.6rem;
    align-items: center;
    flex: 1;
    min-height: 0;
  }

  .trow a {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.22rem;
    text-decoration: none;
    color: inherit;
    min-width: 0;
  }

  .trow a b {
    font-size: 0.84rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .linkchips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    align-content: flex-start;
    overflow: hidden;
  }

  .linkchips a {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.45rem 0.82rem;
    border-radius: 999px;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    text-decoration: none;
    color: var(--text);
    font-size: 0.84rem;
    font-weight: 600;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: border-color 0.2s, transform 0.2s;
  }

  .linkchips a:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .linkchips svg {
    width: 0.92rem;
    height: 0.92rem;
    color: var(--accent);
    flex-shrink: 0;
  }

  .linkchips small {
    color: var(--muted);
    font-weight: 400;
  }

  .refr {
    margin-left: auto;
    padding: 0.2rem 0.4rem;
    border-radius: 8px;
  }

  .editing .blk > .blk-body {
    outline: 2px dashed color-mix(in srgb, var(--accent) 75%, transparent);
    outline-offset: 2px;
    pointer-events: none;
  }

  .editing .blk.dragging {
    z-index: 60;
    opacity: 0.92;
    transition: none;
  }

  .editing .blk.dragging > .blk-body {
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55);
  }

  .ph-slot {
    grid-column: calc(var(--x) + 1) / span var(--w);
    grid-row: calc(var(--y) + 1) / span var(--h);
    border-radius: 20px;
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    border: 2px solid var(--accent);
    z-index: 0;
    pointer-events: none;
  }

  .tools {
    display: none;
    position: absolute;
    right: 0.5rem;
    top: 0.5rem;
    z-index: 6;
    gap: 0.2rem;
    padding: 0.25rem;
    border-radius: 12px;
    background: var(--card-solid);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  .editing .tools {
    display: flex;
  }

  .tools button {
    width: 1.95rem;
    height: 1.95rem;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: transparent;
    border: 0;
    font-size: 0.76rem;
    font-weight: 700;
  }

  .tools button:hover {
    background: var(--card-2);
    transform: none;
  }

</head>
<body data-page="home">
<header id="topbar"></header>
<main>
  <div class="homebar-wrap">
    <div class="homebar" id="homebar"></div>
  </div>
  <div class="blocks" id="blocks"></div>
</main>
<script>
DB.whenReady(()=>{
const $=id=>document.getElementById(id), W=window.P23W, CD=window.P23CD, KEY="p23.home", GKEY="p23.homeGuest";
const COLS=6, ROW=116, GAP=16, MAX_LINKS=6;
const OLD_SUBTITLE="Your personal command center for daily schedules, smart reminders, rich notes, live weather, countdowns, and focus flights—customizable with interactive widgets that sync across all your devices.";
const DEFAULT_SUBTITLE="Your personal command center with eighteen different utility functions and two online web games all in one place, powered by Agent PICO and sync across all your devices.";
const DEFAULT_PAGE_IDS=["calendar","todo","countdown","timeuntil","focus","notes","weather"];

const SIZES={
  title:{s:[3,2],m:[6,2],l:[6,3]},
  page:{s:[2,2],m:[3,2]},
  events:{s:[2,2],m:[3,3],l:[4,4]},
  tasks:{s:[2,2],m:[3,3],l:[4,4]},
  focus:{s:[2,2],m:[3,2],l:[3,3]},
  notes:{s:[2,2],m:[3,3]},
  timer:{s:[2,2],m:[3,2],l:[4,3]},
  links:{s:[2,2],m:[3,2],l:[4,3]},
  weather:{s:[2,2],m:[3,3],l:[4,4]},
  clock:{s:[2,1],m:[3,2],l:[4,2]},
  quote:{s:[2,2],m:[3,2]},
  word:{s:[2,2],m:[3,2]}
};
const DEF_SIZE={title:"m",page:"s",events:"m",tasks:"m",focus:"s",notes:"m",timer:"s",links:"m",weather:"m",clock:"s",quote:"m",word:"m"};
const META={
  title:["Title / text","sparkle"],
  events:["Upcoming events","cal"],
  tasks:["Reminders","todo"],
  focus:["Focus status","plane"],
  notes:["Recent notes","note"],
  timer:["Time until","timer"],
  links:["Links","link"],
  weather:["Weather","cloud"],
  clock:["Clock","clock"],
  quote:["Quote of the day","quote"],
  word:["Word of the day","book"]
};
const CONFIGURABLE=new Set(["title","tasks","timer","links","clock"]);
const uid=()=>DB.uid();
const isMobile=()=>matchMedia("(max-width: 820px)").matches;
const effSize=b=>(isMobile()&&b.type!=="page")?"m":b.s;
const dims=b=>{ const d=(SIZES[b.type]||SIZES.page)[b.s]||(SIZES[b.type]||SIZES.page)[DEF_SIZE[b.type]||"s"]; return {w:d[0],h:d[1]}; };
const hit=(a,b)=>{ const A=dims(a),B=dims(b); return a.x<b.x+B.w && b.x<a.x+A.w && a.y<b.y+B.h && b.y<a.y+A.h; };

let home=null;
function firstFit(w,h,skip){
  for(let y=0;y<400;y++) for(let x=0;x<=COLS-w;x++){
    if(!home.blocks.some(o=>o.id!==skip && x<o.x+dims(o).w && o.x<x+w && y<o.y+dims(o).h && o.y<y+h)) return {x,y};
  }
  return {x:0,y:0};
}
function resolve(...seedIds){
  const list=home.blocks, queue=seedIds.map(id=>list.find(x=>x.id===id)).filter(Boolean);
  let guard=0;
  while(queue.length && guard++<800){
    const m=queue.shift();
    if(!m) break;
    for(const o of list){
      if(o===m||!hit(m,o)) continue;
      o.y=m.y+dims(m).h;
      queue.push(o);
    }
  }
}
const mk=(type,x,y,s,cfg)=>({id:uid(),type,s:s||DEF_SIZE[type],x,y,cfg:cfg||{}});
function DEFAULT(){
  const b=[mk("title",0,0,"m",{title:"Project 23",subtitle:DEFAULT_SUBTITLE})];
  const wanted=["calendar","todo","countdown","focus","notes","weather"];
  const picked=[];
  wanted.forEach(wid=>{
    const found=DB.pages.find(p=>p.id.toLowerCase()===wid || (wid==="countdown" && /countdown|timeuntil/i.test(p.id+" "+p.href)));
    if(found && !picked.includes(found)) picked.push(found);
  });
  picked.forEach((p,i)=>b.push(mk("page",(i%3)*2,2+Math.floor(i/3)*2,"s",{page:p.id})));
  return {blocks:b};
}
function normalize(h){
  h.blocks=(h.blocks||[]).filter(b=>b&&SIZES[b.type]);
  const onlyTitleAndPages=h.blocks.length>7 && h.blocks.every(b=>b.type==="title"||b.type==="page");
  if(onlyTitleAndPages){
    h.blocks=h.blocks.filter(b=>b.type==="title" || DEFAULT_PAGE_IDS.includes(String(b.cfg&&b.cfg.page||"").toLowerCase()));
    let pi=0;
    h.blocks.forEach(b=>{
      if(b.type==="page"){
        b.x=(pi%3)*2;
        b.y=2+Math.floor(pi/3)*2;
        pi++;
      }
    });
  }
  const seen=new Set();
  h.blocks.forEach(b=>{ if(!b.id||b.id==="null"||seen.has(b.id)) b.id=uid(); seen.add(b.id); });
  h.blocks.forEach(b=>{
    b.cfg=b.cfg||{};
    if(b.type==="title" && b.cfg.subtitle===OLD_SUBTITLE) b.cfg.subtitle=DEFAULT_SUBTITLE;
    if(b.type==="links" && Array.isArray(b.cfg.links) && b.cfg.links.length>MAX_LINKS) b.cfg.links=b.cfg.links.slice(0,MAX_LINKS);
    const key=b.s||b.size;
    b.s=SIZES[b.type][key]?key:DEF_SIZE[b.type];
    delete b.size;
  });
  home=h;
  const need=h.blocks.filter(b=>!Number.isInteger(b.x)||!Number.isInteger(b.y));
  need.forEach(b=>{ b.x=-99; b.y=-99; });
  need.forEach(b=>{ const d=dims(b), p=firstFit(d.w,d.h,b.id); b.x=p.x; b.y=p.y; });
  h.blocks.forEach(b=>{ b.x=Math.max(0,Math.min(COLS-dims(b).w,b.x)); b.y=Math.max(0,b.y); });
  return h;
}
function loadHome(){
  let h=null;
  if(DB.isGuest()){ try{ h=JSON.parse(localStorage.getItem(GKEY)); }catch{} }
  else h=DB.get(KEY,null);
  return normalize(h&&h.blocks?h:DEFAULT());
}
function saveHome(){
  if(DB.isGuest()) localStorage.setItem(GKEY,JSON.stringify(home));
  else DB.set(KEY,home);
}
home=loadHome();
let editing=false, lives=[];

const events=()=>DB.loadEvents(), todos=()=>DB.get("p23.todos",[]), notes=()=>DB.get("p23.notes",[]), cds=()=>DB.get("p23.countdowns",[]), flights=()=>DB.get("p23.flightLog",[]), wx=()=>DB.get("p23.weather",null);
const signPrompt=what=>`<p class="soft">Sign in to see ${what}.</p><button class="primary" data-sign>Sign in</button>`;
const wireSign=el=>el.querySelectorAll("[data-sign]").forEach(x=>x.onclick=()=>DB.requireAuth());
const when=ms=>{
  const d=new Date(ms), t=new Date(), tm=new Date(Date.now()+86400000);
  const day=d.toDateString()===t.toDateString()?"Today":d.toDateString()===tm.toDateString()?"Tomorrow":d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});
  return day+", "+DB.fmtTime(ms);
};
const rel=ms=>{
  const m=Math.round((ms-Date.now())/60000);
  if(m<=0) return "now";
  if(m<60) return "in "+m+" min";
  const h=Math.round(m/60);
  if(h<24) return "in "+h+" h";
  const d=Math.round(h/24);
  return "in "+d+" day"+(d===1?"":"s");
};
const ext=u=>/^https?:/i.test(u);
const N={s:{events:8,tasks:8,notes:3},m:{events:14,tasks:14,notes:5},l:{events:24,tasks:24,notes:5}};

function clearBlockLives(blockId){
  lives=lives.filter(l=>l.blockId!==blockId);
}

const R={
  title(el,b){
    const t=b.cfg.title||"", wm=t.trim()==="Project 23";
    el.innerHTML=`<div class="hero"><h1>${wm?DB.wordmark():DB.esc(t)}</h1>${b.cfg.subtitle?`<p>${DB.esc(b.cfg.subtitle)}</p>`:""}</div>`;
  },
  page(el,b){
    const p=DB.pages.find(x=>x.id===b.cfg.page);
    if(!p){ el.textContent=""; return; }
    el.classList.add("link");
    el.innerHTML=`<a class="tile" href="${DB.esc(p.href)}"><span class="ico">${DB.icon(p.icon)}</span><span class="go">${DB.icon("left").replace("<svg","<svg style='transform:rotate(180deg)'")}</span><h2>${DB.esc(p.name)}</h2><p>${DB.esc(p.desc||"")}</p></a>`;
  },
  events(el,b){
    const sz=effSize(b);
    el.innerHTML=`<h3>${DB.icon("cal")}Upcoming events</h3><div class="w-content" id="c"></div>`;
    const c=el.querySelector("#c");
    if(DB.isGuest()){ c.innerHTML=signPrompt("your upcoming events"); wireSign(c); return; }
    const now=Date.now(), list=[];
    events().forEach(ev=>DB.occurrences(ev,new Date(now-3600000),new Date(now+60*86400000)).forEach(o=>{ if(o.end>=now||o.start>=now) list.push(o); }));
    list.sort((a,z)=>a.start-z.start);
    c.innerHTML=list.length
      ? list.slice(0,N[sz].events).map(o=>`<a class="li" href="pages/calendar.html" style="--c:${o.ev.color||"var(--accent)"}"><i class="bar"></i><span class="t"><b>${DB.esc(o.ev.title)}</b><small>${o.ev.allDay?new Date(o.start).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})+" · all day":when(o.start)}${sz==="l"&&!o.ev.allDay?" · "+rel(o.start):""}</small>${sz!=="s"&&o.ev.location?`<small>${DB.icon("pin")} ${DB.esc(o.ev.location)}</small>`:""}${sz==="l"&&o.ev.notes?`<small class="snip">${DB.esc(o.ev.notes.slice(0,90))}</small>`:""}</span></a>`).join("")
      : '<p class="soft">Nothing coming up.</p>';
  },
  tasks(el,b){
    const sz=effSize(b);
    el.innerHTML=`<h3>${DB.icon("todo")}${DB.esc(b.cfg.list||"Reminders")}</h3><div class="w-content" id="c"></div>`;
    const c=el.querySelector("#c");
    if(DB.isGuest()){ c.innerHTML=signPrompt("your reminders"); wireSign(c); return; }
    const all=todos(), list=all.filter(t=>!t.done&&(!b.cfg.list||t.category===b.cfg.list)).sort((x,y)=>((x.due?x.due+(x.time||"23:59"):"9999")>(y.due?y.due+(y.time||"23:59"):"9999")?1:-1)).slice(0,N[sz].tasks);
    c.innerHTML=list.length?"":'<p class="soft">All caught up.</p>';
    list.forEach(t=>{
      const r=document.createElement("div");
      r.className="li";
      r.style.setProperty("--c",t.color||"var(--accent)");
      const due=t.due?new Date(t.due+"T00:00").toLocaleDateString([],{month:"short",day:"numeric"})+(t.time?" · "+DB.fmtTime(DB.fromInputs(t.due,t.time)):""):"No date";
      r.innerHTML=`<input type="checkbox" class="ck" aria-label="Mark done: ${DB.esc(t.title)}"><a class="t" href="pages/todo.html" style="text-decoration:none;color:inherit"><b>${DB.esc(t.title)}</b><small>${due}${sz!=="s"&&t.category?` · <span class="chip2">${DB.esc(t.category)}</span>`:""}${sz==="l"&&t.tags&&t.tags.length?" "+t.tags.map(x=>"#"+DB.esc(x)).join(" "):""}</small>${sz==="l"&&t.notes?`<small class="snip">${DB.esc(t.notes.slice(0,100))}</small>`:""}</a>`;
      r.querySelector(".ck").onchange=e=>{
        t.done=e.target.checked;
        DB.set("p23.todos",all);
        setTimeout(()=>{
          home.blocks.filter(x=>x.type==="tasks").forEach(tb=>renderBlock(tb.id));
        },220);
      };
      c.appendChild(r);
    });
  },
  focus(el,b){
    const sz=effSize(b);
    el.innerHTML=`<h3>${DB.icon("plane")}Focus</h3><div class="w-content" id="c"></div>`;
    const c=el.querySelector("#c"), f=DB.get("p23.activeFlight",null);
    if(f){
      const left=()=>{ const now=Date.now(), paused=f.pauses.reduce((a,p)=>a+((p.e??now)-p.s),0); return Math.max(0,f.mins*60000-(now-f.startedAt-paused)); };
      const draw=()=>{ const sNow=effSize(b), r=left(), m=Math.ceil(r/60000); c.innerHTML=`<a class="li" href="pages/focus.html" style="text-decoration:none"><span class="t"><b>${DB.esc(f.from[1])} to ${DB.esc(f.to[1])}</b><small>${r<=0?"Landing now":m>=60?Math.floor(m/60)+"h "+(m%60)+"m left":m+" min left"}${sNow!=="s"?" · seat "+DB.esc(f.seat||""):""}</small></span></a>`; };
      draw();
      lives.push({blockId:b.id,every:30000,fn:draw});
      return;
    }
    const log=flights(), mins=log.reduce((a,l)=>a+l.mins,0);
    if(!log.length){ c.innerHTML=`<p class="soft">${DB.isGuest()?"Sign in to start a focus flight.":"No flights yet. Ready for boarding?"}</p><a class="more" href="pages/focus.html">Open Focus →</a>`; return; }
    c.innerHTML=`<div class="bigtime">${Math.floor(mins/60)}h ${String(mins%60).padStart(2,"0")}m</div><p class="soft" style="margin:.2rem 0 0">focused over ${log.length} flight${log.length===1?"":"s"}</p>`+
      (sz==="s"?"":`<p class="soft" style="margin:.25rem 0 0">Last: ${DB.esc(log[0].from)} → ${DB.esc(log[0].to)}</p>`)+
      (sz==="l"?log.slice(0,2).map(l=>`<div class="li"><span class="t"><b>${DB.esc(l.from)} to ${DB.esc(l.to)}</b><small>${Math.floor(l.mins/60)}h ${l.mins%60}m · ${new Date(l.date).toLocaleDateString([],{month:"short",day:"numeric"})}</small></span></div>`).join(""):"")+
      `<a class="more" href="pages/focus.html">Start another flight →</a>`;
  },
  notes(el,b){
    const sz=effSize(b);
    el.innerHTML=`<h3>${DB.icon("note")}Recent notes</h3><div class="w-content" id="c"></div>`;
    const c=el.querySelector("#c");
    if(DB.isGuest()){ c.innerHTML=signPrompt("your notes"); wireSign(c); return; }
    const l=[...notes()].sort((a,z)=>(z.pinned?1:0)-(a.pinned?1:0)||z.updated-a.updated).slice(0,N[sz].notes), len=sz==="m"?65:40;
    c.innerHTML=l.length
      ? l.map(n=>`<a class="li" href="pages/notes.html#${n.id}"><span class="t"><b>${DB.esc(n.title||"Untitled note")}</b><small class="snip">${DB.esc((n.preview||"No additional text").slice(0,len))}</small></span></a>`).join("")
      : '<p class="soft">No notes yet.</p><a class="more" href="pages/notes.html">Write one →</a>';
  },
  timer(el,b){
    const sz=effSize(b);
    el.innerHTML=`<h3>${DB.icon("timer")}Time until</h3><div class="w-content" id="c"></div>`;
    const c=el.querySelector("#c");
    if(DB.isGuest()){ c.innerHTML=signPrompt("your countdowns"); wireSign(c); return; }
    if(!CD){ c.innerHTML='<p class="soft">Countdowns ready.</p>'; return; }
    const all=cds(), n0=Date.now();
    let up=all.filter(x=>x.target>n0).sort((a,z)=>a.target-z.target);
    const pick=b.cfg.id?all.find(x=>x.id===b.cfg.id):null;
    if(pick) up=[pick,...up.filter(x=>x.id!==pick.id)];
    if(!up.length){ c.innerHTML='<p class="soft">No countdown to show.</p><a class="more" href="pages/timeUntil.html">Add one →</a>'; return; }
    const show=sz==="l"?up.slice(0,3):[up[0]], size=sz==="s"?86:sz==="m"?102:90;
    if(sz==="l"){
      c.innerHTML='<div class="trow">'+show.map(x=>`<a href="pages/timeUntil.html" data-i="${x.id}">${CD.ring(x,size)}<b>${DB.esc(x.title)}</b><span class="soft line"></span></a>`).join("")+"</div>";
    } else {
      c.innerHTML=`<a class="timerb" href="pages/timeUntil.html" data-i="${show[0].id}">${CD.ring(show[0],size)}<span style="min-width:0"><b style="font-family:var(--display);font-size:${sz==="s"?"0.95rem":"1.15rem"};display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${DB.esc(show[0].title)}</b><span class="soft line"></span></span></a>`;
    }
    const upd=()=>{
      const n=Date.now();
      c.querySelectorAll("[data-i]").forEach(a=>{
        const x=all.find(y=>y.id===a.dataset.i);
        if(!x) return;
        CD.tick(a,x,n);
        const l=a.querySelector(".line");
        if(l){ const t=CD.line(x,n); if(l.textContent!==t) l.textContent=t; }
      });
    };
    upd();
    lives.push({blockId:b.id,every:1000,fn:upd});
  },
  links(el,b){
    const sz=effSize(b);
    const maxShow=sz==="s"?4:MAX_LINKS;
    const ls=(b.cfg.links||[]).slice(0,maxShow);
    el.innerHTML=`<h3>${DB.icon("link")}${DB.esc(b.cfg.title||"Links")}</h3><div class="linkchips w-content" id="c"></div>`;
    const c=el.querySelector("#c");
    c.innerHTML=ls.length
      ? ls.map(l=>{

function buildToolsEl(b){
  const sizeKeys=Object.keys(SIZES[b.type]);
  const t=document.createElement("div");
  t.className="tools";
  t.innerHTML=`<button class="grip" aria-label="Drag to move (or use arrow keys)" title="Drag to swap or move">${DB.icon("grip")}</button><button class="mv" data-a="up" aria-label="Move earlier" title="Move earlier">${DB.icon("up")}</button><button class="mv" data-a="down" aria-label="Move later" title="Move later">${DB.icon("down")}</button>${sizeKeys.length>1?`<button data-a="size" aria-label="Change size" title="Change size (${sizeKeys.map(x=>x.toUpperCase()).join(" / ")})">${b.s.toUpperCase()}</button>`:""}${CONFIGURABLE.has(b.type)?`<button data-a="cfg" aria-label="Block settings" title="Settings">${DB.icon("gear")}</button>`:""}<button data-a="rm" class="rm" aria-label="Remove block" title="Remove">${DB.icon("trash")}</button>`;
  t.addEventListener("click",e=>{
    const btn=e.target.closest("button[data-a]");
    if(btn) act(b.id,btn.dataset.a);
  });
  const grip=t.querySelector(".grip");
  grip.addEventListener("pointerdown",e=>{
    const blkEl=t.closest(".blk");
    if(blkEl) startDrag(e,b.id,blkEl,grip);
  });
  grip.addEventListener("keydown",e=>keyMove(e,b.id));
  return t;
}

function createBlockEl(b,k=0){

function syncLayout(){
  const root=$("blocks");
  root.classList.toggle("editing",editing);
  const rows=Math.max(3,...home.blocks.map(b=>b.y+dims(b).h))+(editing?2:0);
  root.style.setProperty("--rows",rows);

  let cells=root.querySelector(".cells");
  if(editing){
    if(!cells){
      cells=document.createElement("div");
      cells.className="cells";
      root.prepend(cells);
    }
    cells.hidden=false;
    const needed=rows*COLS;
    if(cells.children.length!==needed) cells.innerHTML="<i></i>".repeat(needed);
  } else if(cells){
    cells.hidden=true;
  }

  let emptyEl=root.querySelector(".empty");
  if(!home.blocks.length){
    if(!emptyEl){
      emptyEl=document.createElement("div");
      emptyEl.className="empty";
      root.appendChild(emptyEl);
    }
    emptyEl.innerHTML=`<div>Your home page is empty.<br><br>${editing?'<button class="primary" id="emptyAdd">Add a block</button>':'<button class="primary" id="emptyEdit">Customize</button>'}</div>`;
    const a=emptyEl.querySelector("#emptyAdd"); if(a) a.onclick=addPicker;
    const c=emptyEl.querySelector("#emptyEdit"); if(c) c.onclick=()=>{ editing=true; syncLayout(); bar(); };
  } else if(emptyEl){
    emptyEl.remove();
  }

  const order=[...home.blocks].sort((a,z)=>a.y-z.y||a.x-z.x).map(b=>b.id);
  home.blocks.forEach(b=>{
    const el=root.querySelector(`.blk[data-id="${b.id}"]`);
    if(!el) return;
    const d=dims(b);
    el.dataset.s=effSize(b);
    el.style.setProperty("--x",b.x);
    el.style.setProperty("--y",b.y);
    el.style.setProperty("--w",d.w);
    el.style.setProperty("--h",d.h);
    el.style.setProperty("--o",order.indexOf(b.id));
  });
}

function renderAll(){

function act(id,a){
  const b=home.blocks.find(x=>x.id===id);
  if(!b) return;
  if(a==="rm"){
    home.blocks=home.blocks.filter(x=>x.id!==id);
    clearBlockLives(id);
    const el=document.querySelector(`.blk[data-id="${id}"]`);
    if(el) el.remove();
    saveHome();
    syncLayout();
    return;
  }
  if(a==="size"){
    if(isMobile() && b.type!=="page") return;
    const keys=Object.keys(SIZES[b.type]);
    b.s=keys[(keys.indexOf(b.s)+1)%keys.length];
    b.x=Math.min(b.x,COLS-dims(b).w);
    resolve(id);
    saveHome();
    renderBlock(id);
    syncLayout();
    return;
  }
  if(a==="cfg"){
    return configure(b);
  }
  if(a==="up"||a==="down"){
    const sorted=[...home.blocks].sort((p,q)=>p.y-q.y||p.x-q.x);
    const i=sorted.findIndex(x=>x.id===id);
    const o=sorted[i+(a==="up"?-1:1)];
    if(o){
      [b.x,o.x]=[o.x,b.x];
      [b.y,o.y]=[o.y,b.y];
      b.x=Math.min(b.x,COLS-dims(b).w);
      o.x=Math.min(o.x,COLS-dims(o).w);
      resolve(b.id,o.id);
      saveHome();
      syncLayout();
    }
  }
}

function keyMove(e,id){
  const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(!d) return;
  e.preventDefault();
  const b=home.blocks.find(x=>x.id===id);
  if(!b) return;
  const origX=b.x, origY=b.y;
  const nextX=Math.max(0,Math.min(COLS-dims(b).w,b.x+d[0]));
  const nextY=Math.max(0,b.y+d[1]);
  const probe={id:b.id,type:b.type,s:b.s,x:nextX,y:nextY};
  const target=home.blocks.find(o=>o.id!==b.id && hit(probe,o));
  if(target){
    b.x=Math.min(COLS-dims(b).w,target.x);
    b.y=target.y;
    target.x=Math.min(COLS-dims(target).w,origX);
    target.y=origY;
    resolve(b.id,target.id);
  } else {
    b.x=nextX;
    b.y=nextY;
    resolve(id);
  }
  saveHome();
  syncLayout();
  const g=document.querySelector(`.blk[data-id="${id}"] .grip`);
  if(g) g.focus();
}

function findSwapTarget(dragBlk,tx,ty){
  const d=dims(dragBlk);
  const cx=tx+d.w/2, cy=ty+d.h/2;
  let best=null, bestDist=Infinity;
  for(const o of home.blocks){
    if(o.id===dragBlk.id) continue;
    const od=dims(o);
    const overlaps=tx<o.x+od.w && o.x<tx+d.w && ty<o.y+od.h && o.y<ty+d.h;
    if(overlaps){
      const ocx=o.x+od.w/2, ocy=o.y+od.h/2;
      const dist=Math.hypot(cx-ocx,cy-ocy);
      if(dist<bestDist){ bestDist=dist; best=o; }
    }
  }
  return best;
}

function startDrag(e,id,el,grip){
  if(e.button>0) return;
  e.preventDefault();
  const b=home.blocks.find(x=>x.id===id), d=dims(b), root=$("blocks"), gr=root.getBoundingClientRect();
  const origX=b.x, origY=b.y;
  const cw=(gr.width-GAP*(COLS-1))/COLS, stepX=cw+GAP, stepY=ROW+GAP, sx=e.clientX, sy=e.clientY, sScroll=scrollY;
  try{ grip.setPointerCapture(e.pointerId); }catch{}
  el.classList.add("dragging");
  const ph=document.createElement("div");
  ph.className="ph-slot";
  ph.style.cssText=`--x:${b.x};--y:${b.y};--w:${d.w};--h:${d.h}`;
  root.appendChild(ph);
  let tx=b.x, ty=b.y, lastX=e.clientX, lastY=e.clientY, hoverTarget=null;

  const clearHover=()=>{
    root.querySelectorAll(".blk.swap-target").forEach(node=>node.classList.remove("swap-target"));
  };

  const update=()=>{
    const dx=lastX-sx, dy=lastY-sy+(scrollY-sScroll);
    el.style.transform=`translate(${dx}px,${dy}px)`;
    tx=Math.max(0,Math.min(COLS-d.w,origX+Math.round(dx/stepX)));
    ty=Math.max(0,origY+Math.round(dy/stepY));
    ph.style.setProperty("--x",tx);
    ph.style.setProperty("--y",ty);
    clearHover();
    hoverTarget=findSwapTarget(b,tx,ty);
    if(hoverTarget){
      const tEl=root.querySelector(`.blk[data-id="${hoverTarget.id}"]`);
      if(tEl) tEl.classList.add("swap-target");
    }
  };

  const move=ev=>{
    lastX=ev.clientX;
    lastY=ev.clientY;
    update();
    const edge=70;
    if(ev.clientY>innerHeight-edge) scrollBy(0,18);
    else if(ev.clientY<edge+70) scrollBy(0,-18);
  };

  const done=commit=>{
    grip.removeEventListener("pointermove",move);
    grip.removeEventListener("pointerup",up);
    grip.removeEventListener("pointercancel",cancel);
    clearHover();
    ph.remove();
    el.classList.remove("dragging");
    el.style.transform="";
    if(commit){
      const swapWith=findSwapTarget(b,tx,ty);
      if(swapWith){
        const swX=swapWith.x, swY=swapWith.y;
        b.x=Math.max(0,Math.min(COLS-dims(b).w,swX));
        b.y=Math.max(0,swY);
        swapWith.x=Math.max(0,Math.min(COLS-dims(swapWith).w,origX));
        swapWith.y=Math.max(0,origY);
        resolve(b.id,swapWith.id);
      } else {
        b.x=tx;
        b.y=ty;
        resolve(id);
      }
      saveHome();
    }
    syncLayout();
  };

  const up=()=>done(true), cancel=()=>done(false);
  grip.addEventListener("pointermove",move);
  grip.addEventListener("pointerup",up);
  grip.addEventListener("pointercancel",cancel);
}

function addPicker(){
  const n=document.createElement("div");
  n.className="picker";
  const opt=(label,icon,make)=>({label,icon,make});
  const groups=[
    ["Pages",DB.pages.map(p=>opt(p.name,p.icon,()=>mk("page",0,0,"s",{page:p.id})))],
    ["Your things",["events","tasks","focus","notes","timer"].map(t=>opt(META[t][0],META[t][1],()=>mk(t,0,0,isMobile()?"m":null,t==="tasks"?{list:""}:{})))],
    ["Widgets",["weather","clock","quote","word"].map(t=>opt(META[t][0],META[t][1],()=>mk(t,0,0,isMobile()?"m":null,{})))],
    ["Other",[opt("Links","link",()=>mk("links",0,0,isMobile()?"m":null,{title:"Quick links",links:[]})),opt("Title or text","sparkle",()=>mk("title",0,0,"m",{title:"My page",subtitle:""}))]]
  ];
  n.innerHTML="<h2>Add a block</h2>"+groups.map(([g],gi)=>`<h3>${g}</h3><div class="opts" data-g="${gi}"></div>`).join("")+'<div class="actions"><button id="pClose">Close</button></div>';
  const close=DB.modal(n);
  n.querySelector("#pClose").onclick=close;
  groups.forEach(([,items],gi)=>{
    const box=n.querySelector(`[data-g="${gi}"]`);
    items.forEach(it=>{
      const bt=document.createElement("button");
      bt.innerHTML=DB.icon(it.icon)+"<span>"+DB.esc(it.label)+"</span>";
      bt.onclick=()=>{
        const blk=it.make();
        if(isMobile() && blk.type!=="page") blk.s="m";
        const d=dims(blk), p=firstFit(d.w,d.h);
        blk.x=p.x;
        blk.y=p.y;
        home.blocks.push(blk);
        saveHome();
        close();
        const root=$("blocks");
        const newEl=createBlockEl(blk,home.blocks.length-1);
        root.appendChild(newEl);
        syncLayout();
        setTimeout(()=>{ newEl.scrollIntoView({behavior:"smooth",block:"center"}); },60);
      };
      box.appendChild(bt);
    });
  });
}

function configure(b){
  const n=document.createElement("div"), c=b.cfg;
  let body="";
  if(b.type==="title") body=`<div class="field"><label for="k1">Title</label><input id="k1" style="width:100%" value="${DB.esc(c.title||"")}"></div><div class="field"><label for="k2">Subtitle</label><textarea id="k2">${DB.esc(c.subtitle||"")}</textarea></div>`;
  if(b.type==="tasks"){
    const cats=[...new Set(todos().map(t=>t.category).filter(Boolean))];
    body=`<div class="field"><label for="k1">Reminder list</label><select id="k1"><option value="">All reminders</option>${cats.map(x=>`<option ${x===c.list?"selected":""}>${DB.esc(x)}</option>`).join("")}</select></div>`;
  }
  if(b.type==="timer") body=`<div class="field"><label for="k1">Which countdown first</label><select id="k1"><option value="">Next one coming up</option>${cds().map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${DB.esc(x.title)}</option>`).join("")}</select></div>`;
  if(b.type==="clock") body=`<div class="field"><label for="k1">Time zone</label><select id="k1">${[["","My local time"],["UTC","UTC"],["America/New_York","New York"],["America/Chicago","Chicago"],["America/Los_Angeles","Los Angeles"],["Europe/London","London"],["Europe/Paris","Paris"],["Asia/Dubai","Dubai"],["Asia/Kolkata","India"],["Asia/Tokyo","Tokyo"],["Australia/Sydney","Sydney"]].map(([v,l])=>`<option value="${v}" ${v===(c.tz||"")?"selected":""}>${l}</option>`).join("")}</select></div><div class="field"><label class="tglrow" for="k2"><span>24-hour clock</span><input type="checkbox" class="tgl" id="k2" ${c.h24?"checked":""}></label></div>`;
  if(b.type==="links") body=`<div class="field"><label for="k1">Block title</label><input id="k1" style="width:100%" value="${DB.esc(c.title||"")}"></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.35rem"><label style="margin:0">Links</label><span class="muted" id="linkCountLbl" style="font-family:var(--mono);font-size:.75rem">0 / ${MAX_LINKS}</span></div><div id="lr"></div><button id="addL" type="button" style="margin-top:.3rem">${DB.icon("plus")} Add a link</button><p class="muted" style="margin:.6rem 0 0;font-size:.82rem">Up to ${MAX_LINKS} links per block. Use a full address like https://example.com, or a page like notes.html.</p>`;
  n.innerHTML=`<h2>Block settings</h2>${body}<div class="actions"><button id="kNo" type="button">Cancel</button><button class="primary" id="kOk" type="button">Save</button></div>`;
  const close=DB.modal(n), q=id=>n.querySelector("#"+id);
  n.querySelectorAll("select").forEach(s=>DB.enhanceSelect(s));
  const rows=[...(c.links||[]).slice(0,MAX_LINKS).map(r=>({...r}))];
  const drawRows=()=>{
    const box=q("lr");
    if(!box) return;
    box.innerHTML="";
    if(q("linkCountLbl")) q("linkCountLbl").textContent=`${rows.length} / ${MAX_LINKS}`;
    if(q("addL")) q("addL").disabled=rows.length>=MAX_LINKS;
    rows.forEach((r,i)=>{
      const d=document.createElement("div");
      d.className="lrow";
      d.innerHTML=`<input placeholder="Label" value="${DB.esc(r.label||"")}" aria-label="Link label"><input placeholder="https://…" value="${DB.esc(r.url||"")}" aria-label="Link address"><button type="button" class="ghost" aria-label="Remove link">${DB.icon("x")}</button>`;
      const [l,u,x]=d.children;
      l.oninput=()=>r.label=l.value;
      u.oninput=()=>r.url=u.value;
      x.onclick=()=>{ rows.splice(i,1); drawRows(); };
      box.appendChild(d);
    });
  };
  if(b.type==="links"){
    drawRows();
    q("addL").onclick=()=>{
      if(rows.length>=MAX_LINKS){
        DB.toast("Maximum links reached",`You can add up to ${MAX_LINKS} links per block.`,2500);
        return;
      }
      rows.push({label:"",url:""});
      drawRows();
    };
  }
  q("kNo").onclick=close;
  q("kOk").onclick=()=>{
    if(b.type==="title"){ c.title=q("k1").value; c.subtitle=q("k2").value; }
    if(b.type==="tasks") c.list=q("k1").value;
    if(b.type==="timer") c.id=q("k1").value;
    if(b.type==="clock"){ c.tz=q("k1").value; c.h24=q("k2").checked; }
    if(b.type==="links"){
      c.title=q("k1").value;
      c.links=rows.filter(r=>r.url.trim()).slice(0,MAX_LINKS).map(r=>{
        let u=r.url.trim();
        if(!/^(https?:|mailto:|tel:)/i.test(u) && !/\.html?(#.*)?$/i.test(u)) u="https://"+u;
        return {label:r.label.trim(),url:u};
      });
    }
    saveHome();
    close();
    renderBlock(b.id);
  };
}

matchMedia("(max-width: 820px)").addEventListener("change",()=>{
  home.blocks.forEach(b=>{
    if(b.type!=="page") renderBlock(b.id);
  });
  syncLayout();
});

let tickN=0;
setInterval(()=>{
  if(document.hidden) return;
  tickN+=1000;
  lives.forEach(l=>{ if(tickN%l.every<1000) l.fn(); });
},1000);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) lives.forEach(l=>{ try{ l.fn(); }catch{} });
});
DB.onLogin(()=>{ home=loadHome(); renderAll(); });
renderAll();
});
</script>
</body>
</html>
