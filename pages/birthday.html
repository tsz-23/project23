<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday | Project 23</title>
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project 23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/site-config.js"></script>
<script src="js/core.js"></script>
<style>
  :root {
    --apple-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --apple-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --glass-surface: color-mix(in srgb, var(--card-solid) 82%, transparent);
    --glass-elevated: color-mix(in srgb, var(--card-2) 90%, transparent);
    --glass-border: color-mix(in srgb, var(--text) 10%, var(--line));
    --glass-spec: inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    --bd-pink: var(--accent);
    --bd-gold: #ff9f0a;
    --bd-green: #30d158;
    --bd-blue: #0a84ff;
    --bd-purple: #bf5af2;
  }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1.1rem 1rem 4.5rem;
  }

  .pagetitle {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center;
    margin: 1.2rem auto 1.35rem;
    padding: 0 1rem;
    gap: 0.42rem;
  }
  .pagetitle h1 {
    display: block;
    width: 100%;
    font-family: var(--display);
    font-size: clamp(2.3rem, 7.5vw, 4.1rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    line-height: 1.06;
    background: linear-gradient(135deg, var(--text) 25%, var(--accent) 68%, var(--accent3, var(--accent2)) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(108, 92, 231, 0.28);
    margin: 0;
  }
  .pagetitle .badge-row-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
  }
  .pagetitle .badge-sub {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.3rem 0.9rem;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--accent3, var(--accent));
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .pagetitle .badge-sub svg {
    width: 14px;
    height: 14px;
  }
  .pagetitle p {
    margin: 0.15rem auto 0;
    color: var(--muted);
    font-size: clamp(0.9rem, 1.7vw, 1.02rem);
    max-width: 600px;
    line-height: 1.5;
  }

  .bd-shell {
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
  }

  .apple-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(28px) saturate(185%);
    -webkit-backdrop-filter: blur(28px) saturate(185%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-spec), 0 18px 42px -18px rgba(0, 0, 0, 0.35);
    border-radius: 26px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .bd-alert-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.85rem;
    flex-wrap: wrap;
    padding: 0.85rem 1.05rem;
    border-radius: 18px;
    background: color-mix(in srgb, var(--bd-pink) 8%, var(--glass-elevated));
    border: 1px solid color-mix(in srgb, var(--bd-pink) 26%, var(--line));
  }
  .bd-alert-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-width: 220px;
    flex: 1;
  }
  .bd-alert-ic {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: color-mix(in srgb, var(--bd-pink) 16%, var(--card-solid));
    border: 1px solid color-mix(in srgb, var(--bd-pink) 36%, transparent);
    color: var(--bd-pink);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .bd-alert-ic svg {
    width: 21px;
    height: 21px;
  }
  .bd-alert-txt {
    display: flex;
    flex-direction: column;
    gap: 0.14rem;
    min-width: 0;
  }
  .bd-alert-txt b {
    font-family: var(--display);
    font-size: 0.94rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
  }
  .bd-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bd-green);
    box-shadow: 0 0 10px rgba(48, 209, 88, 0.55);
    display: inline-block;
  }
  .bd-status-dot.warn {
    background: var(--bd-gold);
    box-shadow: 0 0 10px rgba(255, 159, 10, 0.55);
  }
  .bd-alert-txt span {
    font-size: 0.78rem;
    color: var(--muted);
  }
  .bd-alert-actions {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
  }

  .bd-btn {
    border: 1px solid var(--glass-border);
    background: var(--glass-elevated);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.81rem;
    font-weight: 600;
    padding: 0 0.9rem;
    height: 38px;
    min-height: 38px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    box-shadow: var(--glass-spec);
    transition: all 0.18s var(--apple-ease);
    text-decoration: none;
    white-space: nowrap;
  }
  .bd-btn:hover {
    border-color: var(--bd-pink);
    background: color-mix(in srgb, var(--bd-pink) 12%, var(--card-solid));
    transform: translateY(-1px);
  }
  .bd-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--accent) 48%, transparent);
  }
  .bd-btn.primary:hover {
    filter: brightness(1.06);
  }
  .bd-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  .bd-entry-box {
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 1.05rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }
  .bd-entry-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .bd-entry-head b {
    font-family: var(--display);
    font-size: 0.95rem;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .bd-tz-presets {
    display: flex;
    align-items: center;
    gap: 0.32rem;
    flex-wrap: wrap;
  }
  .bd-tz-chip {
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--card-solid) 65%, transparent);
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.22rem 0.62rem;
    min-height: 28px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .bd-tz-chip:hover {
    color: var(--text);
    border-color: var(--bd-pink);
    transform: none;
  }
  .bd-tz-chip.active {
    background: color-mix(in srgb, var(--bd-pink) 18%, var(--card-solid));
    border-color: var(--bd-pink);
    color: var(--text);
    font-weight: 700;
  }

  .bd-entry-grid {
    display: grid;
    grid-template-columns: 1.15fr 0.95fr 1.55fr 1.35fr;
    gap: 0.7rem;
    align-items: end;
  }
  .bd-entry-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding-top: 0.25rem;
    border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
  }
  .bd-entry-bottom-left {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
    flex: 1 1 320px;
  }
  .bd-presets-lbl {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-right: 0.15rem;
  }
  .bd-field {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    min-width: 0;
  }
  .bd-field label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0;
  }
  .bd-field input[type="text"] {
    width: 100%;
    height: 42px;
    border-radius: 13px;
    padding: 0 0.8rem;
    font-size: 0.86rem;
    background: var(--card-solid);
    border: 1px solid var(--line);
    color: var(--text);
  }
  .bd-field input[type="text"]:focus {
    border-color: var(--bd-pink);
    outline: none;
  }

  .bd-date-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }
  .bd-date-input-wrap input[type="text"] {
    width: 100%;
    padding-right: 2.4rem !important;
    font-family: var(--mono);
    font-size: 0.83rem;
  }
  .bd-cal-btn {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 31px;
    height: 31px;
    min-width: 31px;
    min-height: 31px;
    padding: 0;
    border-radius: 9px;
    border: 1px solid transparent;
    background: color-mix(in srgb, var(--bd-pink) 13%, transparent);
    color: var(--bd-pink);
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.16s var(--apple-ease);
  }
  .bd-cal-btn:hover {
    background: color-mix(in srgb, var(--bd-pink) 24%, var(--card-solid));
    border-color: color-mix(in srgb, var(--bd-pink) 42%, var(--line));
    color: var(--text);
    transform: translateY(-50%) scale(1.04);
  }
  .bd-cal-btn svg {
    width: 15px;
    height: 15px;
  }

  .bd-tz-select-wrap {
    position: relative;
    width: 100%;
  }
  .bd-tz-trigger {
    width: 100%;
    height: 42px;
    min-height: 42px;
    padding: 0 0.75rem 0 0.85rem;
    border-radius: 13px;
    background: var(--card-solid);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.83rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.45rem;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.16s, background 0.16s;
  }
  .bd-tz-trigger:hover,
  .bd-tz-trigger[aria-expanded="true"] {
    border-color: var(--bd-pink);
    transform: none;
  }
  .bd-tz-trigger-main {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }
  .bd-tz-trigger-lbl {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bd-tz-trigger-sub {
    font-family: var(--mono);
    font-size: 0.69rem;
    color: var(--bd-pink);
    background: color-mix(in srgb, var(--bd-pink) 13%, transparent);
    padding: 0.12rem 0.45rem;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .bd-tz-trigger svg {
    width: 14px;
    height: 14px;
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.2s var(--apple-ease);
  }
  .bd-tz-trigger[aria-expanded="true"] svg {
    transform: rotate(180deg);
    color: var(--bd-pink);
  }

  .bd-live-preview {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding: 0.62rem 0.88rem;
    border-radius: 13px;
    background: color-mix(in srgb, var(--card-solid) 75%, transparent);
    border: 1px dashed color-mix(in srgb, var(--bd-pink) 35%, var(--line));
    font-size: 0.79rem;
    color: var(--muted);
    line-height: 1.45;
  }
  .bd-live-preview b {
    color: var(--text);
  }
  .bd-live-preview .bd-prev-highlight {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--bd-pink);
    background: color-mix(in srgb, var(--bd-pink) 13%, transparent);
    padding: 0.18rem 0.58rem;
    border-radius: 999px;
    white-space: nowrap;
  }

  .bd-pop {
    position: fixed;
    z-index: 10060;
    border-radius: 20px;
    background: color-mix(in srgb, var(--card-solid) 95%, transparent);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1px solid color-mix(in srgb, var(--text) 14%, var(--line));
    box-shadow: 0 22px 54px -12px rgba(0, 0, 0, 0.52), var(--glass-spec);
    animation: bdPopIn 0.18s var(--apple-spring);
    user-select: none;
  }
  @keyframes bdPopIn {
    from { opacity: 0; transform: translateY(-6px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bd-cal-pop {
    width: 292px;
    padding: 0.85rem;
  }
  .bd-cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    margin-bottom: 0.6rem;
  }
  .bd-cal-title {
    font-family: var(--display);
    font-size: 0.92rem;
    font-weight: 800;
    color: var(--text);
  }
  .bd-cal-nav {
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }
  .bd-cal-nav-btn {
    width: 28px;
    height: 28px;
    min-width: 28px;
    min-height: 28px;
    padding: 0;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--glass-elevated);
    color: var(--text);
    display: inline-grid;
    place-items: center;
    cursor: pointer;
  }
  .bd-cal-nav-btn:hover {
    border-color: var(--bd-pink);
    color: var(--bd-pink);
    transform: none;
  }
  .bd-cal-nav-btn svg {
    width: 14px;
    height: 14px;
  }
  .bd-cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-family: var(--mono);
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.32rem;
  }
  .bd-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .bd-cal-day {
    height: 34px;
    min-height: 34px;
    padding: 0;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 600;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.14s;
  }
  .bd-cal-day:hover {
    background: color-mix(in srgb, var(--bd-pink) 16%, transparent);
    border-color: color-mix(in srgb, var(--bd-pink) 35%, transparent);
    transform: none;
  }
  .bd-cal-day.is-out {
    color: var(--muted);
    opacity: 0.4;
  }
  .bd-cal-day.is-today {
    border-color: var(--bd-pink);
    color: var(--bd-pink);
    font-weight: 800;
  }
  .bd-cal-day.is-selected {
    background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
    color: #fff !important;
    border-color: transparent !important;
    font-weight: 800;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 42%, transparent);
  }
  .bd-cal-year-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: 0.6rem;
    padding-top: 0.55rem;
    border-top: 1px solid var(--line);
    font-size: 0.75rem;
    color: var(--muted);
  }
  .bd-cal-year-inp {
    width: 86px !important;
    height: 28px !important;
    min-height: 28px !important;
    padding: 0 0.45rem !important;
    border-radius: 8px !important;
    font-family: var(--mono);
    font-size: 0.76rem !important;
    text-align: center;
    background: var(--glass-elevated) !important;
    border: 1px solid var(--line) !important;
    color: var(--text) !important;
  }
  .bd-cal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.55rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--line);
  }
  .bd-cal-foot-btn {
    height: 28px;
    min-height: 28px;
    padding: 0 0.65rem;
    border-radius: 8px;
    font-size: 0.74rem;
    font-weight: 700;
    border: 1px solid var(--line);
    background: var(--glass-elevated);
    color: var(--text);
    cursor: pointer;
  }
  .bd-cal-foot-btn.today {
    color: var(--bd-pink);
    border-color: color-mix(in srgb, var(--bd-pink) 35%, var(--line));
  }
  .bd-cal-foot-btn:hover {
    border-color: var(--bd-pink);
    transform: none;
  }

  .bd-tz-pop {
    width: min(380px, calc(100vw - 16px));
    padding: 0.65rem;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  .bd-tz-search {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    height: 36px;
    padding: 0 0.68rem;
    border-radius: 11px;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
  }
  .bd-tz-search svg {
    width: 14px;
    height: 14px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .bd-tz-search input {
    flex: 1;
    min-width: 0;
    border: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    padding: 0 !important;
    font-size: 0.8rem;
    color: var(--text);
  }
  .bd-tz-search input:focus {
    outline: none;
  }
  .bd-tz-list {
    max-height: 270px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-right: 2px;
  }
  .bd-tz-item {
    width: 100%;
    padding: 0.48rem 0.62rem;
    border-radius: 11px;
    border: 0;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.14s;
  }
  .bd-tz-item:hover {
    background: color-mix(in srgb, var(--bd-pink) 13%, transparent);
    transform: none;
  }
  .bd-tz-item.active {
    background: color-mix(in srgb, var(--bd-pink) 20%, transparent);
  }
  .bd-tz-item-left {
    display: flex;
    flex-direction: column;
    gap: 0.08rem;
    min-width: 0;
    flex: 1;
  }
  .bd-tz-item-left b {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bd-tz-item-left span {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
  }
  .bd-tz-item-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.08rem;
    flex-shrink: 0;
  }
  .bd-tz-item-right .tz-off {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--bd-pink);
  }
  .bd-tz-item-right .tz-diff {
    font-size: 0.67rem;
    color: var(--muted);
  }

  .bd-controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem;
    flex-wrap: wrap;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
  }
  .bd-pills {

  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
  }

  function safeDayForYear(year, month, day) {
    if (month === 2 && day === 29 && !isLeapYear(year)) return 28;
    return day;
  }

  function getZonedParts(utcMs, timeZone) {
    let tz = timeZone || LOCAL_TZ;
    try {
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      });
      const parts = fmt.formatToParts(new Date(utcMs));
      const out = {};
      for (const p of parts) {
        if (p.type !== "literal") out[p.type] = parseInt(p.value, 10);
      }
      if (out.hour === 24) out.hour = 0;
      return out;
    } catch {
      const d = new Date(utcMs);
      return {
        year: d.getFullYear(),
        month: d.getMonth() + 1,
        day: d.getDate(),
        hour: d.getHours(),
        minute: d.getMinutes(),
        second: d.getSeconds()
      };
    }
  }

  function zonedTimeToUtcMs(year, month, day, hour, minute, second, timeZone) {
    const validDay = safeDayForYear(year, month, day);
    const targetAsUtc = Date.UTC(year, month - 1, validDay, hour || 0, minute || 0, second || 0);
    let guess = targetAsUtc;
    for (let i = 0; i < 3; i++) {
      const p = getZonedParts(guess, timeZone);
      const actualAsUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
      const diff = targetAsUtc - actualAsUtc;
      if (diff === 0) break;
      guess += diff;
    }
    return guess;
  }

  function getTzOffsetMinutesAt(utcMs, timeZone) {
    const p = getZonedParts(utcMs, timeZone);
    const zonedAsUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    return Math.round((zonedAsUtc - utcMs) / 60000);
  }

  function formatUtcOffsetLabel(offsetMins) {
    const sign = offsetMins >= 0 ? "+" : "-";
    const abs = Math.abs(offsetMins);
    const hh = Math.floor(abs / 60);
    const mm = abs % 60;
    return mm ? `GMT${sign}${hh}:${String(mm).padStart(2, "0")}` : `GMT${sign}${hh}`;
  }

  function getRelativeHoursText(targetTz, refMs = Date.now()) {
    const targetOff = getTzOffsetMinutesAt(refMs, targetTz);
    const localOff = getTzOffsetMinutesAt(refMs, LOCAL_TZ);
    const diffMins = targetOff - localOff;
    if (diffMins === 0) return "same";
    const diffHours = diffMins / 60;
    const hStr = Number.isInteger(diffHours) ? String(Math.abs(diffHours)) : Math.abs(diffHours).toFixed(1);
    return diffMins > 0 ? `${hStr}h ahead of you` : `${hStr}h behind you`;
  }

  function getTzFriendlyMeta(tz) {
    const found = ALL_TIMEZONES.find(x => x.tz === tz);
    if (found) return found;
    const parts = String(tz || LOCAL_TZ).split("/");
    const city = (parts[parts.length - 1] || tz).replace(/_/g, " ");
    return { tz: tz || LOCAL_TZ, label: `${city} (${tz})`, country: parts[0] || "", tags: "" };
  }

  function getTzShortCity(tz) {
    const meta = getTzFriendlyMeta(tz);
    const first = meta.label.split("(")[0].trim();
    return first.split("/")[0].trim() || tz;
  }

  function formatInTz(utcMs, timeZone, opts = {}) {
    try {
      return new Intl.DateTimeFormat("en-US", Object.assign({ timeZone }, opts)).format(new Date(utcMs));
    } catch {
      return new Date(utcMs).toLocaleString();
    }
  }

  function computeBirthdaySchedule(item, nowMs = Date.now()) {
    const tz = item.timeZone || LOCAL_TZ;
    const m = Number(item.birthMonth) || 1;
    const d = Number(item.birthDay) || 1;
    const friendNow = getZonedParts(nowMs, tz);

    let occYear = friendNow.year;
    let bdayStartUtc = zonedTimeToUtcMs(occYear, m, d, 0, 0, 0, tz);
    let bdayEndUtc = bdayStartUtc + 24 * 3600 * 1000;

    if (nowMs >= bdayEndUtc) {
      occYear += 1;
      bdayStartUtc = zonedTimeToUtcMs(occYear, m, d, 0, 0, 0, tz);
      bdayEndUtc = bdayStartUtc + 24 * 3600 * 1000;
    }

    const reminderUtc = bdayStartUtc - 5 * 60 * 1000;
    const isBirthdayNowInTheirTz = nowMs >= bdayStartUtc && nowMs < bdayEndUtc;
    const isWithinFiveMinPreAlert = nowMs >= reminderUtc && nowMs < bdayStartUtc;
    const nextAlertUtc = nowMs < bdayStartUtc
      ? reminderUtc
      : zonedTimeToUtcMs(occYear + 1, m, d, 0, 0, 0, tz) - 5 * 60 * 1000;

    const msUntilStart = Math.max(0, bdayStartUtc - nowMs);
    const msUntilReminder = reminderUtc - nowMs;

    const turningAge = (item.birthYear && Number(item.birthYear) > 1900 && occYear > Number(item.birthYear))
      ? (occYear - Number(item.birthYear))
      : null;

    const targetOffMins = getTzOffsetMinutesAt(bdayStartUtc, tz);
    const localOffMins = getTzOffsetMinutesAt(bdayStartUtc, LOCAL_TZ);
    const diffHours = (targetOffMins - localOffMins) / 60;
    const diffLabel = diffHours === 0
      ? "same"
      : (diffHours > 0
        ? `${Number.isInteger(diffHours) ? diffHours : diffHours.toFixed(1)}h ahead`
        : `${Number.isInteger(Math.abs(diffHours)) ? Math.abs(diffHours) : Math.abs(diffHours).toFixed(1)}h behind`);

    return {
      occYear,
      bdayStartUtc,
      bdayEndUtc,
      reminderUtc,
      nextAlertUtc,
      isBirthdayNowInTheirTz,
      isWithinFiveMinPreAlert,
      msUntilStart,
      msUntilReminder,
      turningAge,
      targetOffMins,
      diffLabel
    };
  }

  function parseBirthdayDateInput(str) {
    const s = String(str || "").trim();
    if (!s) return null;

    const md = s.match(/^(\d{1,2})[.\/\s-](\d{1,2})(?:[.\/\s-](\d{2,4}))?$/);
    if (md) {
      const month = parseInt(md[1], 10);
      const day = parseInt(md[2], 10);
      let year = null;
      if (md[3] !== undefined && md[3] !== "") {
        year = parseInt(md[3], 10);
        if (year < 100) {
          const curYY = new Date().getFullYear() % 100;
          year = year > curYY ? 1900 + year : 2000 + year;
        }
      }
      const maxDays = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      if (month >= 1 && month <= 12 && day >= 1 && day <= maxDays[month - 1]) {
        return {
          month,
          day,
          year,
          formatted: year
            ? `${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}/${year}`
            : `${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}`
        };
      }
    }

    const ymd = s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);
    if (ymd) {
      const year = parseInt(ymd[1], 10);
      const month = parseInt(ymd[2], 10);
      const day = parseInt(ymd[3], 10);
      if (month >= 1 && month <= 12 && day >= 1 && day <= 31) {
        return {
          month,
          day,
          year,
          formatted: `${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}/${year}`
        };
      }
    }
    return null;
  }

      const inp = e.target.closest("input, select, textarea");

        inp.blur();

    }, true);

  function getUserDocRef() {
    if (DB.isGuest() || !window.firebase || !firebase.firestore) return null;
    const uid = typeof DB.userId === "function" ? DB.userId() : (DB.user && DB.user.uid);
    if (!uid) return null;
    return firebase.firestore().collection("users").doc(uid);
  }

  async function initDirectFirestoreSync() {
    const userRef = getUserDocRef();
    if (!userRef || directFirestoreBound) return;
    directFirestoreBound = true;

    try {
      const [stateSnap, colSnap, userDocSnap] = await Promise.all([
        userRef.collection("state").doc("birthdays").get().catch(() => null),
        userRef.collection("birthdays").get().catch(() => null),
        userRef.get().catch(() => null)
      ]);

      const userData = (userDocSnap && userDocSnap.exists) ? (userDocSnap.data() || {}) : {};
      let cloudList = null;

      if (stateSnap && stateSnap.exists && Array.isArray(stateSnap.data()?.items) && stateSnap.data().items.length) {
        cloudList = stateSnap.data().items;
      } else if (colSnap && colSnap.docs && colSnap.docs.length) {
        cloudList = colSnap.docs.map(d => d.data());
      } else if (Array.isArray(userData.birthdays) && userData.birthdays.length) {
        cloudList = userData.birthdays;
      }

      if (Array.isArray(cloudList) && cloudList.length) {
        localBdCache = cloudList;
        DB.set(BD_KEY, localBdCache);
      }

      userRef.collection("state").doc("birthdays").onSnapshot(docSnap => {
        if (state.syncInFlight) return;
        if (docSnap && docSnap.exists && Array.isArray(docSnap.data()?.items)) {
          const items = docSnap.data().items;
          if (items.length > 0 || !localBdCache || localBdCache.length === 0) {
            localBdCache = items;
            try { localStorage.setItem(BD_KEY, JSON.stringify(items)); } catch {}
            renderAll();
          }
        }
      }, () => {});
    } catch {}
  }

  function loadBirthdays() {
    if (DB.isGuest()) return [];
    if (Array.isArray(localBdCache)) return localBdCache.slice();
    const raw = DB.get(BD_KEY, []);
    return Array.isArray(raw) ? raw.slice() : [];
  }

  async function saveBirthdays(list) {
    if (DB.isGuest()) {
      await ensureAccountAccess();
      return;
    }
    localBdCache = list.slice();
    DB.set(BD_KEY, localBdCache);
    if (typeof DB.flush === "function") DB.flush();

    renderAll();
    checkBirthdayAlerts();

    const userRef = getUserDocRef();
    if (userRef) {
      state.syncInFlight = true;
      try {
        const cleanList = JSON.parse(JSON.stringify(localBdCache));
        await Promise.all([
          userRef.collection("state").doc("birthdays").set({ items: cleanList, updatedAt: Date.now() }).catch(() => {}),
          userRef.set({ birthdays: cleanList }, { merge: true }).catch(() => {})
        ]);
      } catch {}
      state.syncInFlight = false;
    }
  }

  function openAppleCalendarPicker(inputEl, triggerBtn) {
    if (activePopover && activePopover.kind === "cal" && activePopover.inputEl === inputEl) {
      closeActivePopover();
      return;

    closeActivePopover();

    const parsed = parseBirthdayDateInput(inputEl.value);
    const now = new Date();
    let viewYear = (parsed && parsed.year) ? parsed.year : now.getFullYear();
    let viewMonth = parsed ? parsed.month - 1 : now.getMonth();
    let selMonth = parsed ? parsed.month : (now.getMonth() + 1);
    let selDay = parsed ? parsed.day : now.getDate();

    pop.setAttribute("aria-label", "Birthday calendar picker");

    function positionPopover() {
      const wrap = inputEl.closest(".bd-date-input-wrap") || triggerBtn || inputEl;
      const r = wrap.getBoundingClientRect();
      const popW = 292;
      const popH = pop.offsetHeight || 340;
      let left = Math.max(8, Math.min(r.left, window.innerWidth - popW - 8));
      let top = r.bottom + 6;
      if (top + popH > window.innerHeight - 10 && r.top - popH - 6 > 8) {
        top = r.top - popH - 6;
      }
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }

    function applySelection(m, d, yrStr) {
      const cleanYr = String(yrStr || "").trim();
      const yrNum = /^\d{4}$/.test(cleanYr) ? parseInt(cleanYr, 10) : null;
      inputEl.value = yrNum
        ? `${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}/${yrNum}`
        : `${String(m).padStart(2, "0")}/${String(d).padStart(2, "0")}`;
      inputEl.dispatchEvent(new Event("input", { bubbles: true }));
      inputEl.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function renderCal() {
      const firstDayWeek = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

      const cells = [];
      for (let i = firstDayWeek - 1; i >= 0; i--) {
        const dNum = daysInPrev - i;
        const pDate = new Date(viewYear, viewMonth - 1, dNum);
        cells.push({ m: pDate.getMonth() + 1, d: dNum, out: true });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ m: viewMonth + 1, d, out: false });
      }
      while (cells.length < 42) {
        const nextDay = cells.length - (firstDayWeek + daysInMonth) + 1;
        const nDate = new Date(viewYear, viewMonth + 1, nextDay);
        cells.push({ m: nDate.getMonth() + 1, d: nextDay, out: true });
      }

      const todayM = now.getMonth() + 1;
      const todayD = now.getDate();

      pop.innerHTML = `
        <div class="bd-cal-head">
          <span class="bd-cal-title">${MONTH_NAMES[viewMonth]}</span>
          <div class="bd-cal-nav">
            <button type="button" class="bd-cal-nav-btn" data-cal-nav="-1" aria-label="Previous month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button type="button" class="bd-cal-nav-btn" data-cal-nav="1" aria-label="Next month">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <div class="bd-cal-weekdays">
          <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div class="bd-cal-grid">
          ${cells.map(c => {
            const isToday = c.m === todayM && c.d === todayD;
            const isSel = c.m === selMonth && c.d === selDay && !c.out;
            const cls = [
              "bd-cal-day",
              c.out ? "is-out" : "",
              isToday ? "is-today" : "",
              isSel ? "is-selected" : ""
            ].filter(Boolean).join(" ");
            return `<button type="button" class="${cls}" data-m="${c.m}" data-d="${c.d}">${c.d}</button>`;
          }).join("")}
        </div>
        <div class="bd-cal-year-row">
          <span>Birth Year (optional):</span>
          <input type="text" class="bd-cal-year-inp" id="bdCalYearInp" placeholder="YYYY" maxlength="4" value="${DB.esc(birthYearVal)}" inputmode="numeric">
        </div>
        <div class="bd-cal-foot">
          <button type="button" class="bd-cal-foot-btn today" id="bdCalTodayBtn">Today</button>
          <button type="button" class="bd-cal-foot-btn" id="bdCalDoneBtn">Done</button>
        </div>
      `;

      const yrInp = pop.querySelector("#bdCalYearInp");
      yrInp.oninput = e => {
        birthYearVal = e.target.value.replace(/[^0-9]/g, "").slice(0, 4);
        e.target.value = birthYearVal;
        applySelection(selMonth, selDay, birthYearVal);
      };

      pop.querySelectorAll("[data-cal-nav]").forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          const dir = parseInt(btn.dataset.calNav, 10);
          viewMonth = (viewMonth + dir + 12) % 12;
          renderCal();
        };
      });

      pop.querySelectorAll(".bd-cal-day").forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          selMonth = parseInt(btn.dataset.m, 10);
          selDay = parseInt(btn.dataset.d, 10);
          applySelection(selMonth, selDay, birthYearVal);
          closeActivePopover();

    const onKey = e => {

  function openAppleTimeZonePicker(triggerBtn, currentTz, onSelectTz) {
    if (activePopover && activePopover.kind === "tz" && activePopover.triggerBtn === triggerBtn) {
      closeActivePopover();
      return;
    }
    closeActivePopover();
    triggerBtn.setAttribute("aria-expanded", "true");

    const pop = document.createElement("div");
    pop.className = "bd-pop bd-tz-pop";
    pop.setAttribute("role", "dialog");
    pop.setAttribute("aria-label", "Select time zone");
    pop.innerHTML = `
      <div class="bd-tz-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="bdTzSearchInput" placeholder="Search city, country, or GMT offset (e.g. GMT-5, GMT+9, Japan)…" autocomplete="off">
      </div>
      <div class="bd-tz-list" id="bdTzPopList" role="listbox"></div>
    `;
    document.body.appendChild(pop);

    const searchInp = pop.querySelector("#bdTzSearchInput");
    const listEl = pop.querySelector("#bdTzPopList");

    function positionPopover() {
      const r = triggerBtn.getBoundingClientRect();
      const popW = Math.min(380, window.innerWidth - 16);
      const popH = pop.offsetHeight || 320;
      let left = Math.max(8, Math.min(r.left, window.innerWidth - popW - 8));
      let top = r.bottom + 6;
      if (top + popH > window.innerHeight - 10 && r.top - popH - 6 > 8) {
        top = r.top - popH - 6;
      }
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }

    function renderTzList(query = "", autoScrollActive = false) {
      const q = query.trim().toLowerCase();
      const nowMs = Date.now();
      const sourcePool = q
        ? ALL_TIMEZONES
        : ALL_TIMEZONES.filter(item => item.priority === 1 || item.tz === currentTz || item.tz === LOCAL_TZ);

      const withOffsets = sourcePool.map(item => {
        const offMins = getTzOffsetMinutesAt(nowMs, item.tz);
        const offLbl = formatUtcOffsetLabel(offMins);
        return { item, offMins, offLbl };
      });

      withOffsets.sort((a, b) => {
        if (a.offMins !== b.offMins) return a.offMins - b.offMins;
        if ((a.item.priority || 0) !== (b.item.priority || 0)) return (b.item.priority || 0) - (a.item.priority || 0);
        return a.item.label.localeCompare(b.item.label);
      });

      const filtered = withOffsets.filter(({ item, offLbl }) => {
        if (!q) return true;
        const hay = `${item.label} ${item.country} ${item.tz} ${item.tags || ""} ${offLbl} ${offLbl.replace("GMT", "UTC")}`.toLowerCase();
        return hay.includes(q);
      }).slice(0, 80);

      if (!filtered.length) {
        listEl.innerHTML = `<div class="muted" style="text-align:center;padding:1.2rem .5rem;font-size:.78rem;">No matching time zones found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(({ item, offLbl }) => {
        const diffTxt = getRelativeHoursText(item.tz, nowMs);
        const curTime = formatInTz(nowMs, item.tz, { hour: "numeric", minute: "2-digit" });
        const isSel = item.tz === currentTz;
        return `
          <button type="button" class="bd-tz-item ${isSel ? "active" : ""}" role="option" aria-selected="${isSel}" data-tz="${DB.esc(item.tz)}">
            <div class="bd-tz-item-left">
              <b>${DB.esc(item.label)}</b>
              <span>${DB.esc(item.tz)} · Now ${DB.esc(curTime)}</span>
            </div>
            <div class="bd-tz-item-right">
              <span class="tz-off">${DB.esc(offLbl)}</span>
              <span class="tz-diff">${DB.esc(diffTxt)}</span>
            </div>
          </button>
        `;
      }).join("");

      listEl.querySelectorAll("[data-tz]").forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          const picked = btn.dataset.tz;
          triggerBtn.setAttribute("aria-expanded", "false");
          closeActivePopover();
          onSelectTz(picked);
        };
      });

      if (autoScrollActive) {
        const activeBtn = listEl.querySelector(".bd-tz-item.active");
        if (activeBtn) {
          setTimeout(() => activeBtn.scrollIntoView({ block: "center" }), 10);
        }
      }
    }

    renderTzList("", true);
    positionPopover();
    setTimeout(() => searchInp.focus(), 30);

    searchInp.oninput = () => renderTzList(searchInp.value);

    const onDocDown = e => {
      if (!pop.contains(e.target) && e.target !== triggerBtn && !triggerBtn.contains(e.target)) {
        triggerBtn.setAttribute("aria-expanded", "false");
        closeActivePopover();
      }
    };
    const onKey = e => {
      if (e.key === "Escape") {
        e.stopPropagation();
        triggerBtn.setAttribute("aria-expanded", "false");
        closeActivePopover();
      }
    };
    document.addEventListener("pointerdown", onDocDown, true);
    document.addEventListener("keydown", onKey, true);
    activePopover = { kind: "tz", pop, triggerBtn, onDocDown, onKey };
  }

        | <b>${DB.esc(localMidnightStr)}</b> in your time zone (${DB.esc(sched.diffLabel)})

  function checkBirthdayAlerts() {
    if (DB.isGuest()) return;
    const list = loadBirthdays();
    if (!list.length) return;

    const nowMs = Date.now();
    const fired = DB.get(FIRED_KEY, {}) || {};
    let dirty = false;

    for (const item of list) {
      if (item.notifyEnabled === false) continue;
      const sched = computeBirthdaySchedule(item, nowMs);
      const fireKey = `bday|${item.id}|${sched.occYear}`;
      if (fired[fireKey]) continue;
      if (nowMs >= sched.reminderUtc && nowMs < sched.bdayStartUtc + 55 * 60 * 1000) {
        fired[fireKey] = nowMs;
        dirty = true;

        const city = getTzShortCity(item.timeZone);
        const dateLbl = `${MONTH_NAMES[item.birthMonth - 1]} ${item.birthDay}`;
        const localMid = formatInTz(sched.bdayStartUtc, LOCAL_TZ, { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
        const ageTxt = sched.turningAge ? ` (turning ${sched.turningAge})` : "";

        const title = sched.isBirthdayNowInTheirTz
          ? `🎂 It's ${item.name}'s Birthday in ${city}!`
          : `🎂 ${item.name}'s Birthday Starts in 5 Minutes!`;
        const body = sched.isBirthdayNowInTheirTz
          ? `It is now ${dateLbl} in ${city}${ageTxt}. Send ${item.name} a happy birthday message!`
          : `It's 11:55 PM in ${city} — ${item.name}'s birthday (${dateLbl}${ageTxt}) begins at midnight their time (${localMid} your time).`;

        if (typeof DB.fire === "function") {
          DB.fire(title, body, { tag: fireKey, url: "pages/birthday.html", force: true });
        } else {
          DB.toast(title, body, 8000);
        }
      }
    }

    if (dirty) {
      DB.set(FIRED_KEY, fired);
    }
  }

    const nowMs = Date.now();

    const perm = (DB.notif && typeof DB.notif.perm === "function") ? DB.notif.perm() : "default";

  function formatCountdownParts(ms) {
    const clamped = Math.max(0, ms);
    const totalSec = Math.floor(clamped / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    return {
      days: String(days),
      hours: String(hours).padStart(2, "0"),
      mins: String(mins).padStart(2, "0"),
      secs: String(secs).padStart(2, "0")
    };
  }

              <div class="bd-tz-row alert-row">
                <span class="lbl">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                  5-Min Early Alert (Your Time)
                </span>
                <span class="val">${item.notifyEnabled === false ? "Muted" : DB.esc(localAlertStr)}</span>
              </div>
            </div>

            ${item.notes ? `<div class="bd-note-strip">${DB.esc(item.notes)}</div>` : ""}

            <div class="bd-card-foot">
              <button type="button" class="bd-wish-btn" data-copy-wish="${DB.esc(item.id)}" title="Copy a Happy Birthday wish message">
                ${copySvg}
                <span>Copy Birthday Wish</span>
              </button>
              <div class="bd-card-actions">
                <button type="button" class="bd-icon-btn ${item.notifyEnabled !== false ? "bell-on" : ""}" data-toggle-bell="${DB.esc(item.id)}" title="${item.notifyEnabled !== false ? "Alert enabled (click to mute)" : "Alert muted (click to enable)"}" aria-label="Toggle alert">${bellSvg}</button>
                <button type="button" class="bd-icon-btn" data-edit-bd="${DB.esc(item.id)}" title="Edit birthday" aria-label="Edit">${editSvg}</button>
                <button type="button" class="bd-icon-btn del" data-del-bd="${DB.esc(item.id)}" title="Delete birthday" aria-label="Delete">${delSvg}</button>
              </div>
            </div>
          </article>
        `;
      }).join("")}
    </div>`;

    container.querySelectorAll("[data-copy-wish]").forEach(btn => {
      btn.onclick = () => {
        const item = loadBirthdays().find(x => x.id === btn.dataset.copyWish);
        if (!item) return;
        const msg = item.notes && /happy birthday/i.test(item.notes)
          ? item.notes
          : `Happy Birthday ${item.name}! 🎂🎉 Wishing you an amazing year ahead!`;
        navigator.clipboard && navigator.clipboard.writeText(msg);
        DB.toast("Birthday Wish Copied", `"${msg}" copied to your clipboard.`, 2600);
      };
    });

    container.querySelectorAll("[data-toggle-bell]").forEach(btn => {
      btn.onclick = async () => {
        const list = loadBirthdays();
        const target = list.find(x => x.id === btn.dataset.toggleBell);
        if (!target) return;
        target.notifyEnabled = target.notifyEnabled === false;
        await saveBirthdays(list);
        DB.toast(
          target.notifyEnabled ? "Alert Enabled" : "Alert Muted",
          target.notifyEnabled
            ? `You'll be notified 5 minutes before ${target.name}'s birthday in ${getTzShortCity(target.timeZone)}.`
            : `Notifications muted for ${target.name}.`,
          2400
        );
      };
    });

    container.querySelectorAll("[data-edit-bd]").forEach(btn => {
      btn.onclick = () => {
        const item = loadBirthdays().find(x => x.id === btn.dataset.editBd);
        if (item) openEditBirthdayModal(item);
      };
    });

    container.querySelectorAll("[data-del-bd]").forEach(btn => {
      btn.onclick = async () => {
        const list = loadBirthdays();
        const idx = list.findIndex(x => x.id === btn.dataset.delBd);
        if (idx === -1) return;
        const removed = list[idx];
        list.splice(idx, 1);
        await saveBirthdays(list);
        DB.toast("Birthday Removed", `${removed.name}'s birthday reminder was deleted.`, 2200);
      };
    });
  }

  function tickLiveCountdowns() {
    if (DB.isGuest()) return;
    const list = loadBirthdays();
    if (!list.length) return;
    const nowMs = Date.now();

    for (const item of list) {
      const sched = computeBirthdaySchedule(item, nowMs);
      const grid = document.querySelector(`[data-cd-grid="${CSS.escape(item.id)}"]`);
      if (grid) {
        const cd = formatCountdownParts(sched.msUntilStart);
        const dEl = grid.querySelector("[data-cd-d]");
        const hEl = grid.querySelector("[data-cd-h]");
        const mEl = grid.querySelector("[data-cd-m]");
        const sEl = grid.querySelector("[data-cd-s]");
        if (dEl) dEl.textContent = cd.days;
        if (hEl) hEl.textContent = cd.hours;
        if (mEl) mEl.textContent = cd.mins;
        if (sEl) sEl.textContent = cd.secs;
      }
      const clockEl = document.querySelector(`[data-their-clock="${CSS.escape(item.id)}"]`);
      if (clockEl) {
        clockEl.textContent = formatInTz(nowMs, item.timeZone, {
          weekday: "short",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });
      }
    }
  }

  function openEditBirthdayModal(item) {
    let modalTz = item.timeZone || LOCAL_TZ;
    const dateVal = item.birthYear
      ? `${String(item.birthMonth).padStart(2, "0")}/${String(item.birthDay).padStart(2, "0")}/${item.birthYear}`
      : `${String(item.birthMonth).padStart(2, "0")}/${String(item.birthDay).padStart(2, "0")}`;

    const tzMeta = getTzFriendlyMeta(modalTz);
    const tzOff = formatUtcOffsetLabel(getTzOffsetMinutesAt(Date.now(), modalTz));

    const node = document.createElement("div");
    node.innerHTML = `
      <h2>Edit Birthday Reminder</h2>
      <div class="grid2">
        <div class="field">
          <label for="edBdName">Person's Name</label>
          <input id="edBdName" type="text" value="${DB.esc(item.name || "")}" style="width:100%" maxlength="60">
        </div>
        <div class="field">
          <label for="edBdDate">Birthday (MM/DD or MM/DD/YYYY)</label>
          <div class="bd-date-input-wrap">
            <input id="edBdDate" type="text" value="${DB.esc(dateVal)}" placeholder="MM/DD or MM/DD/YYYY" autocomplete="off" spellcheck="false" style="width:100%">
            <button type="button" class="bd-cal-btn" id="edBdCalBtn" title="Open calendar picker" aria-label="Open calendar picker">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Person's Time Zone</label>
        <div class="bd-tz-select-wrap">
          <button type="button" class="bd-tz-trigger" id="edBdTzBtn" aria-haspopup="listbox" aria-expanded="false">
            <span class="bd-tz-trigger-main">
              <span class="bd-tz-trigger-lbl" id="edBdTzLbl">${DB.esc(tzMeta.label)}</span>
              <span class="bd-tz-trigger-sub" id="edBdTzSub">${DB.esc(tzOff)}</span>
            </span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="edBdNotes">Notes (Optional)</label>
        <input id="edBdNotes" type="text" value="${DB.esc(item.notes || "")}" placeholder="e.g. gift idea…" style="width:100%" maxlength="140">
      </div>

      <div class="actions">
        <button type="button" class="ghost left" id="edBdCancel">Cancel</button>
        <button type="button" class="primary" id="edBdSave">Save Changes</button>
      </div>
    `;

    const close = DB.modal(node, () => closeActivePopover());

    const edDateInp = node.querySelector("#edBdDate");
    const edCalBtn = node.querySelector("#edBdCalBtn");
    edCalBtn.onclick = e => {
      e.preventDefault();
      e.stopPropagation();
      openAppleCalendarPicker(edDateInp, edCalBtn);
    };

    const edTzBtn = node.querySelector("#edBdTzBtn");
    edTzBtn.onclick = e => {
      e.preventDefault();
      e.stopPropagation();
      openAppleTimeZonePicker(edTzBtn, modalTz, pickedTz => {
        modalTz = pickedTz;
        const m = getTzFriendlyMeta(modalTz);
        const off = formatUtcOffsetLabel(getTzOffsetMinutesAt(Date.now(), modalTz));
        node.querySelector("#edBdTzLbl").textContent = m.label;
        node.querySelector("#edBdTzSub").textContent = off;
      });
    };

    node.querySelector("#edBdCancel").onclick = close;
    node.querySelector("#edBdSave").onclick = async () => {
      const newName = node.querySelector("#edBdName").value.trim();
      const parsedDate = parseBirthdayDateInput(edDateInp.value);
      const newNotes = node.querySelector("#edBdNotes").value.trim();

      if (!newName) {
        node.querySelector("#edBdName").focus();
        return;
      }
      if (!parsedDate) {
        edDateInp.focus();
        DB.toast("Invalid Birthday Date", "Please enter MM/DD or MM/DD/YYYY, or use the calendar icon.", 2600);
        return;
      }

      const list = loadBirthdays();
      const target = list.find(x => x.id === item.id);
      if (target) {
        target.name = newName;
        target.birthMonth = parsedDate.month;
        target.birthDay = parsedDate.day;
        target.birthYear = parsedDate.year || null;
        target.timeZone = modalTz;
        target.notes = newNotes;
        await saveBirthdays(list);
        DB.toast("Birthday Updated", `${newName}'s reminder was updated.`, 2400);
      }
      close();
    };
  }

  function renderAll() {
    const list = loadBirthdays();
    renderTopStatusAndStats(list);
    updateEntryTzUI();
    renderCards(list);
  }

  document.querySelectorAll("#quickTzChips [data-tz]").forEach(chip => {
    chip.onclick = async () => {
      if (!(await ensureAccountAccess())) return;
      state.selectedTz = chip.dataset.tz === "local" ? LOCAL_TZ : chip.dataset.tz;
      updateEntryTzUI();
    };
  });

  $("bdDateCalBtn").onclick = async e => {
    e.preventDefault();
    e.stopPropagation();
    if (!(await ensureAccountAccess())) return;
    openAppleCalendarPicker($("bdDateInput"), $("bdDateCalBtn"));
  };

  $("bdTzTriggerBtn").onclick = async e => {
    e.preventDefault();
    e.stopPropagation();
    if (!(await ensureAccountAccess())) return;
    openAppleTimeZonePicker($("bdTzTriggerBtn"), state.selectedTz, pickedTz => {
      state.selectedTz = pickedTz;
      updateEntryTzUI();
    });
  };

  [$("bdNameInput"), $("bdDateInput")].forEach(inp => {
    inp.addEventListener("input", updateLiveEntryPreview);
  });

  async function submitNewBirthday() {
    if (!(await ensureAccountAccess())) return;
    const nameVal = $("bdNameInput").value.trim();
    const rawDate = $("bdDateInput").value.trim();
    const noteVal = $("bdNoteInput").value.trim();

    if (!nameVal) {
      $("bdNameInput").focus();
      return;
    }
    const parsed = parseBirthdayDateInput(rawDate);
    if (!parsed) {
      $("bdDateInput").focus();
      DB.toast("Invalid Date", "Please enter the birthday as MM/DD or MM/DD/YYYY.", 2800);
      return;
    }

    const newItem = {
      id: DB.uid(),
      name: nameVal,
      birthMonth: parsed.month,
      birthDay: parsed.day,
      birthYear: parsed.year || null,
      timeZone: state.selectedTz || LOCAL_TZ,
      notes: noteVal,
      notifyEnabled: true,
      createdAt: Date.now()
    };

    const list = loadBirthdays();
    list.push(newItem);

    $("bdNameInput").value = "";
    $("bdDateInput").value = "";
    $("bdNoteInput").value = "";
    $("bdNameInput").focus();

    await saveBirthdays(list);

    const sched = computeBirthdaySchedule(newItem);
    const alertStr = formatInTz(sched.reminderUtc, LOCAL_TZ, {
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit",
      timeZoneName: "short"
    });
    DB.toast(
      "Birthday Reminder Saved",
      `${nameVal} (${getTzShortCity(newItem.timeZone)}) — you'll be notified on ${alertStr} (5m before midnight their time).`,
      3800
    );
  }

  $("addBdBtn").onclick = submitNewBirthday;
  [$("bdNameInput"), $("bdDateInput"), $("bdNoteInput")].forEach(inp => {
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitNewBirthday();
      }
    });
  });

  $("bdAlertActionBtn").onclick = async () => {
    if (!(await ensureAccountAccess())) return;
    const perm = (DB.notif && typeof DB.notif.perm === "function") ? DB.notif.perm() : "default";
    const notifOn = Boolean(DB.settings && DB.settings.notifyOn);
    if (!notifOn || perm !== "granted") {
      if (DB.notif && typeof DB.notif.enable === "function") {
        await DB.notif.enable();
      }
    }
    renderTopStatusAndStats();

    const list = loadBirthdays();
    const sample = list[0];
    if (sample) {
      const sched = computeBirthdaySchedule(sample);
      const city = getTzShortCity(sample.timeZone);
      const localMid = formatInTz(sched.bdayStartUtc, LOCAL_TZ, {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      });
      const localRem = formatInTz(sched.reminderUtc, LOCAL_TZ, {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
        timeZoneName: "short"
      });
      DB.fire(
        `🎂 Test Alert: ${sample.name}'s Birthday in 5 Minutes!`,
        `In ${city}, ${sample.name}'s birthday starts at 12:00 AM their time (${localMid} your time). Scheduled 5-min reminder: ${localRem}.`,
        { tag: "test-bday-" + Date.now(), url: "pages/birthday.html", force: true }
      );
    } else {
      DB.fire(
        "🎂 Birthday Reminder Test",
        "Your birthday reminder alerts are working!",
        { tag: "test-bday-" + Date.now(), url: "pages/birthday.html", force: true }
      );
    }
  };

  $("bdSearchInput").oninput = e => {
    state.searchQuery = e.target.value.trim();
    renderCards(loadBirthdays());
  };

  const sortDd = $("bdSortDropdown");
  const sortBtn = $("bdSortBtn");
  const sortMenu = $("bdSortMenu");
  sortBtn.onclick = async e => {
    e.preventDefault();
    e.stopPropagation();
    if (!(await ensureAccountAccess())) return;
    const opening = sortMenu.hidden;
    sortMenu.hidden = !opening;
    sortDd.classList.toggle("open", opening);
    sortBtn.setAttribute("aria-expanded", String(opening));
  };
  document.addEventListener("pointerdown", e => {
    if (!sortMenu.hidden && !sortDd.contains(e.target)) {
      sortMenu.hidden = true;
      sortDd.classList.remove("open");
      sortBtn.setAttribute("aria-expanded", "false");
    }
  }, true);

  (function initEntryDefaults() {
    const tmrw = new Date(Date.now() + 86400000);
    const mm = String(tmrw.getMonth() + 1).padStart(2, "0");
    const dd = String(tmrw.getDate()).padStart(2, "0");
    $("bdDateInput").value = `${mm}/${dd}`;
    state.selectedTz = LOCAL_TZ || FALLBACK_EASTERN_TZ;
  })();

  if (typeof DB.onLogin === "function") {
    DB.onLogin(async () => {
      await initDirectFirestoreSync();
      renderAll();
      checkBirthdayAlerts();
    });
  }
  document.addEventListener("p23notif", () => renderTopStatusAndStats(loadBirthdays()));
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      renderAll();
      checkBirthdayAlerts();
    }
  });

  if (typeof DB.checkDue === "function") {
    const origCheckDue = DB.checkDue.bind(DB);
    DB.checkDue = function() {
      origCheckDue();
      checkBirthdayAlerts();
    };
  }

  setInterval(tickLiveCountdowns, 1000);
  setInterval(() => {
    checkBirthdayAlerts();
    renderTopStatusAndStats(loadBirthdays());
  }, 5000);

  initDirectFirestoreSync().then(() => {
    renderAll();
    checkBirthdayAlerts();
  });
});
</script>
</body>
</html>
