<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vinyl Shelf | Project 23</title>
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project 23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/site-config.js"></script>
<script src="js/core.js"></script>
<style>
  :root {
    --apple-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --apple-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --glass-surface: color-mix(in srgb, var(--card-solid) 82%, transparent);
    --glass-elevated: color-mix(in srgb, var(--card-2) 90%, transparent);
    --glass-border: color-mix(in srgb, var(--text) 10%, var(--line));
    --glass-spec: inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    --vn-green: #30d158;
    --vn-gold: #ff9f0a;
  }

  main {
    max-width: 1220px;
    margin: 0 auto;
    padding: 1.1rem 1rem 4.8rem;
  }

  .pagetitle {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center;
    margin: 1.2rem auto 1.35rem;
    padding: 0 1rem;
    gap: 0.42rem;
  }
  .pagetitle h1 {
    display: block;
    width: 100%;
    font-family: var(--display);
    font-size: clamp(2.3rem, 7.5vw, 4.1rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    line-height: 1.06;
    background: linear-gradient(135deg, var(--text) 25%, var(--accent) 68%, var(--accent3, var(--accent2)) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(108, 92, 231, 0.28);
    margin: 0;
  }
  .pagetitle .badge-row-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
  }
  .pagetitle .badge-sub {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.3rem 0.9rem;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--accent3, var(--accent));
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .pagetitle .badge-sub svg {
    width: 14px;
    height: 14px;
  }
  .pagetitle p {
    margin: 0.15rem auto 0;
    color: var(--muted);
    font-size: clamp(0.9rem, 1.7vw, 1.02rem);
    max-width: 620px;
    line-height: 1.5;
  }

  .vn-shell {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .apple-panel {
    background: var(--glass-surface);
    backdrop-filter: blur(28px) saturate(185%);
    -webkit-backdrop-filter: blur(28px) saturate(185%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-spec), 0 18px 42px -18px rgba(0, 0, 0, 0.38);
    border-radius: 26px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow: hidden;
  }

  .vn-btn {
    border: 1px solid var(--glass-border);
    background: var(--glass-elevated);
    color: var(--text);
    font-family: var(--font);
    font-size: 0.81rem;
    font-weight: 600;
    padding: 0 0.92rem;
    height: 38px;
    min-height: 38px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    box-shadow: var(--glass-spec);
    transition: all 0.18s var(--apple-ease);
    text-decoration: none;
    white-space: nowrap;
  }
  .vn-btn:hover {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--card-solid));
    transform: translateY(-1px);
  }
  .vn-btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--on-accent, #fff);
    border-color: transparent;
    font-weight: 700;
    box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--accent) 48%, transparent);
  }
  .vn-btn.primary:hover {
    filter: brightness(1.06);
  }
  .vn-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  .vn-search-panel {
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 1.05rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .vn-search-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .vn-search-top b {
    font-family: var(--display);
    font-size: 0.96rem;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
  }
  .vn-wax-picker {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .vn-wax-lbl {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-right: 0.15rem;
  }
  .vn-wax-chip {
    height: 28px;
    min-height: 28px;
    padding: 0 0.6rem 0 0.38rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--card-solid) 70%, transparent);
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .vn-wax-chip:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: none;
  }
  .vn-wax-chip.active {
    background: color-mix(in srgb, var(--accent) 18%, var(--card-solid));
    border-color: var(--accent);
    color: var(--text);
    font-weight: 700;
  }
  .vn-wax-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--wax-bg, #18181c);
    border: 1px solid rgba(255, 255, 255, 0.28);
    position: relative;
    flex-shrink: 0;
  }
  .vn-wax-dot::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--card-solid);
  }

  .vn-search-input-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .vn-search-input-wrap {
    flex: 1;
    height: 44px;
    background: var(--card-solid);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    transition: border-color 0.16s;
  }
  .vn-search-input-wrap:focus-within {
    border-color: var(--accent);
  }
  .vn-search-input-wrap svg {
    width: 17px;
    height: 17px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .vn-search-input-wrap input {
    flex: 1;
    min-width: 0;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    padding: 0 !important;
    font-size: 0.9rem;
    color: var(--text);
  }
  .vn-search-input-wrap input:focus {
    outline: none;
  }

  .vn-results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
    gap: 0.65rem;
    max-height: 340px;
    overflow-y: auto;
    padding: 0.15rem 0.1rem;
  }
  .vn-results-grid[hidden] {
    display: none !important;
  }
  .vn-res-card {
    background: color-mix(in srgb, var(--card-solid) 85%, transparent);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 0.58rem 0.68rem;
    display: flex;
    align-items: center;
    gap: 0.68rem;
    transition: all 0.16s var(--apple-ease);
  }
  .vn-res-card:hover {
    border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
    transform: translateY(-1px);
  }
  .vn-res-art-wrap {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    background: #14141f;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  .vn-res-art-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .vn-res-play-ov {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    display: grid;
    place-items: center;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .vn-res-art-wrap:hover .vn-res-play-ov {
    opacity: 1;
  }
  .vn-res-play-ov svg {
    width: 20px;
    height: 20px;
  }
  .vn-res-meta {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }
  .vn-res-meta b {
    font-size: 0.83rem;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vn-res-meta span {
    font-size: 0.73rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vn-res-meta small {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--accent3, var(--accent));
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vn-res-add-btn {
    height: 32px;
    min-height: 32px;
    padding: 0 0.68rem;
    border-radius: 999px;
    font-size: 0.73rem;
    font-weight: 700;
    border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    background: color-mix(in srgb, var(--accent) 16%, var(--card-solid));
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 0.28rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .vn-res-add-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border-color: transparent;
    transform: none;
  }
  .vn-res-add-btn.is-saved {
    background: color-mix(in srgb, var(--vn-green) 18%, transparent);
    border-color: color-mix(in srgb, var(--vn-green) 42%, transparent);
    color: var(--vn-green);
    cursor: default;
  }

  .vn-shelf-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem;
    flex-wrap: wrap;
  }
  .vn-pills {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    padding: 0.15rem 0.2rem;
    flex: 1 1 100%;
  }
  .vn-pills::-webkit-scrollbar {
    display: none;
  }
  .vn-pill {
    flex: none;
    border: 1px solid var(--line);
    background: var(--glass-elevated);
    color: var(--muted);
    font-size: 0.77rem;
    font-weight: 600;
    padding: 0.32rem 0.76rem;
    min-height: 34px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.32rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.16s;
  }
  .vn-pill:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: none;
  }
  .vn-pill[aria-pressed="true"] {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: var(--on-accent, #fff);
    border-color: transparent;
  }

  .vn-shelf-right-tools {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex-wrap: wrap;
  }
  .vn-filter-box {
    height: 35px;
    min-width: 195px;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 0.72rem;
    display: flex;
    align-items: center;
    gap: 0.38rem;
  }
  .vn-filter-box svg {
    width: 13.5px;
    height: 13.5px;
    color: var(--muted);
  }
  .vn-filter-box input {
    flex: 1;
    min-width: 0;
    border: 0 !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    padding: 0 !important;
    font-size: 0.78rem;
    color: var(--text);
  }
  .vn-filter-box input:focus {
    outline: none;
  }

  .vn-dd {
    position: relative;
  }
  .vn-dd-btn {
    height: 35px;
    min-height: 35px;
    padding: 0 0.72rem 0 0.82rem;
    border-radius: 999px;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 0.76rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.36rem;
    cursor: pointer;
  }
  .vn-dd-btn:hover,
  .vn-dd.open .vn-dd-btn {
    border-color: var(--accent);
    transform: none;
  }
  .vn-dd-btn svg {
    width: 13px;
    height: 13px;
    color: var(--muted);
    transition: transform 0.2s var(--apple-ease);
  }
  .vn-dd.open .vn-dd-btn svg {
    transform: rotate(180deg);
    color: var(--accent);
  }
  .vn-dd-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    min-width: 175px;
    padding: 0.34rem;
    border-radius: 15px;
    background: color-mix(in srgb, var(--card-solid) 95%, transparent);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid color-mix(in srgb, var(--text) 14%, var(--line));
    box-shadow: 0 16px 38px -10px rgba(0, 0, 0, 0.45), var(--glass-spec);
    z-index: 120;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .vn-dd-menu[hidden] {
    display: none !important;
  }
  .vn-dd-opt {
    width: 100%;
    height: 32px;
    min-height: 32px;
    padding: 0 0.65rem;
    border-radius: 9px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-size: 0.76rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .vn-dd-opt:hover {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    transform: none;
  }
  .vn-dd-opt.active {
    background: color-mix(in srgb, var(--accent) 20%, transparent);
    color: var(--accent);
    font-weight: 700;
  }
  .vn-dd-opt svg {
    width: 13px;
    height: 13px;
    color: var(--accent);
  }

  .vn-bookshelf-cabinet {
    --wood-back-1: #1d130e;
    --wood-back-2: #120b08;
    --wood-frame: #362218;
    --wood-ledge-top: #523424;
    --wood-ledge-front: #3b2418;
    --wood-ledge-bot: #1f120b;
    --shelf-glow: rgba(255, 198, 130, 0.16);
    position: relative;
    border-radius: 24px;
    padding: 1.15rem 1.2rem 1.35rem;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.45) 0%, transparent 3%, transparent 97%, rgba(0,0,0,0.45) 100%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 2px, transparent 2px, transparent 9px),
      linear-gradient(180deg, var(--wood-back-1) 0%, var(--wood-back-2) 100%);
    border: 10px solid var(--wood-frame);
    box-shadow:
      inset 0 22px 48px rgba(0, 0, 0, 0.78),
      inset 0 0 0 1px rgba(255, 255, 255, 0.07),
      0 26px 56px -18px rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
    perspective: 1200px;
  }
  .vn-bookshelf-cabinet[data-finish="obsidian"] {
    --wood-back-1: #12131c;
    --wood-back-2: #090a10;
    --wood-frame: #1e2030;
    --wood-ledge-top: #32364f;
    --wood-ledge-front: #222538;
    --wood-ledge-bot: #11131d;
    --shelf-glow: rgba(140, 122, 230, 0.18);
  }
  .vn-bookshelf-cabinet[data-finish="oak"] {
    --wood-back-1: #2b1f16;
    --wood-back-2: #1c130d;
    --wood-frame: #593e2b;
    --wood-ledge-top: #7c583e;
    --wood-ledge-front: #61432e;
    --wood-ledge-bot: #362418;
    --shelf-glow: rgba(255, 214, 153, 0.2);
  }

  .vn-shelf-tier {
    position: relative;
    padding: 1.35rem 0.9rem 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .vn-shelf-tier::before {
    content: "";
    position: absolute;
    top: 0;
    left: 4%;
    right: 4%;
    height: 110px;
    background:
      radial-gradient(ellipse 28% 90% at 18% 0%, var(--shelf-glow), transparent 75%),
      radial-gradient(ellipse 28% 90% at 50% 0%, var(--shelf-glow), transparent 75%),
      radial-gradient(ellipse 28% 90% at 82% 0%, var(--shelf-glow), transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  .vn-shelf-row {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
    gap: 1.5rem 1.35rem;
    align-items: end;
    padding: 0.4rem 0.5rem 0;
  }

  .vn-shelf-plank {
    position: relative;
    z-index: 3;
    height: 24px;
    margin: -2px -0.9rem 0;
    border-radius: 4px;
    background: linear-gradient(180deg, var(--wood-ledge-top) 0%, var(--wood-ledge-front) 32%, var(--wood-ledge-bot) 100%);
    box-shadow:
      inset 0 2px 1px rgba(255, 255, 255, 0.18),
      inset 0 -2px 4px rgba(0, 0, 0, 0.65),
      0 14px 24px rgba(0, 0, 0, 0.68);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vn-shelf-plank::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 16px;
    right: 16px;
    height: 3px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1);
  }
  .vn-shelf-brass-tag {
    font-family: var(--mono);
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 232, 195, 0.78);
    background: linear-gradient(180deg, rgba(70, 52, 34, 0.9), rgba(38, 26, 16, 0.95));
    border: 1px solid rgba(255, 215, 150, 0.28);
    padding: 0.08rem 0.55rem;
    border-radius: 4px;
    margin-top: 3px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
  }

  .vn-record-slot {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    perspective: 900px;
    cursor: grab;
    user-select: none;
    padding-bottom: 2px;
    border-radius: 14px;
    transition: transform 0.2s var(--apple-ease), opacity 0.2s, box-shadow 0.2s;
  }
  .vn-record-slot:active {
    cursor: grabbing;
  }
  .vn-record-slot.is-dragging {
    opacity: 0.42;
    transform: scale(0.94);
  }
  .vn-record-slot.is-drop-target {
    box-shadow: 0 0 0 2.5px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 55%, transparent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    transform: translateY(-4px) scale(1.03);
  }
  .vn-source-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.14rem 0.55rem;
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.64rem;
    font-weight: 700;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    cursor: pointer;
    transition: all 0.15s;
  }

<script>
DB.whenReady(() => {
  const VN_KEY = "p23.vinyl";
  const $ = id => document.getElementById(id);

  const WAX_STYLES = {
    obsidian: {
      name: "Obsidian Black",
      bg: "radial-gradient(circle, #282934 0%, #090a0f 100%)"
    },
    violet: {
      name: "Cosmic Violet",
      bg: "radial-gradient(circle, #8c7ae6 0%, #2f1e6e 72%, #130b33 100%)"
    },
    ruby: {
      name: "Ruby Red",
      bg: "radial-gradient(circle, #ff4d6d 0%, #7a1428 74%, #2b050d 100%)"
    },
    gold: {
      name: "Liquid Gold",
      bg: "radial-gradient(circle, #ffd166 0%, #8f5b00 72%, #331f00 100%)"
    },
    cyan: {
      name: "Electric Cyan",
      bg: "radial-gradient(circle, #48cae4 0%, #023e8a 74%, #03152e 100%)"
    },
    emerald: {
      name: "Emerald Glass",
      bg: "radial-gradient(circle, #52b788 0%, #1b4332 74%, #091c14 100%)"
    }
  };

  const FINISH_OPTIONS = [
    { id: "walnut", label: "Walnut Wood" },
    { id: "obsidian", label: "Obsidian Studio" },
    { id: "oak", label: "Warm Teak & Oak" }
  ];

  const SORT_OPTIONS = [
    { id: "custom", label: "Custom Order (Drag)" },
    { id: "newest", label: "Newest Added" },
    { id: "title", label: "Song Title (A–Z)" },
    { id: "artist", label: "Artist (A–Z)" },
    { id: "plays", label: "Most Played" }
  ];

  const state = {
    selectedWax: "obsidian",
    shelfFilter: "all",
    shelfFinish: "walnut",
    sortBy: "custom",
    searchShelfQuery: "",
    lastSearchResults: [],
    activeVinylId: null,
    activeVinylObj: null,
    playbackEngine: "audio",
    isPlaying: false,
    rpm: 33,
    crackleOn: true,
    autoNextOn: true,
    volume: 0.85,
    discAngle: 0,
    draggedVinylId: null,
    syncInFlight: false
  };

  const audioEl = new Audio();
  audioEl.preload = "auto";
  audioEl.volume = state.volume;

  let ytPlayer = null;
  let ytReady = false;
  let pendingYtAction = null;

  function ensureYouTubeApiLoaded() {
    if (window.YT && window.YT.Player) {
      initYtPlayerInstance();
      return;
    }
    if (document.getElementById("vnYtApiScript")) return;
    const prevCb = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function() {
      if (typeof prevCb === "function") prevCb();
      initYtPlayerInstance();
    };
    const s = document.createElement("script");
    s.id = "vnYtApiScript";
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }

  function initYtPlayerInstance() {
    if (ytPlayer || !window.YT || !window.YT.Player) return;
    ytPlayer = new YT.Player("vnYtPlayerMount", {
      height: "200",
      width: "200",
      playerVars: {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        fs: 0,
        modestbranding: 1,
        playsinline: 1,
        rel: 0,
        origin: window.location.origin
      },
      events: {
        onReady: () => {
          ytReady = true;
          try { ytPlayer.setVolume(Math.round(state.volume * 100)); } catch {}
          if (pendingYtAction) {
            const act = pendingYtAction;
            pendingYtAction = null;
            playOrCueYtVideo(act.videoId, act.autoPlay);
          }
        },
        onStateChange: ev => {
          if (state.playbackEngine !== "yt") return;
          const dur = Number(ytPlayer.getDuration && ytPlayer.getDuration()) || 0;
          if (dur > 0 && state.activeVinylObj) {
            state.activeVinylObj.fullDurationSec = Math.round(dur);
            $("vnDurTimeLbl").textContent = fmtSec(dur);
          }
          if (ev.data === YT.PlayerState.PLAYING) {
            state.isPlaying = true;
            startVinylCrackle();
            updateTurntableUI();
            renderBookshelf(loadVinyls());
          } else if (ev.data === YT.PlayerState.PAUSED) {
            state.isPlaying = false;
            stopVinylCrackle();
            updateTurntableUI();
            renderBookshelf(loadVinyls());
          } else if (ev.data === YT.PlayerState.CUED) {
            if (dur > 0) {
              $("vnDurTimeLbl").textContent = fmtSec(dur);
            }
            updateTurntableUI();
          } else if (ev.data === YT.PlayerState.ENDED) {
            state.isPlaying = false;
            stopVinylCrackle();
            updateTurntableUI();
            renderBookshelf(loadVinyls());
            if (state.autoNextOn && loadVinyls().length > 1) {
              setTimeout(() => stepShelfVinyl(1), 450);
            }
          }
        },
        onError: () => {
          if (state.playbackEngine === "yt" && state.isPlaying) {
            state.isPlaying = false;
            stopVinylCrackle();
            DB.toast("YouTube Video Unavailable", "This YouTube video cannot be embedded. Click 'Full Track Source' to link another video.", 3600);
            updateTurntableUI();
          }
        }
      }
    });
  }
  ensureYouTubeApiLoaded();

  function playOrCueYtVideo(videoId, autoPlay = false) {
    if (!videoId) return;
    ensureYouTubeApiLoaded();
    if (!ytReady || !ytPlayer || typeof ytPlayer.loadVideoById !== "function") {
      pendingYtAction = { videoId, autoPlay };
      return;
    }
    try {
      ytPlayer.setVolume(Math.round(state.volume * 100));
      if (autoPlay) {
        ytPlayer.loadVideoById(videoId);
        ytPlayer.playVideo();
      } else {
        ytPlayer.cueVideoById(videoId);
      }
    } catch {}
  }

  function extractYouTubeId(input) {
    const s = String(input || "").trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
    const m = s.match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : "";
  }

  async function verifyYouTubeVideoExists(videoId) {
    const vid = extractYouTubeId(videoId);
    if (!vid) return { ok: false, videoId: "" };
    try {
      const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + vid)}`);
      if (res.ok) {
        const data = await res.json();
        if (data && !data.error && data.title) {
          return { ok: true, videoId: vid, title: data.title, author: data.author_name || "" };
        }
      }
    } catch {}
    return { ok: true, videoId: vid };
  }

  let crackleCtx = null;
  let crackleGain = null;
  let crackleNode = null;

  function startVinylCrackle() {
    if (!state.crackleOn || !state.isPlaying) {
      stopVinylCrackle();
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!crackleCtx) crackleCtx = new AC();
      if (crackleCtx.state === "suspended") crackleCtx.resume().catch(() => {});
      if (crackleNode) return;

      const bufferSize = crackleCtx.sampleRate * 3;
      const buffer = crackleCtx.createBuffer(1, bufferSize, crackleCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const r = Math.random();
        if (r > 0.9988) {
          data[i] = (Math.random() * 2 - 1) * 0.42;
        } else if (r > 0.992) {
          data[i] = (Math.random() * 2 - 1) * 0.09;
        } else {
          data[i] = (Math.random() * 2 - 1) * 0.012;
        }
      }

      const src = crackleCtx.createBufferSource();
      src.buffer = buffer;
      src.loop = true;

      const bandpass = crackleCtx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.value = 1750;
      bandpass.Q.value = 0.85;

      crackleGain = crackleCtx.createGain();
      crackleGain.gain.value = 0.06 * state.volume;

      src.connect(bandpass);
      bandpass.connect(crackleGain);
      crackleGain.connect(crackleCtx.destination);
      src.start();
      crackleNode = src;
    } catch {}
  }

  function stopVinylCrackle() {
    if (crackleNode) {
      try { crackleNode.stop(); crackleNode.disconnect(); } catch {}
      crackleNode = null;
    }
  }

  let lastSpinFrameTs = 0;
  function animatePlatterSpin(ts) {
    requestAnimationFrame(animatePlatterSpin);
    if (!lastSpinFrameTs) lastSpinFrameTs = ts;
    const dt = Math.min(64, ts - lastSpinFrameTs);
    lastSpinFrameTs = ts;

    if (state.isPlaying) {
      const degPerMs = state.rpm === 45 ? 0.27 : 0.2;
      state.discAngle = (state.discAngle + dt * degPerMs) % 360;
      const disc = $("vnActiveDisc");
      if (disc) {
        disc.style.transform = `rotate(${state.discAngle.toFixed(2)}deg)`;
      }

      if (state.playbackEngine === "yt" && ytReady && ytPlayer && typeof ytPlayer.getCurrentTime === "function") {
        const cur = Number(ytPlayer.getCurrentTime()) || 0;
        const dur = Number(ytPlayer.getDuration()) || (state.activeVinylObj?.fullDurationSec || 210);
        if (dur > 0) {
          $("vnSeekSlider").value = String(((cur / dur) * 100).toFixed(1));
          $("vnCurTimeLbl").textContent = fmtSec(cur);
          $("vnDurTimeLbl").textContent = fmtSec(dur);

  function getUserDocRef() {
    if (DB.isGuest() || !window.firebase || !firebase.firestore) return null;
    const uid = typeof DB.userId === "function" ? DB.userId() : (DB.user && DB.user.uid);
    if (!uid) return null;

  async function initDirectFirestoreSync() {
    const userRef = getUserDocRef();
    if (!userRef || directFirestoreBound) return;
    directFirestoreBound = true;

    try {
      const [stateSnap, colSnap, userDocSnap] = await Promise.all([
        userRef.collection("state").doc("vinyl").get().catch(() => null),
        userRef.collection("vinyl").get().catch(() => null),
        userRef.get().catch(() => null)
      ]);

      const userData = (userDocSnap && userDocSnap.exists) ? (userDocSnap.data() || {}) : {};
      let cloudList = null;

      if (stateSnap && stateSnap.exists) {
        const d = stateSnap.data() || {};
        if (d.shelfFinish) state.shelfFinish = d.shelfFinish;
        if (Array.isArray(d.items) && d.items.length) cloudList = d.items;
      }
      if (!cloudList && colSnap && colSnap.docs && colSnap.docs.length) {
        cloudList = colSnap.docs.map(d => d.data());
      }
      if (!cloudList && Array.isArray(userData.vinylShelf) && userData.vinylShelf.length) {
        cloudList = userData.vinylShelf;
      }

      if (Array.isArray(cloudList) && cloudList.length) {
        localVinylCache = cloudList;
        DB.set(VN_KEY, localVinylCache);
      }

      userRef.collection("state").doc("vinyl").onSnapshot(docSnap => {
        if (state.syncInFlight) return;
        if (docSnap && docSnap.exists) {
          const data = docSnap.data() || {};
          if (data.shelfFinish) state.shelfFinish = data.shelfFinish;
          if (Array.isArray(data.items) && (data.items.length > 0 || !localVinylCache || localVinylCache.length === 0)) {
            localVinylCache = data.items;
            try { localStorage.setItem(VN_KEY, JSON.stringify(data.items)); } catch {}
            renderAll();
          }
        }
      }, () => {});
    } catch {}
  }

  function loadVinyls() {
    if (DB.isGuest()) return [];
    if (Array.isArray(localVinylCache)) return localVinylCache.slice();
    const raw = DB.get(VN_KEY, []);
    return Array.isArray(raw) ? raw.slice() : [];
  }

  async function saveVinyls(list) {
    if (DB.isGuest()) {
      await ensureAccountAccess();
      return;
    }
    localVinylCache = list.slice();
    DB.set(VN_KEY, localVinylCache);
    if (typeof DB.flush === "function") DB.flush();

    renderAll();

    const userRef = getUserDocRef();
    if (userRef) {
      state.syncInFlight = true;
      try {
        const cleanList = JSON.parse(JSON.stringify(localVinylCache));
        await Promise.all([
          userRef.collection("state").doc("vinyl").set({
            items: cleanList,
            shelfFinish: state.shelfFinish,
            updatedAt: Date.now()
          }).catch(() => {}),
          userRef.set({ vinylShelf: cleanList }, { merge: true }).catch(() => {})
        ]);
      } catch {}
      state.syncInFlight = false;
    }
  }

  function searchSongsJsonp(query) {
    return new Promise((resolve, reject) => {
      const cb = "p23vn_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      const script = document.createElement("script");
      let done = false;
      const cleanup = () => {
        try { delete window[cb]; } catch { window[cb] = undefined; }
        if (script.parentNode) script.remove();
      };
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error("Search timed out"));
      }, 9000);

      window[cb] = data => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        cleanup();
        resolve((data && data.results) || []);
      };
      script.onerror = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        cleanup();
        reject(new Error("Search request failed"));
      };
      script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=16&callback=${cb}`;
      document.head.appendChild(script);
    });
  }

  async function searchSongsCatalog(query) {
    const q = String(query || "").trim();
    if (!q) return [];
    try {
      const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=16`);
      if (res.ok) {
        const data = await res.json();
        if (data && Array.isArray(data.results)) return data.results;
      }
    } catch {}
    return searchSongsJsonp(q);
  }

  async function reorderVinylShelf(fromId, toId) {
    if (!fromId || !toId || fromId === toId) return;
    const list = loadVinyls();
    const fromIdx = list.findIndex(x => x.id === fromId);
    const toIdx = list.findIndex(x => x.id === toId);
    if (fromIdx === -1 || toIdx === -1) return;

    const [moved] = list.splice(fromIdx, 1);
    list.splice(toIdx, 0, moved);
    state.sortBy = "custom";
    await saveVinyls(list);

          return;
        }
        const t = e.touches[0];
        if (!t) return;
        e.preventDefault();
        const overEl = document.elementFromPoint(t.clientX, t.clientY);
        const overSlot = overEl && overEl.closest && overEl.closest("[data-vinyl-slot]");
        cabinet.querySelectorAll(".vn-record-slot.is-drop-target").forEach(el => el.classList.remove("is-drop-target"));
        if (overSlot && overSlot.dataset.vinylSlot !== touchDragId) {
          overSlot.classList.add("is-drop-target");
          touchTargetId = overSlot.dataset.vinylSlot;
        } else {
          touchTargetId = null;
        }
      }, { passive: false });

      const finishTouchDrag = async () => {
        clearTimeout(pressTimer);
        if (!touchDragId) return;
        slot.classList.remove("is-dragging");
        cabinet.querySelectorAll(".vn-record-slot.is-drop-target").forEach(el => el.classList.remove("is-drop-target"));
        const fromId = touchDragId;
        const toId = touchTargetId;
        touchDragId = null;
        touchTargetId = null;
        if (fromId && toId && fromId !== toId) {
          await reorderVinylShelf(fromId, toId);
        }
      };
      slot.addEventListener("touchend", finishTouchDrag);
      slot.addEventListener("touchcancel", finishTouchDrag);
    });

    cabinet.querySelectorAll("[data-fav-vinyl]").forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const listNow = loadVinyls();
        const target = listNow.find(x => x.id === btn.dataset.favVinyl);
        if (!target) return;
        target.favorite = !target.favorite;
        await saveVinyls(listNow);
      };
    });

    cabinet.querySelectorAll("[data-wax-cycle]").forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const listNow = loadVinyls();
        const target = listNow.find(x => x.id === btn.dataset.waxCycle);
        if (!target) return;
        const keys = Object.keys(WAX_STYLES);
        const curIdx = keys.indexOf(target.wax || "obsidian");
        target.wax = keys[(curIdx + 1) % keys.length];
        await saveVinyls(listNow);
        if (state.activeVinylId === target.id) {
          updateTurntableUI(target);
        }
        DB.toast("Vinyl Wax Updated", `Changed "${target.title}" to ${WAX_STYLES[target.wax].name} wax.`, 2000);
      };
    });

    cabinet.querySelectorAll("[data-src-vinyl]").forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const target = loadVinyls().find(x => x.id === btn.dataset.srcVinyl);
        if (target) openFullTrackSourceModal(target);
      };
    });

    cabinet.querySelectorAll("[data-del-vinyl]").forEach(btn => {
      btn.onclick = async e => {
        e.stopPropagation();
        const listNow = loadVinyls();
        const idx = listNow.findIndex(x => x.id === btn.dataset.delVinyl);
        if (idx === -1) return;
        const removed = listNow[idx];
        listNow.splice(idx, 1);
        if (state.activeVinylId === removed.id) {
          stopAllPlayback();
          state.activeVinylId = listNow[0]?.id || null;
          state.activeVinylObj = listNow[0] || null;
        }
        await saveVinyls(listNow);
        DB.toast("Removed from Shelf", `"${removed.title}" was removed from your bookshelf.`, 2200);
      };
    });
  }

  function openFullTrackSourceModal(vinyl) {
    const node = document.createElement("div");
    const curYt = vinyl.ytVideoId ? `https://www.youtube.com/watch?v=${vinyl.ytVideoId}` : "";
    const curAudio = vinyl.fullAudioUrl || "";
    const hasFull = Boolean(vinyl.fullAudioUrl || vinyl.ytVideoId);
    const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent((vinyl.title || "") + " " + (vinyl.artist || "") + " official audio")}`;

    node.innerHTML = `
      <h2>Full-Length Song Source — ${DB.esc(vinyl.title)}</h2>
      <p class="muted" style="margin-top:-.35rem;margin-bottom:.8rem;font-size:.82rem;">
        Apple Music's catalog only provides 30-second previews without a paid subscription. To play the <b>entire full-length song</b> on your turntable, paste its YouTube URL (or a direct audio stream URL) below.
      </p>

      <div class="hint" style="margin-bottom:.8rem;font-size:.79rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap;">
        <div>
          <b>Status:</b>
          <span id="vnModalSrcStatus" style="color:${hasFull ? "var(--vn-green)" : "var(--vn-gold)"};font-weight:700;">
            ${hasFull ? `✓ Full-Length Song Linked (${DB.esc(vinyl.sourceName || "Full YouTube Audio")})` : "30s Preview Only (Link YouTube below for Full Song)"}
          </span>
        </div>
        <a href="${DB.esc(ytSearchUrl)}" target="_blank" rel="noopener noreferrer" class="vn-btn" style="height:28px;min-height:28px;padding:0 .68rem;font-size:.73rem;">
          Find on YouTube ↗
        </a>
      </div>

      <div class="field">
        <label for="vnModalYtInput">YouTube Song URL or Video ID (Plays Full Song on Turntable)</label>
        <input id="vnModalYtInput" type="text" placeholder="https://www.youtube.com/watch?v=... or https://youtu.be/..." value="${DB.esc(curYt)}" style="width:100%">
      </div>

      <div class="field">
        <label for="vnModalAudioInput">Or Direct Full Audio URL (.mp3 / .m4a / .mp4)</label>
        <input id="vnModalAudioInput" type="url" placeholder="https://example.com/full-song.mp3" value="${DB.esc(curAudio)}" style="width:100%">
      </div>

      <div class="actions">
        ${hasFull ? `<button type="button" class="danger left" id="vnModalClear">Remove Link</button>` : `<button type="button" class="ghost left" id="vnModalCancel">Cancel</button>`}
        ${hasFull ? `<button type="button" class="ghost" id="vnModalCancel">Cancel</button>` : ""}
        <button type="button" class="primary" id="vnModalSave">Verify &amp; Save Full Song</button>
      </div>
    `;

    const close = DB.modal(node);

    const cancelBtn = node.querySelector("#vnModalCancel");
    if (cancelBtn) cancelBtn.onclick = close;

    const clearBtn = node.querySelector("#vnModalClear");
    if (clearBtn) {
      clearBtn.onclick = async () => {
        const list = loadVinyls();
        const target = list.find(x => x.id === vinyl.id) || vinyl;
        target.ytVideoId = "";
        target.fullAudioUrl = "";
        target.sourceName = "";
        await saveVinyls(list);
        close();
        await prepareVinylOnDeck(target, false);
        DB.toast("Full Song Link Removed", `Reverted "${target.title}" to standard preview.`, 2200);
      };
    }

    node.querySelector("#vnModalSave").onclick = async () => {
      const ytVal = node.querySelector("#vnModalYtInput").value.trim();
      const audioVal = node.querySelector("#vnModalAudioInput").value.trim();
      const saveBtn = node.querySelector("#vnModalSave");
      const statusEl = node.querySelector("#vnModalSrcStatus");

      let verifiedVid = "";
      if (ytVal) {
        const extracted = extractYouTubeId(ytVal);
        if (!extracted) {
          node.querySelector("#vnModalYtInput").focus();
          DB.toast("Invalid YouTube Link", "Please paste a valid YouTube watch URL (youtube.com/watch?v=... or youtu.be/...).", 3000);
          return;
        }
        saveBtn.textContent = "Verifying YouTube Video…";
        saveBtn.disabled = true;
        const check = await verifyYouTubeVideoExists(extracted);
        saveBtn.disabled = false;
        saveBtn.textContent = "Verify & Save Full Song";
        if (!check.ok) {
          statusEl.style.color = "#ff453a";
          statusEl.textContent = "Could not verify that YouTube video ID.";
          return;
        }
        verifiedVid = check.videoId;
      }

      const list = loadVinyls();
      const target = list.find(x => x.id === vinyl.id) || vinyl;
      target.ytVideoId = verifiedVid;
      target.fullAudioUrl = audioVal || "";
      target.sourceName = target.fullAudioUrl
        ? "Full Audio Stream"
        : (target.ytVideoId ? "Full YouTube Audio" : "");
      if (target.ytVideoId || target.fullAudioUrl) {
        target.fullDurationSec = Math.max(60, Number(target.fullDurationSec) || Math.round((Number(target.durationMs) || 210000) / 1000));
      }

      await saveVinyls(list);
      close();
      await prepareVinylOnDeck(target, false);
      DB.toast("Full Song Linked", `"${target.title}" is verified and ready on the platter.`, 2600);
    };
  }

  function fmtSec(sec) {
    const s = Math.max(0, Math.floor(Number(sec) || 0));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${m}:${String(r).padStart(2, "0")}`;
  }

  function stopAllPlayback() {
    try { audioEl.pause(); } catch {}
    if (ytReady && ytPlayer && typeof ytPlayer.pauseVideo === "function") {
      try { ytPlayer.pauseVideo(); } catch {}
    }
    state.isPlaying = false;
    stopVinylCrackle();
  }

  function getExpectedDurationSec(v) {
    if (!v) return 0;
    const hasFull = Boolean(v.ytVideoId || v.fullAudioUrl);
    if (hasFull) {
      if (v.ytVideoId && ytReady && ytPlayer && state.activeVinylId === v.id && typeof ytPlayer.getDuration === "function") {
        const ytDur = Number(ytPlayer.getDuration()) || 0;
        if (ytDur > 0) return Math.round(ytDur);
      }
      if (Number(v.fullDurationSec) > 35) return Number(v.fullDurationSec);
      if (Number(v.durationMs) > 35000) return Math.round(Number(v.durationMs) / 1000);
      return 210;
    }
    if (audioEl.duration && Number.isFinite(audioEl.duration) && audioEl.duration > 0) {
      return Math.round(audioEl.duration);
    }
    return 30;
  }

  function updateTonearmAngle(curOverride, durOverride) {
    const pivot = $("vnTonearmPivot");
    if (!pivot) return;
    if (!state.activeVinylId || !state.isPlaying) {
      pivot.style.transform = state.activeVinylId ? "rotate(16deg)" : "rotate(0deg)";
      return;
    }
    const dur = durOverride || getExpectedDurationSec(state.activeVinylObj) || 210;
    const cur = curOverride !== undefined ? curOverride : (audioEl.currentTime || 0);
    const progress = Math.max(0, Math.min(1, cur / Math.max(1, dur)));
    const deg = 23 + progress * 15;
    pivot.style.transform = `rotate(${deg.toFixed(2)}deg)`;
  }

  function updateTurntableUI(vinylObj) {
    const v = vinylObj || loadVinyls().find(x => x.id === state.activeVinylId) || state.activeVinylObj || null;
    const disc = $("vnActiveDisc");
    const label = $("vnActiveLabel");
    const lamp = $("vnPowerLamp");
    const eq = $("vnEqBars");
    const playIcon = $("vnPlayIcon");
    const srcBtnLbl = $("vnSourceBtnLbl");
    const srcBtn = $("vnSourceBtn");

    if (v) {
      const waxObj = WAX_STYLES[v.wax] || WAX_STYLES.obsidian;
      const hasFull = Boolean(v.ytVideoId || v.fullAudioUrl);
      const modeBadge = hasFull ? (v.sourceName || "FULL YOUTUBE AUDIO") : "30S PREVIEW · LINK YOUTUBE FOR FULL SONG";
      disc.style.setProperty("--active-wax-bg", waxObj.bg);
      label.style.backgroundImage = `url('${v.cover}')`;
      $("vnNowCoverImg").src = v.cover || "assets/logo.png";
      $("vnNowTitle").textContent = v.title;
      $("vnNowArtist").textContent = `${v.artist} — ${v.album}${v.year ? " (" + v.year + ")" : ""}`;
      $("vnNowStatusTag").innerHTML = state.isPlaying
        ? `<i class="vn-now-dot"></i><span>SPINNING · ${DB.esc(modeBadge.toUpperCase())}</span>`
        : `<span>ON PLATTER · ${DB.esc(modeBadge.toUpperCase())}</span>`;
      $("vnWaxEditionLbl").textContent = `${waxObj.name} Wax · ${state.rpm === 45 ? "45" : "33⅓"} RPM · ${hasFull ? "Full Song" : "30s Preview"}`;

      const expDur = getExpectedDurationSec(v);
      if (!state.isPlaying) {
        $("vnDurTimeLbl").textContent = expDur > 0 ? fmtSec(expDur) : "--:--";
      }

      if (srcBtnLbl) {
        srcBtnLbl.textContent = hasFull ? "✓ Track Linked" : "Link Track";
      }
      if (srcBtn) {
        srcBtn.classList.toggle("on", hasFull);
      }
    } else {
      disc.style.setProperty("--active-wax-bg", WAX_STYLES.obsidian.bg);
      label.style.backgroundImage = "none";
      $("vnNowCoverImg").src = "assets/logo.png";
      $("vnNowTitle").textContent = "No Vinyl on the Platter";
      $("vnNowArtist").textContent = "Click any vinyl on your bookshelf above to drop the needle";
      $("vnNowStatusTag").innerHTML = `<span>TURNTABLE READY · SELECT A VINYL</span>`;
      $("vnWaxEditionLbl").textContent = `${state.rpm === 45 ? "45" : "33⅓"} RPM · Analog Stereo`;
      $("vnDurTimeLbl").textContent = "--:--";
      if (srcBtnLbl) srcBtnLbl.textContent = "Full Track Source";
      if (srcBtn) srcBtn.classList.remove("on");
    }

    lamp.classList.toggle("on", state.isPlaying);
    eq.classList.toggle("playing", state.isPlaying);
    playIcon.innerHTML = state.isPlaying
      ? `<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>`
      : `<polygon points="6 4 20 12 6 20 6 4"/>`;

    updateTonearmAngle();
  }

  async function prepareVinylOnDeck(vinylObj, autoPlay = false) {
    if (!vinylObj) return;
    stopAllPlayback();

    state.activeVinylId = vinylObj.id;
    state.activeVinylObj = vinylObj;
    $("vnCurTimeLbl").textContent = "0:00";
    $("vnSeekSlider").value = "0";

    const ytId = extractYouTubeId(vinylObj.ytVideoId || "");
    if (ytId) {
      vinylObj.ytVideoId = ytId;
      state.playbackEngine = "yt";
      audioEl.removeAttribute("src");
      $("vnDurTimeLbl").textContent = fmtSec(getExpectedDurationSec(vinylObj));
      updateTurntableUI(vinylObj);
      renderBookshelf(loadVinyls());

      const check = await verifyYouTubeVideoExists(ytId);
      if (check.ok) {
        playOrCueYtVideo(ytId, autoPlay);
        if (autoPlay) {
          state.isPlaying = true;
          startVinylCrackle();
        }
      }
      updateTurntableUI(vinylObj);
      renderBookshelf(loadVinyls());
      return;
    }

    if (vinylObj.fullAudioUrl) {
      state.playbackEngine = "audio";
      audioEl.src = vinylObj.fullAudioUrl;
      audioEl.playbackRate = state.rpm === 45 ? 1.18 : 1.0;
      $("vnDurTimeLbl").textContent = fmtSec(getExpectedDurationSec(vinylObj));
      if (autoPlay) {
        try {
          await audioEl.play();
          state.isPlaying = true;
          startVinylCrackle();
        } catch {
          state.isPlaying = false;
        }
      }
      updateTurntableUI(vinylObj);
      renderBookshelf(loadVinyls());
      return;
    }

    state.playbackEngine = "audio";
    if (vinylObj.previewUrl) {
      audioEl.src = vinylObj.previewUrl;
      audioEl.playbackRate = state.rpm === 45 ? 1.18 : 1.0;
      $("vnDurTimeLbl").textContent = "0:30";
      if (autoPlay) {
        try {
          await audioEl.play();
          state.isPlaying = true;
          startVinylCrackle();
        } catch {
          state.isPlaying = false;
        }
      }
    } else {
      audioEl.removeAttribute("src");
      $("vnDurTimeLbl").textContent = "--:--";
    }

    updateTurntableUI(vinylObj);
    renderBookshelf(loadVinyls());
  }

  function loadVinylOntoTurntable(vinylObj, autoPlay = true) {
    return prepareVinylOnDeck(vinylObj, autoPlay);
  }

  async function toggleTurntablePlayPause() {
    if (!(await ensureAccountAccess())) return;
    const list = loadVinyls();
    let cur = list.find(x => x.id === state.activeVinylId) || state.activeVinylObj;
    if (!cur && list.length) {
      cur = list[0];
      await prepareVinylOnDeck(cur, true);
      return;
    }
    if (!cur) {
      DB.toast("No Vinyl Loaded", "Search and add a song to your bookshelf first, then click it to play.", 2600);
      return;
    }

    if (state.isPlaying) {
      stopAllPlayback();
      updateTurntableUI(cur);
      renderBookshelf(list);
      return;
    }

    const ytId = extractYouTubeId(cur.ytVideoId || "");
    if (ytId) {
      state.playbackEngine = "yt";
      audioEl.removeAttribute("src");
      if (ytReady && ytPlayer && typeof ytPlayer.playVideo === "function") {
        const videoData = (typeof ytPlayer.getVideoData === "function") ? ytPlayer.getVideoData() : null;
        if (videoData && videoData.video_id === ytId) {
          ytPlayer.playVideo();
        } else {
          playOrCueYtVideo(ytId, true);
        }
        state.isPlaying = true;
        startVinylCrackle();
      } else {
        playOrCueYtVideo(ytId, true);
        state.isPlaying = true;
      }
      updateTurntableUI(cur);
      renderBookshelf(list);
      return;
    }

    state.playbackEngine = "audio";
    const targetSrc = cur.fullAudioUrl || cur.previewUrl || "";
    if (!audioEl.src && targetSrc) audioEl.src = targetSrc;
    try {
      await audioEl.play();
      state.isPlaying = true;
      startVinylCrackle();
    } catch {
      state.isPlaying = false;
    }
    updateTurntableUI(cur);
    renderBookshelf(list);
  }

  function stepShelfVinyl(dir = 1) {
    const list = loadVinyls();
    if (!list.length) return;
    const idx = list.findIndex(x => x.id === state.activeVinylId);
    const nextIdx = idx === -1 ? 0 : (idx + dir + list.length) % list.length;
    prepareVinylOnDeck(list[nextIdx], true);
  }

  audioEl.addEventListener("loadedmetadata", () => {
    if (state.playbackEngine !== "audio") return;
    if (state.activeVinylObj && state.activeVinylObj.ytVideoId) return;
    const dur = audioEl.duration || 30;
    $("vnDurTimeLbl").textContent = fmtSec(dur);
  });

  audioEl.addEventListener("timeupdate", () => {
    if (state.playbackEngine !== "audio") return;
    if (state.activeVinylObj && state.activeVinylObj.ytVideoId) return;
    const dur = audioEl.duration || 30;
    const cur = audioEl.currentTime || 0;
    $("vnSeekSlider").value = String(((cur / dur) * 100).toFixed(1));
    $("vnCurTimeLbl").textContent = fmtSec(cur);
    $("vnDurTimeLbl").textContent = fmtSec(dur);
    updateTonearmAngle(cur, dur);
  });

  audioEl.addEventListener("ended", () => {
    if (state.playbackEngine !== "audio") return;
    state.isPlaying = false;
    stopVinylCrackle();
    updateTurntableUI();
    renderBookshelf(loadVinyls());
    if (state.autoNextOn && loadVinyls().length > 1) {
      setTimeout(() => stepShelfVinyl(1), 450);
    }
  });

  $("vnSeekSlider").oninput = e => {
    const pct = parseFloat(e.target.value) || 0;
    if (state.playbackEngine === "yt" && ytReady && ytPlayer && typeof ytPlayer.getDuration === "function") {
      const dur = Number(ytPlayer.getDuration()) || getExpectedDurationSec(state.activeVinylObj) || 210;
      const targetSec = (pct / 100) * dur;
      try { ytPlayer.seekTo(targetSec, true); } catch {}
      updateTonearmAngle(targetSec, dur);
    } else {
      const dur = audioEl.duration || 30;
      audioEl.currentTime = (pct / 100) * dur;
      updateTonearmAngle(audioEl.currentTime, dur);
    }
  };

  $("vnPlayPauseBtn").onclick = toggleTurntablePlayPause;
  $("vnPrevBtn").onclick = async () => {
    if (!(await ensureAccountAccess())) return;
    stepShelfVinyl(-1);
  };
  $("vnNextBtn").onclick = async () => {
    if (!(await ensureAccountAccess())) return;
    stepShelfVinyl(1);
  };
  $("vnActiveDisc").onclick = toggleTurntablePlayPause;

  $("vnSourceBtn").onclick = async () => {
    if (!(await ensureAccountAccess())) return;
    const list = loadVinyls();
    const cur = list.find(x => x.id === state.activeVinylId) || state.activeVinylObj || list[0];
    if (!cur) {
      DB.toast("Select a Vinyl First", "Add or select a vinyl on your shelf to configure its audio source.", 2500);
      return;
    }
    openFullTrackSourceModal(cur);
  };

  document.querySelectorAll("[data-rpm]").forEach(btn => {
    btn.onclick = () => {
      state.rpm = parseInt(btn.dataset.rpm, 10) || 33;
      document.querySelectorAll("[data-rpm]").forEach(b => b.classList.toggle("active", b === btn));
      audioEl.playbackRate = state.rpm === 45 ? 1.18 : 1.0;
      if (ytReady && ytPlayer && typeof ytPlayer.setPlaybackRate === "function") {
        try { ytPlayer.setPlaybackRate(state.rpm === 45 ? 1.25 : 1.0); } catch {}
      }
      updateTurntableUI();
    };
  });

  $("vnCrackleBtn").onclick = () => {
    state.crackleOn = !state.crackleOn;
    $("vnCrackleBtn").classList.toggle("on", state.crackleOn);
    $("vnCrackleBtn").querySelector("span").textContent = `Vinyl Crackle: ${state.crackleOn ? "On" : "Off"}`;
    if (state.crackleOn && state.isPlaying) startVinylCrackle();
    else stopVinylCrackle();
  };

  $("vnAutoNextBtn").onclick = () => {
    state.autoNextOn = !state.autoNextOn;
    $("vnAutoNextBtn").classList.toggle("on", state.autoNextOn);
  };

  $("vnVolSlider").oninput = e => {
    state.volume = parseFloat(e.target.value) || 0;
    audioEl.volume = state.volume;
    if (ytReady && ytPlayer && typeof ytPlayer.setVolume === "function") {
      try { ytPlayer.setVolume(Math.round(state.volume * 100)); } catch {}
    }
    if (crackleGain) crackleGain.gain.value = 0.06 * state.volume;
  };

  document.querySelectorAll("#vnWaxPicker [data-wax]").forEach(chip => {
    chip.onclick = () => {
      state.selectedWax = chip.dataset.wax;
      document.querySelectorAll("#vnWaxPicker [data-wax]").forEach(c => c.classList.toggle("active", c === chip));
    };
  });

  async function runSongSearch() {
    if (!(await ensureAccountAccess())) return;
    const q = $("vnSearchInput").value.trim();
    if (!q) {
      $("vnSearchInput").focus();
      return;
    }
    const btn = $("vnSearchBtn");
    const origHtml = btn.innerHTML;
    btn.innerHTML = `<span>Searching…</span>`;
    try {
      const rawResults = await searchSongsCatalog(q);
      state.lastSearchResults = rawResults.map(mapTrackResult);
      renderSearchResults();
      if (!state.lastSearchResults.length) {
        DB.toast("No Songs Found", `Couldn't find matches for "${q}". Try another song or artist.`, 2500);
      }
    } catch {
      DB.toast("Search Error", "Could not reach the song catalog. Please try again.", 2800);
    } finally {
      btn.innerHTML = origHtml;
    }
  }

  $("vnSearchBtn").onclick = runSongSearch;
  $("vnSearchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      runSongSearch();
    }
  });

  $("vnShelfFilterInput").oninput = e => {
    state.searchShelfQuery = e.target.value.trim();
    renderBookshelf(loadVinyls());
  };

  function bindDropdown(ddId, btnId, menuId) {
    const dd = $(ddId), btn = $(btnId), menu = $(menuId);
    btn.onclick = async e => {
      e.preventDefault();
      e.stopPropagation();
      if (!(await ensureAccountAccess())) return;
      const open = menu.hidden;
      $("vnFinishMenu").hidden = true;
      $("vnSortMenu").hidden = true;
      $("vnFinishDd").classList.remove("open");
      $("vnSortDd").classList.remove("open");
      menu.hidden = !open;
      dd.classList.toggle("open", open);
    };
  }
  bindDropdown("vnFinishDd", "vnFinishBtn", "vnFinishMenu");
  bindDropdown("vnSortDd", "vnSortBtn", "vnSortMenu");

  document.addEventListener("pointerdown", e => {
    if (!$("vnFinishDd").contains(e.target)) {
      $("vnFinishMenu").hidden = true;
      $("vnFinishDd").classList.remove("open");
    }
    if (!$("vnSortDd").contains(e.target)) {
      $("vnSortMenu").hidden = true;
      $("vnSortDd").classList.remove("open");
    }
  }, true);

  window.addEventListener("resize", () => {
    renderBookshelf(loadVinyls());
  });

  let initialDeckPrepared = false;
  function renderAll() {
    const list = loadVinyls();
    if (!state.activeVinylId && list.length) {
      state.activeVinylId = list[0].id;
      state.activeVinylObj = list[0];
      if (!initialDeckPrepared) {
        initialDeckPrepared = true;
        prepareVinylOnDeck(list[0], false);
        return;
      }
    } else if (state.activeVinylId) {
      const fresh = list.find(x => x.id === state.activeVinylId);
      if (fresh) {
        state.activeVinylObj = fresh;
        if (fresh.ytVideoId) state.playbackEngine = "yt";
      }
    }
    renderBookshelf(list);
    updateTurntableUI();
    if (!$("vnSearchResultsGrid").hidden) {
      renderSearchResults();
    }
  }

  if (typeof DB.onLogin === "function") {
    DB.onLogin(async () => {
      await initDirectFirestoreSync();
      renderAll();
    });
  }

  initDirectFirestoreSync().then(() => {
    renderAll();
  });
});
</script>
</body>
</html>
