<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICO AI | Project 23</title>
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project 23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;500;600;700&family=Fredoka:wght@500&family=Playfair+Display:wght@600&family=Caveat:wght@600&family=Space+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/site-config.js"></script>
<script src="js/core.js"></script>
<style>
  :root {
    --apple-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --apple-spring: cubic-bezier(0.16, 1, 0.3, 1);
    --tac-font: "Rajdhani", var(--display), sans-serif;
    --mono-font: "Space Mono", var(--mono), monospace;
    --val-primary: #ff4655;
    --val-secondary: #00f5d4;
    --val-tertiary: #38bdf8;
    --val-amber: #facc15;
    --val-bg-deep: color-mix(in srgb, var(--card-solid) 92%, #090d16);
    --val-bg-panel: color-mix(in srgb, var(--card-2) 88%, #0f1724);
    --val-bg-elevated: color-mix(in srgb, var(--card-2) 94%, #162032);
    --val-border: color-mix(in srgb, var(--val-primary) 26%, var(--line));
    --val-border-cyan: color-mix(in srgb, var(--val-secondary) 32%, var(--line));
    --val-glow: 0 0 22px color-mix(in srgb, var(--val-primary) 28%, transparent);
    --val-cyan-glow: 0 0 20px color-mix(in srgb, var(--val-secondary) 26%, transparent);
  }

  body[data-page="pico"][data-hud-theme="radianite"],
  .chat-panel[data-hud-theme="radianite"] {
    --val-primary: #00f5d4;
    --val-secondary: #38bdf8;
    --val-tertiary: #a855f7;
  }
  body[data-page="pico"][data-hud-theme="phantom"],
  .chat-panel[data-hud-theme="phantom"] {
    --val-primary: var(--accent, #a855f7);
    --val-secondary: #00f5d4;
    --val-tertiary: var(--accent2, #6366f1);
  }
  body[data-page="pico"][data-hud-theme="killjoy"],
  .chat-panel[data-hud-theme="killjoy"] {
    --val-primary: #facc15;
    --val-secondary: #ff4655;
    --val-tertiary: #00f5d4;
  }

  body[data-page="pico"] .topbar {
    position: sticky;
    top: calc(0.5rem + var(--safe-top));
    width: min(1208px, calc(100% - 2rem));
    margin: 0.55rem auto 0.1rem;
    padding: 0.48rem 0.72rem 0.48rem 0.85rem;
    border-radius: 4px !important;
    clip-path: polygon(
      0 10px,
      10px 0,
      calc(100% - 16px) 0,
      100% 16px,
      100% calc(100% - 10px),
      calc(100% - 10px) 100%,
      12px 100%,
      0 calc(100% - 12px)
    );
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--val-primary) 13%, var(--val-bg-deep)) 0%, var(--val-bg-deep) 32%, var(--val-bg-panel) 100%) !important;
    backdrop-filter: blur(26px) saturate(185%) !important;
    -webkit-backdrop-filter: blur(26px) saturate(185%) !important;
    border: 1px solid var(--val-border) !important;
    border-left: 3px solid var(--val-primary) !important;
    box-shadow:
      0 18px 42px -12px rgba(0, 0, 0, 0.68),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05) !important;
  }

  body[data-page="pico"] .topbar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--val-primary), var(--val-secondary), transparent 85%);
    opacity: 0.9;
    pointer-events: none;
    z-index: 5;
  }

  body[data-page="pico"] .topbar::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: -1;
  }

  body[data-page="pico"] .topbar .tb-spot {
    background: radial-gradient(circle, color-mix(in srgb, var(--val-primary) 24%, transparent), transparent 65%) !important;
  }

  body[data-page="pico"] .topbar .logo {
    display: inline-flex;
    align-items: center;
    gap: 0.52rem;
  }
  body[data-page="pico"] .topbar .logo::before {
    content: "// P23";
    font-family: var(--mono-font);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 0.14rem 0.42rem;
    background: var(--val-primary);
    color: #fff;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 0 100%);
    box-shadow: var(--val-glow);
    flex-shrink: 0;
  }
  body[data-page="pico"] .topbar .wm {
    font-family: var(--tac-font) !important;
    font-weight: 700 !important;
    font-size: 1.38rem !important;
    letter-spacing: 0.06em !important;
    text-transform: uppercase;
  }
  body[data-page="pico"] .topbar .wm .l {
    color: var(--text) !important;
    animation: none !important;
    text-shadow: none !important;
  }
  body[data-page="pico"] .topbar .wm .dg {
    color: var(--val-secondary) !important;
    animation: none !important;
    text-shadow: 0 0 12px color-mix(in srgb, var(--val-secondary) 45%, transparent) !important;
  }

  body[data-page="pico"] .navgroup {
    border-radius: 3px !important;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    background: color-mix(in srgb, var(--val-bg-elevated) 92%, #05070e) !important;
    border: 1px solid color-mix(in srgb, var(--val-primary) 26%, var(--line)) !important;
    padding: 0.22rem !important;
    gap: 0.15rem !important;
  }

  body[data-page="pico"] .nav-ind {
    border-radius: 2px !important;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    background: linear-gradient(135deg, var(--val-primary), color-mix(in srgb, var(--val-primary) 72%, #7f1d1d)) !important;
    border-bottom: 2px solid var(--val-secondary);
    box-shadow: var(--val-glow) !important;
  }

  body[data-page="pico"] .nav,
  body[data-page="pico"] .nav.more {
    border-radius: 2px !important;
    font-family: var(--tac-font) !important;
    font-weight: 700 !important;
    font-size: 0.86rem !important;
    letter-spacing: 0.07em !important;
    text-transform: uppercase;
    padding: 0.38rem 0.88rem !important;
  }

  body[data-page="pico"] .nav.hot,
  body[data-page="pico"] .nav.active.hot {
    color: #ffffff !important;
  }

  body[data-page="pico"] .nav:not(.hot):hover {
    color: var(--val-secondary) !important;
  }

  body[data-page="pico"] .topbar .sync {
    border-radius: 2px !important;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
    background: var(--val-bg-elevated) !important;
    border: 1px solid color-mix(in srgb, var(--val-secondary) 35%, var(--line)) !important;
    font-family: var(--mono-font) !important;
    font-size: 0.64rem !important;
    font-weight: 700 !important;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--val-secondary) !important;
    height: 2.15rem;
  }
  body[data-page="pico"] .topbar .sync i {
    width: 0.42rem;
    height: 0.42rem;
    border-radius: 1px !important;
    transform: rotate(45deg);
    background: var(--val-secondary) !important;
    box-shadow: 0 0 8px var(--val-secondary);
  }
  body[data-page="pico"] .topbar .sync.saving i {
    background: var(--val-amber) !important;
    box-shadow: 0 0 8px var(--val-amber);
  }
  body[data-page="pico"] .topbar .sync.error i {
    background: var(--val-primary) !important;
    box-shadow: 0 0 8px var(--val-primary);
  }

  body[data-page="pico"] .topbar .iconbtn {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 3px !important;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    background: var(--val-bg-elevated) !important;
    border: 1px solid color-mix(in srgb, var(--text) 14%, var(--line)) !important;
    color: var(--text) !important;
    transition: all 0.16s var(--apple-ease);
  }
  body[data-page="pico"] .topbar .iconbtn:hover {
    border-color: var(--val-primary) !important;
    color: var(--val-primary) !important;
    background: color-mix(in srgb, var(--val-primary) 14%, var(--val-bg-elevated)) !important;
  }
  body[data-page="pico"] .topbar .iconbtn .badge {
    border-radius: 2px !important;
    background: var(--val-primary) !important;
    font-family: var(--mono-font);
    font-size: 0.62rem;
  }

  body[data-page="pico"] .topbar .avatar {
    width: 2.25rem;
    height: 2.25rem;
    padding: 1.5px;
    border-radius: 3px !important;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    background: linear-gradient(135deg, var(--val-primary), var(--val-secondary)) !important;
    box-shadow: var(--val-glow);
  }
  body[data-page="pico"] .topbar .avatar > * {
    border-radius: 2px !important;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
    background: var(--val-bg-deep) !important;
    font-family: var(--tac-font);
    color: #fff;
  }

  body[data-page="pico"] #signBtn {
    border-radius: 3px !important;
    clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    background: linear-gradient(135deg, var(--val-primary), color-mix(in srgb, var(--val-primary) 72%, #7f1d1d)) !important;
    color: #fff !important;
    font-family: var(--tac-font) !important;
    font-weight: 700 !important;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    box-shadow: var(--val-glow);
  }

  body[data-page="pico"] .pagemenu,
  body[data-page="pico"] .notifpanel {
    border-radius: 4px !important;
    clip-path: polygon(0 10px, 10px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px));
    background: linear-gradient(180deg, var(--val-bg-deep), var(--val-bg-panel)) !important;
    border: 1px solid var(--val-border) !important;
    border-top: 2px solid var(--val-primary) !important;
    box-shadow: 0 26px 64px rgba(0, 0, 0, 0.75), var(--val-glow) !important;
  }
  body[data-page="pico"] .pm-head b,
  body[data-page="pico"] .np-head b {
    font-family: var(--tac-font) !important;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  body[data-page="pico"] .pm-ic {
    border-radius: 4px !important;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }
  body[data-page="pico"] .pm-feat-card {
    border-radius: 4px !important;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
  }

  body[data-page="pico"] .sitefoot {
    max-width: 1208px;
    font-family: var(--mono-font);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-top-color: color-mix(in srgb, var(--val-primary) 22%, var(--line));
  }
  body[data-page="pico"] .sitefoot a {
    color: var(--val-secondary);
  }

  @media (max-width: 760px) {
    body[data-page="pico"] .topbar {
      width: calc(100% - 1rem);
      padding: 0.38rem 0.55rem;
    }
    body[data-page="pico"] .topbar .sync {
      width: 1.75rem;
      height: 1.75rem;
      flex: 0 0 1.75rem;
      padding: 0;
    }
    body[data-page="pico"] > .navgroup {
      border-radius: 4px !important;
      clip-path: polygon(0 8px, 8px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
      background: linear-gradient(180deg, var(--val-bg-deep), var(--val-bg-panel)) !important;
      border: 1px solid var(--val-border) !important;
      border-top: 2px solid var(--val-primary) !important;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.75), var(--val-glow) !important;
    }
    body[data-page="pico"] > .navgroup .nav,
    body[data-page="pico"] > .navgroup .nav.more {
      font-size: 0.64rem !important;
      letter-spacing: 0.04em !important;
      padding: 0.38rem 0.15rem !important;
    }
  }

  main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0.65rem 1rem 1.4rem;
  }

  .val-top-telemetry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.35rem 0.65rem 0.55rem;
    font-family: var(--mono-font);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    user-select: none;
  }
  .val-tele-left,
  .val-tele-right {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    flex-wrap: wrap;
  }
  .val-tele-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.38rem;
    padding: 0.16rem 0.55rem;
    background: color-mix(in srgb, var(--val-primary) 14%, var(--val-bg-panel));
    border-left: 2px solid var(--val-primary);
    color: var(--text);
    font-weight: 700;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
  }
  .val-tele-tag.cyan {
    background: color-mix(in srgb, var(--val-secondary) 12%, var(--val-bg-panel));
    border-left-color: var(--val-secondary);
    color: var(--val-secondary);
  }
  .val-live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--val-secondary);
    box-shadow: 0 0 8px var(--val-secondary);
    animation: valPulse 1.6s infinite ease-in-out;
  }
  @keyframes valPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.75); }
  }

  .chat-panel {
    position: relative;
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 6.2rem);
    height: calc(100dvh - 6.2rem);
    min-height: 540px;
    border-radius: 6px;
    clip-path: polygon(
      0 14px,
      14px 0,
      calc(100% - 22px) 0,
      100% 22px,
      100% calc(100% - 14px),
      calc(100% - 14px) 100%,
      18px 100%,
      0 calc(100% - 18px)
    );
    background:
      radial-gradient(circle at 82% 14%, color-mix(in srgb, var(--val-primary) 11%, transparent), transparent 46%),
      radial-gradient(circle at 14% 88%, color-mix(in srgb, var(--val-secondary) 9%, transparent), transparent 48%),
      linear-gradient(180deg, var(--val-bg-deep) 0%, var(--val-bg-panel) 100%);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--val-border);
    box-shadow:
      0 24px 60px -18px rgba(0, 0, 0, 0.7),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  .chat-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }
  .chat-panel::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--val-primary), var(--val-secondary), transparent);
    opacity: 0.85;
    z-index: 45;
    pointer-events: none;
  }

  .chat-header-bar {
    position: relative;
    padding: 0.68rem 1rem;
    border-bottom: 1px solid color-mix(in srgb, var(--val-primary) 24%, var(--line));
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background:
      linear-gradient(90deg, color-mix(in srgb, var(--val-primary) 10%, transparent) 0%, transparent 38%),
      color-mix(in srgb, var(--val-bg-deep) 90%, transparent);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex: none;
    z-index: 30;
  }

  .val-icon-btn {
    width: 2.25rem;
    height: 2.25rem;
    min-width: 2.25rem;
    min-height: 2.25rem;
    padding: 0;
    border-radius: 4px;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
    background: var(--val-bg-elevated);
    border: 1px solid color-mix(in srgb, var(--text) 14%, var(--line));
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: all 0.16s var(--apple-ease);
  }
  .val-icon-btn:hover {
    border-color: var(--val-primary);
    color: var(--val-primary);
    background: color-mix(in srgb, var(--val-primary) 14%, var(--val-bg-elevated));
    transform: translateY(-1px);
  }
  .val-icon-btn svg {
    width: 1.05rem;
    height: 1.05rem;
  }

  .hdr-title-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.12rem;
  }

  .hdr-title-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    min-width: 0;
  }

  .val-ch-badge {
    font-family: var(--mono-font);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 0.12rem 0.45rem;
    background: var(--val-primary);
    color: #fff;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 0 100%);
    flex-shrink: 0;
  }

  #activeChatTitle {
    font-family: var(--tac-font);
    font-weight: 700;
    font-size: 1.18rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    color: var(--text);
    transition: color 0.15s;
  }

  #activeChatTitle:hover {
    color: var(--val-secondary);
  }

  .model-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    font-family: var(--mono-font);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .model-dot {
    width: 0.42rem;
    height: 0.42rem;
    border-radius: 1px;
    transform: rotate(45deg);
    background: var(--val-secondary);
    box-shadow: 0 0 8px var(--val-secondary);
  }

  .hdr-actions {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    flex: none;
    flex-wrap: wrap;
  }

  .val-mode-group {
    display: inline-flex;
    align-items: center;
    background: color-mix(in srgb, var(--val-bg-deep) 85%, transparent);
    border: 1px solid color-mix(in srgb, var(--text) 12%, var(--line));
    padding: 2px;
    border-radius: 4px;
    gap: 2px;
  }
  .val-mode-btn {
    height: 28px;
    min-height: 28px;
    padding: 0 0.55rem;
    border: 0;
    border-radius: 3px;
    background: transparent;
    color: var(--muted);
    font-family: var(--tac-font);
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .val-mode-btn:hover {
    color: var(--text);
    transform: none;
  }
  .val-mode-btn.active {
    background: var(--val-primary);
    color: #fff;
    box-shadow: 0 0 12px color-mix(in srgb, var(--val-primary) 45%, transparent);
  }

  .val-theme-dots {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0 0.35rem;
    height: 30px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--val-bg-deep) 75%, transparent);
    border: 1px solid color-mix(in srgb, var(--text) 10%, var(--line));
  }
  .val-theme-dot {
    width: 13px;
    height: 13px;
    min-width: 13px;

    font-family: var(--mono-font);
    font-size: 0.64rem;
    color: var(--muted);
    transition: transform 0.16s, color 0.16s;
  }
  .prompt-pill:hover .pp-arrow {
    color: var(--val-secondary);

  .prompt-pill .pp-txt {
    font-family: var(--tac-font);

  }

  .chat-input-area {
    padding: 0.65rem clamp(0.85rem, 2.5vw, 1.5rem) 0.9rem;
    background: linear-gradient(to top, color-mix(in srgb, var(--val-bg-deep) 96%, transparent) 65%, transparent);
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    flex: none;
  }

  .val-quick-directives {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .val-qd-left {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .val-qd-chip {
    height: 24px;
    min-height: 24px;
    padding: 0 0.55rem;
    border-radius: 2px;
    clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 0 100%);
    background: color-mix(in srgb, var(--val-bg-elevated) 85%, transparent);
    border: 1px solid color-mix(in srgb, var(--text) 12%, var(--line));
    color: var(--muted);
    font-family: var(--mono-font);
    font-size: 0.64rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.14s;
  }
  .val-qd-chip:hover {
    border-color: var(--val-secondary);
    color: var(--val-secondary);
    background: color-mix(in srgb, var(--val-secondary) 12%, var(--val-bg-elevated));
    transform: none;
  }
  .val-char-counter {
    font-family: var(--mono-font);
    font-size: 0.63rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .composer-box {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.42rem;
    padding: 0.48rem 0.55rem 0.48rem 0.65rem;
    border-radius: 4px;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    background: var(--val-bg-deep);
    border: 1px solid color-mix(in srgb, var(--val-primary) 35%, var(--line));
    border-left: 3px solid var(--val-primary);
    box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.55);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .composer-box:focus-within {
    border-color: var(--val-secondary);
    border-left-color: var(--val-secondary);
    box-shadow: 0 12px 34px -8px rgba(0, 0, 0, 0.6), var(--val-cyan-glow);
  }

  .chat-input-row {
    display: flex;
    gap: 0.48rem;
    align-items: flex-end;
  }

  .val-channel-cycler {
    height: 2.2rem;
    min-height: 2.2rem;
    padding: 0 0.62rem;
    border-radius: 3px;
    background: color-mix(in srgb, var(--val-primary) 18%, var(--val-bg-elevated));
    border: 1px solid color-mix(in srgb, var(--val-primary) 48%, transparent);
    color: var(--val-primary);
    font-family: var(--mono-font);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    transition: all 0.15s;
  }
  .val-channel-cycler:hover {
    background: color-mix(in srgb, var(--val-secondary) 18%, var(--val-bg-elevated));
    border-color: var(--val-secondary);
    color: var(--val-secondary);
    transform: none;
  }

  .chat-input-row textarea {
    flex: 1;
    min-height: 2.2rem;
    max-height: 7.5rem;
    resize: none;
    padding: 0.4rem 0.35rem;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: var(--body);
    font-size: 0.94rem;
    line-height: 1.45;
  }

  .chat-input-row textarea::placeholder {
    font-family: var(--mono-font);
    font-size: 0.78rem;
    color: var(--muted);
  }

  .chat-input-row textarea:focus {
    outline: none;

  }

  #attachBtn {
    width: 2.2rem;
    height: 2.2rem;
    min-width: 2.2rem;
    min-height: 2.2rem;
    flex: none;
    border-radius: 3px;
    background: var(--val-bg-elevated);
    border: 1px solid color-mix(in srgb, var(--text) 14%, var(--line));

  #sendBtn {
    height: 2.25rem;

    border-radius: 3px;

    background: linear-gradient(135deg, var(--val-primary), color-mix(in srgb, var(--val-primary) 75%, #991b1b));
    color: #fff;

  #sendBtn:hover {

  #sendBtn svg {

  .attach-preview {
    display: flex;

    flex-wrap: wrap;

  }

  .attach-preview:empty {
    display: none;

  .att-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    padding: 0.26rem 0.6rem;
    border-radius: 3px;
    background: var(--val-bg-elevated);
    border: 1px solid var(--val-secondary);

  .att-chip img {
    width: 22px;

    border-radius: 3px;

  .att-chip button {
    background: transparent;
    border: 0;
    padding: 0 0.15rem;
    cursor: pointer;
    color: var(--val-primary);
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1;
  }

  .search-sources {
    font-family: var(--mono-font);
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 0.28rem;
    display: flex;
    align-items: center;
    gap: 0.38rem;
    flex-wrap: wrap;
  }

  .search-source-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.28rem;
    padding: 0.16rem 0.55rem;
    border-radius: 2px;
    background: var(--val-bg-elevated);
    border: 1px solid color-mix(in srgb, var(--val-secondary) 40%, var(--line));
    text-decoration: none;
    color: var(--val-secondary);
    font-weight: 700;
    max-width: 230px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

  .search-source-pill:hover {
    border-color: var(--val-secondary);
    background: color-mix(in srgb, var(--val-secondary) 16%, var(--val-bg-elevated));
  }

  @media (max-width: 900px) {
    .val-mode-group {
      display: none;
    }
  }

  @media (max-width: 760px) {
    main {
      padding: 0.35rem 0.5rem 5.4rem;
    }

    .val-top-telemetry {
      font-size: 0.6rem;
      padding: 0.2rem 0.25rem 0.4rem;
    }
    .val-tele-right {
      display: none;
    }

    .chat-panel {
      height: calc(100vh - 9.4rem - var(--safe-top, 0px) - env(safe-area-inset-bottom));
      height: calc(100dvh - 9.4rem - var(--safe-top, 0px) - env(safe-area-inset-bottom));
      min-height: 400px;
    }

    .chat-sidebar-pane {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      height: 100%;
      width: min(286px, 84vw);
      background: var(--val-bg-deep);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      transform: translateX(-100%);
    }

    .chat-panel:not(.sidebar-collapsed) .chat-sidebar-pane {
      transform: translateX(0);
    }

    .chat-panel:not(.sidebar-collapsed) .chat-sidebar-backdrop {
      display: block;
      opacity: 1;
    }

    .prompt-pills {
      grid-template-columns: 1fr;
    }

    .msg {
      max-width: 95%;
    }

    .web-pill-btn span {
      display: none;
    }

    .web-pill-btn {
      padding: 0 0.55rem;
    }

    .val-channel-cycler span {
      display: none;
    }
  }
</style>

<body data-page="pico" data-hud-theme="valorant">
<header id="topbar"></header>
<main>
  <section class="panel chat-panel" id="chatPanel" data-hud-theme="valorant">
    <div class="chat-header-bar">
      <button class="val-icon-btn" id="toggleSidebarBtn" title="Toggle Operation Logs" aria-label="Toggle History"></button>
      <div class="hdr-title-wrap">
        <div class="hdr-title-row">
          <span class="val-ch-badge">AGENT PICO</span>
          <b id="activeChatTitle" title="Click to rename operation log">PICO</b>
        </div>
        <div class="model-pill">
          <span class="model-dot"></span>
          <span id="activeChatModelInfo">Powered by Gemini Flash</span>
        </div>
      </div>

      <div class="hdr-actions">
        <div class="val-theme-dots" role="group" aria-label="HUD Color Protocol">
          <button type="button" class="val-theme-dot active" data-hud-pick="valorant" style="background:#ff4655;color:#ff4655" title="Protocol Crimson & Radianite"></button>
          <button type="button" class="val-theme-dot" data-hud-pick="radianite" style="background:#00f5d4;color:#00f5d4" title="Radianite Teal & Cyber Cyan"></button>
          <button type="button" class="val-theme-dot" data-hud-pick="phantom" style="background:#a855f7;color:#a855f7" title="Omen Phantom Violet"></button>
          <button type="button" class="val-theme-dot" data-hud-pick="killjoy" style="background:#facc15;color:#facc15" title="Killjoy Tactical Gold"></button>
        </div>

        <button type="button" id="webSearchToggle" class="web-pill-btn" title="Toggle Google Web Search Recon" aria-pressed="false"></button>
        <button type="button" id="topNewChatBtn" class="val-icon-btn" title="New Operation Link" aria-label="New Conversation"></button>
      </div>
    </div>

    <div class="chat-inner-layout">
      <div class="chat-sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="chat-sidebar-pane" id="chatSidebarPane" aria-label="Conversations">
        <div class="sb-top">
          <button type="button" class="primary" id="newChatBtn"></button>
          <div class="sb-search">
            <span id="sbSearchIc"></span>
            <input type="search" id="chatFilterInput" placeholder="SEARCH OPERATION LOGS…" aria-label="Filter conversations">
          </div>
        </div>
        <div class="sb-label-row">
          <span class="sb-label">// Operation Logs</span>
          <span class="sb-count-tag" id="sbLogCountTag">0 LOGS</span>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="sb-footer-hud">
          <span>COMMS: ENCRYPTED</span>
          <span id="sbHudStatus">STATUS // READY</span>
        </div>
      </aside>

      <div class="chat-main-area">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <div class="val-quick-directives">
            <div class="val-qd-left">
              <button type="button" class="val-qd-chip" data-qd="/debug ">// DEBUG CODE</button>
              <button type="button" class="val-qd-chip" data-qd="/explain ">// EXPLAIN STEP-BY-STEP</button>
              <button type="button" class="val-qd-chip" data-qd="/summarize ">// TACTICAL BRIEF</button>
              <button type="button" class="val-qd-chip" data-qd="/brainstorm ">// IDEATE</button>
            </div>
            <span class="val-char-counter" id="valCharCounter">0 CHARS // READY</span>
          </div>

          <div class="composer-box">
            <div class="attach-preview" id="attachPreview"></div>
            <div class="chat-input-row">
              <input type="file" id="fileInput" accept="image/*,.txt,.pdf,.md,.csv,.json" style="display:none" multiple>
              <button type="button" class="val-icon-btn" id="attachBtn" title="Attach image or data file" aria-label="Attach file"></button>
              <textarea id="userInput" placeholder="Transmit directive to Agent PICO…" rows="1"></textarea>
              <button type="button" class="primary" id="sendBtn" aria-label="Send message"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
  DB.whenReady(async () => {
    const $ = id => document.getElementById(id);
    const CHATS_KEY = "p23.pico_chats";
    const HUD_THEME_KEY = "p23.pico_hud_theme";
    const FREE_MODELS = [
      "gemini-3.8-flash",
      "gemini-3.6-flash",
      "gemini-3.5-flash-lite"
    ];

    const PICO_SYS_PROMPT = "You are PICO (Project 23 Integrated Chat Operator), a friendly, witty, entertaining, and highly knowledgeable AI companion. You love chatting, telling engaging stories, cracking jokes, helping with coding, writing, and exploring the world.";

    const PICO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M3 7l3.5 2M17.5 15L21 17M21 7l-3.5 2M6.5 15L3 17"/></svg>';
    const THINKING_PHRASES = [
      "DECRYPTING NEURAL STREAM...",
      "SCANNING TACTICAL ARCHIVES...",
      "COMPILING PROTOCOL RESPONSE...",
      "LOCKING SIGNAL COORDINATES...",
      "TRANSMISSION READY..."
    ];

    let chats = (DB.get(CHATS_KEY, []) || []).slice();
    let activeChatId = chats[0]?.id || null;
    let currentAttachments = [];
    let webSearchEnabled = false;
    let currentModelIndex = 0;
    let filterQuery = "";
    let isStreaming = false;

    try {
      const savedTheme = localStorage.getItem(HUD_THEME_KEY);
      if (savedTheme) {
        $("chatPanel").dataset.hudTheme = savedTheme;
        document.body.dataset.hudTheme = savedTheme;
        document.querySelectorAll("[data-hud-pick]").forEach(b => {
          b.classList.toggle("active", b.dataset.hudPick === savedTheme);
        });
      }
    } catch {}

    if (matchMedia("(max-width: 760px)").matches) {
      $("chatPanel").classList.add("sidebar-collapsed");
    }

    $("toggleSidebarBtn").innerHTML = DB.icon("list");
    $("newChatBtn").innerHTML = DB.icon("plus") + "<span>Initialize New Link<" + "/span>";
    $("topNewChatBtn").innerHTML = DB.icon("plus");
    $("attachBtn").innerHTML = DB.icon("upload");
    $("sbSearchIc").innerHTML = DB.icon("search");
    $("webSearchToggle").innerHTML = DB.icon("globe") + "<span>Recon Search<" + "/span>";
    $("sendBtn").innerHTML = DB.icon("send") + "<span>Transmit<" + "/span>";

    document.querySelectorAll("[data-hud-pick]").forEach(btn => {
      btn.onclick = () => {
        const theme = btn.dataset.hudPick;
        $("chatPanel").dataset.hudTheme = theme;
        document.body.dataset.hudTheme = theme;
        document.querySelectorAll("[data-hud-pick]").forEach(b => b.classList.toggle("active", b === btn));
        try { localStorage.setItem(HUD_THEME_KEY, theme); } catch {}
      };
    });

    document.querySelectorAll("[data-qd]").forEach(chip => {
      chip.onclick = () => {
        const inp = $("userInput");
        const prefix = chip.dataset.qd || "";
        if (!inp.value.startsWith(prefix)) {
          inp.value = prefix + inp.value;
        }
        inp.focus();
        inp.dispatchEvent(new Event("input"));
      };
    });

    const mainEl = document.querySelector("main");
    if (mainEl) {
      mainEl.addEventListener("click", e => {
        if (!DB.isGuest()) return;
        const interactive = e.target.closest("button, a, input, select, textarea");
        if (interactive) {
          e.preventDefault();
          e.stopPropagation();
          DB.requireAuth();
        }
      }, true);
      mainEl.addEventListener("focusin", e => {
        if (!DB.isGuest()) return;
        const inp = e.target.closest("input, textarea, select");
        if (inp) {
          inp.blur();
          DB.requireAuth();
        }
      }, true);
    }

    const toggleSidebar = () => {
      $("chatPanel").classList.toggle("sidebar-collapsed");
    };
    $("toggleSidebarBtn").onclick = toggleSidebar;
    $("sidebarBackdrop").onclick = toggleSidebar;

    $("chatFilterInput").oninput = e => {
      filterQuery = e.target.value.trim().toLowerCase();
      renderChatList();
    };

    function getMasterApiKey() {
      if (DB.getPicoKey) return DB.getPicoKey();
      return Promise.resolve(null);
    }

    function saveChats() {
      const cleaned = DB.sanitizePicoChats ? DB.sanitizePicoChats(chats) : chats;
      DB.set(CHATS_KEY, cleaned);
    }

    function getActiveChat() {
      return chats.find(c => c.id === activeChatId) || null;
    }

    function relTime(ts) {
      if (!ts) return "NOW";
      const diff = Math.max(0, Date.now() - ts);
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return "NOW";
      if (mins < 60) return mins + "M AGO";
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + "H AGO";
      return new Date(ts).toLocaleDateString([], { month: "short", day: "numeric" });
    }

    $("webSearchToggle").onclick = () => {
      webSearchEnabled = !webSearchEnabled;
      $("webSearchToggle").classList.toggle("active", webSearchEnabled);
      $("webSearchToggle").setAttribute("aria-pressed", webSearchEnabled);
      DB.toast(webSearchEnabled ? "Recon Web Search Enabled" : "Recon Web Search Disabled", "", 2000);
    };

    function compressImageDataUrl(dataUrl) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 260;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          try { resolve(cv.toDataURL("image/jpeg", 0.72)); }
          catch { resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      });
    }

    $("attachBtn").onclick = () => $("fileInput").click();
    $("fileInput").onchange = e => {
      const files = [...e.target.files];
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = async () => {
          const resultStr = String(reader.result || "");
          const base64Data = resultStr.includes(",") ? resultStr.split(",")[1] : btoa(unescape(encodeURIComponent(resultStr)));
          let previewUrl = null;
          if (file.type.startsWith("image/")) {
            previewUrl = await compressImageDataUrl(resultStr);
          }
          currentAttachments.push({
            name: file.name,
            mimeType: file.type || "text/plain",
            data: base64Data,
            preview: previewUrl
          });
          renderAttachments();
        };
        reader.readAsDataURL(file);
      });
      $("fileInput").value = "";
    };

    function renderAttachments() {
      const prev = $("attachPreview");
      prev.innerHTML = currentAttachments.map((att, i) => `
        <div class="att-chip">
          ${att.preview ? `<img src="${att.preview}" alt="">` : DB.icon("note")}
          <span>${DB.esc(att.name)}<" + "/span>
          <button type="button" data-rm="${i}" aria-label="Remove attachment">×<" + "/button>
        <" + "/div>
      `).join("");
      prev.querySelectorAll("button[data-rm]").forEach(btn => {
        btn.onclick = () => {
          currentAttachments.splice(+btn.dataset.rm, 1);
          renderAttachments();
        };
      });
    }

    function promptRenameChat(chat) {
      if (!chat) return;
      const node = document.createElement("div");
      node.innerHTML = `
        <h2>Rename Operation Log<" + "/h2>
        <div class="field">
          <label for="rnInput">Operation Callsign<" + "/label>
          <input id="rnInput" maxlength="60" value="${DB.esc(chat.title || "New Conversation")}" style="width:100%">
        <" + "/div>
        <div class="actions">
          <button type="button" class="ghost" id="rnCancel">Cancel<" + "/button>
          <button type="button" class="primary" id="rnSave">Save<" + "/button>
        <" + "/div>`;
      const close = DB.modal(node);
      const inp = node.querySelector("#rnInput");
      const commit = () => {
        const v = inp.value.trim();
        if (v) {
          chat.title = v;
          chat.updated = Date.now();
          saveChats();
          renderChatList();
          $("activeChatTitle").textContent = chat.title;
        }
        close();
      };
      node.querySelector("#rnCancel").onclick = close;
      node.querySelector("#rnSave").onclick = commit;
      inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); commit(); } };
    }

    $("activeChatTitle").onclick = () => {
      const c = getActiveChat();
      if (c) promptRenameChat(c);
    };

    function renderChatList() {
      const list = $("chatList");
      const countTag = $("sbLogCountTag");
      if (countTag) countTag.textContent = `${chats.length} LOG${chats.length === 1 ? "" : "S"}`;

      const filtered = filterQuery
        ? chats.filter(c => (c.title || "").toLowerCase().includes(filterQuery) || (c.messages || []).some(m => (m.text || "").toLowerCase().includes(filterQuery)))
        : chats;

      if (!filtered.length) {
        list.innerHTML = `<div class="muted" style="padding:1.2rem .5rem;text-align:center;font-family:var(--mono-font);font-size:.74rem">${filterQuery ? "// NO MATCHING LOGS" : "// NO ACTIVE LOGS"}<` + `/div>`;
        return;
      }

      list.innerHTML = filtered.map((c, idx) => {
        const count = (c.messages || []).filter(m => m.text).length;
        const logCode = "LOG-" + String(idx + 1).padStart(2, "0");
        return `
        <div class="chat-row ${c.id === activeChatId ? "active" : ""}">
          <button type="button" class="chat-item" data-id="${DB.esc(c.id)}">
            <span class="title">${DB.esc(c.title || "New Conversation")}<` + `/span>
            <span class="meta"><span class="log-code">${logCode}<` + `/span><span>•<` + `/span><span>${relTime(c.updated)}<` + `/span><span>•<` + `/span><span>${count} MSG${count === 1 ? "" : "S"}<` + `/span><` + `/span>
          <` + `/button>
          <div class="chat-row-actions">
            <button type="button" class="chat-act" data-rn="${DB.esc(c.id)}" title="Rename log" aria-label="Rename chat">${DB.icon("edit")}<` + `/button>
            <button type="button" class="chat-act del" data-del="${DB.esc(c.id)}" title="Purge log" aria-label="Delete chat">${DB.icon("trash")}<` + `/button>
          <` + `/div>
        <` + `/div>`;
      }).join("");

      list.querySelectorAll(".chat-item").forEach(btn => {
        btn.onclick = () => {
          activeChatId = btn.dataset.id;
          renderChatList();
          renderMessages();
          if (matchMedia("(max-width: 760px)").matches) {
            $("chatPanel").classList.add("sidebar-collapsed");
          }
        };
      });

      list.querySelectorAll("button[data-rn]").forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          const c = chats.find(x => x.id === btn.dataset.rn);
          if (c) promptRenameChat(c);
        };
      });

      list.querySelectorAll("button[data-del]").forEach(btn => {
        btn.onclick = async e => {
          e.stopPropagation();
          if (DB.isGuest() && !(await DB.requireAuth())) return;
          const id = btn.dataset.del;
          chats = chats.filter(c => c.id !== id);
          if (activeChatId === id) {
            activeChatId = chats[0]?.id || null;
          }
          saveChats();
          renderChatList();
          renderMessages();
          DB.toast("Operation log purged", "", 2000);
        };
      });
    }

    async function createNewChat(requireLogin = false) {
      if (requireLogin && DB.isGuest() && !(await DB.requireAuth())) return;
      const active = getActiveChat();
      if (active && (!active.messages || active.messages.length === 0)) {
        renderChatList();
        renderMessages();
        return;
      }
      const newChat = {
        id: DB.uid(),
        title: "New Conversation",
        updated: Date.now(),
        messages: []
      };
      chats.unshift(newChat);
      activeChatId = newChat.id;
      if (!DB.isGuest()) saveChats();
      renderChatList();
      renderMessages();
      if (matchMedia("(max-width: 760px)").matches) {
        $("chatPanel").classList.add("sidebar-collapsed");
      }
    }
    $("newChatBtn").onclick = () => createNewChat(true);
    $("topNewChatBtn").onclick = () => createNewChat(true);

    function formatMarkdown(text) {
      if (DB.formatPicoMD) return DB.formatPicoMD(text);
      return DB.esc(text || "").replace(/\n/g, "<br>");
    }

    function renderMessages() {
      const chat = getActiveChat();
      const container = $("chatMessages");

      $("activeChatTitle").textContent = chat ? (chat.title || "New Conversation") : "PICO";

      if (!chat || !chat.messages || !chat.messages.length) {
        container.innerHTML = `
          <div class="welcome-screen">
            <div class="pico-hero-wrap">
              <div class="pico-hero-glow"><` + `/div>
              <div class="val-reticle-ring"><` + `/div>
              <div class="pico-hero-icon">${PICO_SVG}<` + `/div>
            <` + `/div>
            <div class="val-welcome-kicker">// AGENT PICO · COMMS ONLINE<` + `/div>
            <h2>PROTOCOL 23 // <span>AGENT PICO<` + `/span><` + `/h2>
            <p>[SYS-MSG] Tactical neural link established. Select a mission directive below or transmit a custom command in the comms terminal.<` + `/p>
            <div class="prompt-pills">
              <button type="button" class="prompt-pill" data-prompt="Debug a C pointer function or explain how stack vs heap memory works with a diagram">
                <div class="pp-head">
                  <span class="pp-tag">// DIR-01 · CODE &amp; SYSTEMS<` + `/span>
                  <span class="pp-arrow">[TRANSMIT →]<` + `/span>
                <` + `/div>
                <span class="pp-txt">Trace C pointers &amp; memory stack frames<` + `/span>
              <` + `/button>
              <button type="button" class="prompt-pill" data-prompt="Write a short, suspenseful cyberpunk mystery story set in a rainy neon-lit city">
                <div class="pp-head">
                  <span class="pp-tag">// DIR-02 · CREATIVE LORE<` + `/span>
                  <span class="pp-arrow">[TRANSMIT →]<` + `/span>
                <` + `/div>
                <span class="pp-txt">Generate a neon-noir cyberpunk mystery<` + `/span>
              <` + `/button>
              <button type="button" class="prompt-pill" data-prompt="Give me 5 tactical deep-work focus strategies for university engineering study sessions">
                <div class="pp-head">
                  <span class="pp-tag">// DIR-03 · PERFORMANCE<` + `/span>
                  <span class="pp-arrow">[TRANSMIT →]<` + `/span>
                <` + `/div>
                <span class="pp-txt">5 tactical deep-work focus strategies<` + `/span>
              <` + `/button>
              <button type="button" class="prompt-pill" data-prompt="Explain how Three.js vehicle physics and tyre grip telemetry can be modeled in JavaScript">
                <div class="pp-head">
                  <span class="pp-tag">// DIR-04 · 3D &amp; WEB DEV<` + `/span>
                  <span class="pp-arrow">[TRANSMIT →]<` + `/span>
                <` + `/div>
                <span class="pp-txt">Model 3D racing physics in Three.js<` + `/span>
              <` + `/button>
            <` + `/div>
          <` + `/div>`;

        container.querySelectorAll(".prompt-pill").forEach(btn => {
          btn.onclick = () => {
            $("userInput").value = btn.dataset.prompt;
            sendMessage();
          };
        });
        return;
      }

      container.innerHTML = chat.messages.map((m, idx) => {
        const isUser = m.role === "user";
        const senderLbl = isUser ? "YOU" : "AGENT PICO";
        const seqLbl = "#" + String(idx + 1).padStart(2, "0");

        return `
        <div class="msg ${m.role}">
          <div class="msg-avatar">${isUser ? DB.icon("user") : PICO_SVG}<` + `/div>
          <div class="msg-col">
            <div class="val-msg-header">
              <span class="val-sender-name">${DB.esc(senderLbl)}<` + `/span>
              <span class="val-msg-idx">${seqLbl}<` + `/span>
            <` + `/div>
            <div class="msg-bubble">${m.text === "" && m.role === "assistant"
              ? `<div class="thinking-box"><span class="val-radar-wave"><i><` + `/i><i><` + `/i><i><` + `/i><i><` + `/i><` + `/span><div class="thinking-status" id="thinkingStatus">DECRYPTING NEURAL STREAM...<` + `/div><` + `/div>`
              : formatMarkdown(m.text)}
              ${m.attachments && m.attachments.length ? m.attachments.map(a => a.preview ? `<img src="${a.preview}" alt="${DB.esc(a.name)}">` : `<div class="chip" style="margin-top:.4rem">📄 ${DB.esc(a.name)}<` + `/div>`).join("") : ""}
            <` + `/div>
            ${m.sources && m.sources.length ? `<div class="search-sources"><span>// RECON SOURCES:<` + `/span>${m.sources.map(s => `<a href="${DB.esc(s.uri)}" target="_blank" rel="noopener" class="search-source-pill">${DB.icon("globe")}<span>${DB.esc(s.title || s.uri)}<` + `/span><` + `/a>`).join("")}<` + `/div>` : ""}
            ${m.role === "assistant" && m.text ? `<div class="msg-meta-bar">
              ${(m.error || String(m.text).startsWith("⚠️")) ? `<button type="button" class="msg-copy-btn" data-retry="${idx}" style="color:var(--val-primary);border-color:color-mix(in srgb,var(--val-primary) 45%,var(--line));background:color-mix(in srgb,var(--val-primary) 14%,var(--val-bg-elevated));">${DB.icon("refresh")}<span>Re-Transmit<` + `/span><` + `/button>` : ""}
              <button type="button" class="msg-copy-btn" data-copy="${idx}">${DB.icon("note")}<span>Copy Log<` + `/span><` + `/button>
            <` + `/div>` : ""}
          <` + `/div>
        <` + `/div>
      `;
      }).join("");

      container.querySelectorAll("button[data-copy]").forEach(btn => {
        btn.onclick = () => {
          const msg = chat.messages[+btn.dataset.copy];
          if (msg && msg.text) {
            navigator.clipboard && navigator.clipboard.writeText(msg.text);
            DB.toast("Transmission copied", "", 1800);
          }
        };
      });

      container.querySelectorAll("button[data-retry]").forEach(btn => {
        btn.onclick = () => {
          if (isStreaming) return;
          const errIdx = +btn.dataset.retry;
          let retryText = "";
          let retryAtts = [];
          for (let i = errIdx - 1; i >= 0; i--) {
            if (chat.messages[i] && chat.messages[i].role === "user") {
              retryText = chat.messages[i].text || "";
              retryAtts = (chat.messages[i].attachments || []).slice();
              chat.messages.splice(i, errIdx - i + 1);
              break;
            }
          }
          if (!retryText && !retryAtts.length && chat.messages[errIdx]) {
            chat.messages.splice(errIdx, 1);
          }
          saveChats();
          if (retryText || retryAtts.length) {
            $("userInput").value = retryText;
            currentAttachments = retryAtts;
            renderAttachments();
            sendMessage();
          } else {
            renderMessages();
          }
        };
      });

      container.scrollTop = container.scrollHeight;
    }

    function updateChatTitleFromContext(chat, prompt) {
      if (chat.title !== "New Conversation") return;
      let clean = (prompt || "").replace(/^(\/[a-z]+\s+|how to do|how do i|what is|can you|please|explain|write a)\s*/i, "").trim();
      if (clean.length > 28) clean = clean.slice(0, 28) + "…";
      if (clean) {
        chat.title = clean.charAt(0).toUpperCase() + clean.slice(1);
      }
    }

    async function sendMessage() {
      if (isStreaming) return;
      const textInput = $("userInput");
      const text = textInput.value.trim();
      if (!text && !currentAttachments.length) return;

      if (DB.isGuest() && !(await DB.requireAuth())) return;

      const apiKey = await getMasterApiKey();
      if (!apiKey) {
        DB.toast("Error Occured", "API Key error, please try again later.", 5000);
        return;
      }

      if (!activeChatId || !getActiveChat()) {
        await createNewChat(false);
      }

      isStreaming = true;
      const hudStatus = $("sbHudStatus");
      if (hudStatus) hudStatus.textContent = "STATUS // STREAMING";

      const chat = getActiveChat();
      updateChatTitleFromContext(chat, text || (currentAttachments[0]?.name || "Attachment"));

      const sentAttachments = currentAttachments.map(a => ({ ...a }));
      const userMsg = {
        role: "user",
        text: text,
        attachments: sentAttachments.map(a => ({
          name: a.name,
          mimeType: a.mimeType,
          preview: a.preview
        }))
      };

      chat.messages.push(userMsg);
      chat.updated = Date.now();
      chats.sort((a, b) => (b.updated || 0) - (a.updated || 0));

      textInput.value = "";
      textInput.style.height = "auto";
      const charEl = $("valCharCounter");
      if (charEl) charEl.textContent = "0 CHARS // TRANSMITTING";
      currentAttachments = [];
      renderAttachments();
      saveChats();
      renderChatList();

      const assistantMsg = { role: "assistant", text: "" };
      chat.messages.push(assistantMsg);
      renderMessages();

      let phraseIdx = 0;
      const thinkingInterval = setInterval(() => {
        phraseIdx = (phraseIdx + 1) % THINKING_PHRASES.length;
        const statusEl = document.getElementById("thinkingStatus");
        if (statusEl) statusEl.textContent = THINKING_PHRASES[phraseIdx];
      }, 1400);

      const container = $("chatMessages");
      const lastBubble = container.lastElementChild ? container.lastElementChild.querySelector(".msg-bubble") : null;

      const historyMsgs = chat.messages.slice(0, -1);
      const contents = historyMsgs.map((m, idx) => {
        const parts = [{ text: m.text || "" }];
        const atts = (idx === historyMsgs.length - 1) ? sentAttachments : (m.attachments || []);
        atts.forEach(att => {
          if (att.data) {
            parts.push({
              inlineData: {
                mimeType: att.mimeType,
                data: att.data
              }
            });
          }
        });
        return {
          role: m.role === "assistant" ? "model" : "user",
          parts
        };
      });

      const payload = {
        systemInstruction: {
          parts: [{ text: PICO_SYS_PROMPT }]
        },
        contents
      };

      if (webSearchEnabled) {
        payload.tools = [{ googleSearch: {} }];
      }

      let success = false;
      let attempts = 0;

      while (!success && attempts < FREE_MODELS.length) {
        const modelToUse = FREE_MODELS[attempts];
        $("activeChatModelInfo").textContent = `NEURAL CORE // ${modelToUse.toUpperCase()}`;

        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelToUse}:streamGenerateContent?alt=sse&key=${encodeURIComponent(apiKey)}`;
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errJson = await response.json().catch(() => ({}));
            let errMsg = errJson.error?.message || `API Error: ${response.status}`;
            if (response.status === 503) {
              errMsg = `Model ${modelToUse} is overloaded (503). Trying fallback model...`;
            }
            throw new Error(errMsg);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let firstChunkReceived = false;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const jsonStr = line.slice(6).trim();
              if (jsonStr === "[DONE]") continue;
              try {
                const data = JSON.parse(jsonStr);
                const chunkText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                if (chunkText) {
                  if (!firstChunkReceived) {
                    clearInterval(thinkingInterval);
                    firstChunkReceived = true;
                  }
                  assistantMsg.text += chunkText;
                  if (lastBubble) lastBubble.innerHTML = formatMarkdown(assistantMsg.text);
                  container.scrollTop = container.scrollHeight;
                }

                const grounding = data.candidates?.[0]?.groundingMetadata;
                if (grounding && grounding.groundingChunks) {
                  const sources = grounding.groundingChunks
                    .filter(c => c.web)
                    .map(c => ({ title: c.web.title, uri: c.web.uri }));
                  if (sources.length) assistantMsg.sources = sources;
                }
              } catch {}
            }
          }
          clearInterval(thinkingInterval);
          success = true;
          chat.updated = Date.now();
          saveChats();
          renderChatList();
          renderMessages();
        } catch (err) {
          attempts++;
          if (attempts >= FREE_MODELS.length) {
            clearInterval(thinkingInterval);
            assistantMsg.error = true;
            assistantMsg.text = "⚠️ Unable to complete request (" + err.message + ").";
            if (lastBubble) lastBubble.innerHTML = formatMarkdown(assistantMsg.text);
            saveChats();
            renderMessages();
          } else {
            await new Promise(r => setTimeout(r, 700));
          }
        }
      }
      isStreaming = false;
      if (hudStatus) hudStatus.textContent = "STATUS // READY";
      if (charEl) charEl.textContent = "0 CHARS // READY";
    }

    $("sendBtn").onclick = sendMessage;
    $("userInput").onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };
    $("userInput").oninput = function () {
      this.style.height = "auto";
      this.style.height = Math.min(120, this.scrollHeight) + "px";
      const charEl = $("valCharCounter");
      if (charEl) {
        const len = this.value.length;
        charEl.textContent = `${len} CHAR${len === 1 ? "" : "S"} // ${len > 0 ? "LOCKED" : "READY"}`;
      }
    };

    const syncFromCloud = () => {
      if (isStreaming) return;
      const latest = (DB.get(CHATS_KEY, []) || []).slice();
      if (latest.length) {
        chats = latest;
        if (!activeChatId || !chats.some(c => c.id === activeChatId)) {
          activeChatId = chats[0].id;
        }
        renderChatList();
        renderMessages();
      }
    };

    DB.onLogin(syncFromCloud);
    document.addEventListener("p23pico", syncFromCloud);

    if (!chats.length) {
      await createNewChat(false);
    } else {
      renderChatList();
      renderMessages();
    }
  });
</script>
</body>
</html>
