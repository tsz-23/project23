<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily News | Project 23</title>
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project 23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;600&family=Fredoka:wght@500&family=Playfair+Display:wght@600&family=Caveat:wght@600&family=Space+Mono&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/site-config.js"></script>
<script src="js/core.js"></script>
<style>
  .news-banner {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    margin: .35rem 0 1.15rem;
    min-height: 196px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 1.45rem 1.55rem;
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(0,0,0,.18);
    background: #09061c;
    isolation: isolate;
    animation: rise .5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .news-banner-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 38%;
    z-index: -2;
    opacity: .88;
    transition: transform .6s cubic-bezier(.2,1,.3,1);
  }
  .news-banner:hover .news-banner-img {
    transform: scale(1.025);
  }
  .news-banner::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(5,3,15,.18) 0%, rgba(5,3,15,.76) 70%, rgba(5,3,15,.94) 100%);
  }
  .news-banner-copy {
    max-width: 38rem;
    color: #f3eeff;
  }
  .news-banner-copy h1 {
    background: linear-gradient(90deg, #ffffff, #d7bfff, #7ce8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
    font-size: clamp(2rem, 5vw, 2.95rem);
    letter-spacing: -0.025em;
  }
  .news-banner-copy p {
    margin: .3rem 0 0;
    color: rgba(243,238,255,.86);
    font-size: .96rem;
    letter-spacing: -0.01em;
  }

  .news-top-icons {
    position: absolute;
    top: .95rem;
    right: 1rem;
    display: flex;
    align-items: center;
    gap: .5rem;
    z-index: 3;
  }
  .news-top-icons .iconbtn {
    width: 2.75rem;
    height: 2.75rem;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    background: rgba(15, 10, 38, .75);
    border: 1px solid rgba(255, 255, 255, .22);
    color: #f3eeff;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform .18s cubic-bezier(0.2, 0.9, 0.3, 1), background .2s, border-color .2s;
  }
  .news-top-icons .iconbtn:hover {
    border-color: var(--accent3);
    background: rgba(26, 16, 62, .92);
    transform: translateY(-1px);
  }
  .news-top-icons .iconbtn:active {
    transform: scale(0.96);
  }
  .news-top-icons .iconbtn.spinning svg {
    animation: spin360 .75s linear infinite;
  }

  .news-controls {
    padding: .9rem 1.05rem .8rem;
    margin-bottom: 1.05rem;
    border-radius: var(--r);
  }
  .search-deck {
    display: flex;
    gap: .6rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    position: relative;
    flex: 1 1 220px;
    min-width: 0;
    display: flex;
    align-items: center;
  }
  .search-box .s-ic {
    position: absolute;
    left: .85rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .search-box input {
    width: 100%;
    height: 42px;
    padding: 0 2.6rem 0 2.45rem;
    border-radius: 12px;
    font-size: .95rem;
    background: var(--card-2);
    border: 1px solid var(--line);
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box input[type="search"]::-webkit-search-decoration,
  .search-box input[type="search"]::-webkit-search-cancel-button,
  .search-box input[type="search"]::-webkit-search-results-button,
  .search-box input[type="search"]::-webkit-search-results-decoration {
    -webkit-appearance: none;
    appearance: none;
    display: none;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent);
  }
  .search-box .kbd-hint {
    position: absolute;
    right: .7rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: .72rem;
    padding: .12rem .42rem;
    border-radius: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    pointer-events: none;
    font-family: var(--body);
    font-weight: 600;
    line-height: 1.1;
  }
  .search-box .clear-btn {
    position: absolute;
    right: .45rem;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    min-width: 28px;
    min-height: 28px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
  }
  .search-box .clear-btn[hidden] {
    display: none !important;
  }
  .search-box .clear-btn svg {
    width: 14px;
    height: 14px;
    stroke-width: 2.3;
  }
  .search-box .clear-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--card-2);
    transform: translateY(-50%);
  }
  .search-box .clear-btn:active {
    transform: translateY(-50%) scale(0.92);
  }

  .cat-strip-wrapper {
    position: relative;
    margin-top: .65rem;
    padding-top: .65rem;
    border-top: 1px solid var(--line);
  }
  .cat-strip {
    display: flex;
    gap: .45rem;
    overflow-x: auto;
    overflow-y: hidden;
    padding: .15rem .1rem .2rem;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
  }
  .cat-strip::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }
  .cat-pill {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: .42rem;
    padding: .44rem .92rem;
    min-height: 38px;
    border-radius: 999px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: .86rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.01em;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .18s cubic-bezier(0.2, 0.9, 0.3, 1), background .2s, color .2s, border-color .2s, box-shadow .2s;
  }
  .cat-pill:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .cat-pill:active {
    transform: scale(0.97);
  }
  .cat-pill[aria-pressed="true"] {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: var(--on-accent);
    border-color: transparent;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .cat-pill .cnt {
    font-size: .72rem;
    padding: .05rem .44rem;
    border-radius: 999px;
    background: rgba(0,0,0,.18);
    color: inherit;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  [data-theme="light"] .cat-pill:not([aria-pressed="true"]) .cnt {
    background: rgba(0,0,0,.08);
  }

  .news-meta-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .6rem;
    flex-wrap: wrap;
    margin: 0 0 .85rem;
    font-size: .88rem;
    color: var(--muted);
  }
  .view-switch {
    display: inline-flex;
    gap: .2rem;
    padding: .2rem;
    border-radius: 12px;
    background: var(--card-2);
    border: 1px solid var(--line);
  }
  .view-switch button {
    padding: .32rem .7rem;
    border-radius: 9px;
    border: 0;
    background: transparent;
    font-size: .8rem;
    font-weight: 600;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    transition: color .2s, background .2s;
  }
  .view-switch button:hover {
    transform: none;
    color: var(--text);
  }
  .view-switch button[aria-pressed="true"] {
    background: var(--card-solid);
    color: var(--accent);
    box-shadow: var(--shadow);
  }

  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1.15rem;
  }
  .news-grid.compact {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: .9rem;
  }
  .news-card {
    position: relative;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    background: var(--card);
    border: 1.5px solid var(--line);
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .24s cubic-bezier(.2, .9, .3, 1), border-color .22s, box-shadow .22s;
    animation: rise .45s both;
    animation-delay: calc(var(--k, 0) * 30ms);
  }
  .news-card:hover {
    transform: translateY(-3px) scale(1.004);
    border-color: var(--accent);
    box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent) 75%, transparent), 0 12px 30px rgba(0,0,0,.24);
  }
  .news-card:active {
    transform: scale(0.99);
  }
  .news-card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }
  .news-card.featured {
    grid-column: span 2;
    display: grid;
    grid-template-columns: 1.12fr 1.2fr;
  }
  .news-grid.compact .news-card.featured {
    grid-column: span 1;
    display: flex;
  }

  .nc-art {
    position: relative;
    height: 184px;
    min-height: 184px;
    background: linear-gradient(135deg, #1a1040, #3b5bdb);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: .85rem 1rem;
    overflow: hidden;
  }
  .news-card.featured .nc-art {
    height: 100%;
    min-height: 260px;
  }
  .news-grid.compact .nc-art {
    display: none;
  }
  .nc-art img.art-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .45s cubic-bezier(.2,1.1,.3,1);
  }
  .nc-art::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,6,22,.08) 0%, rgba(8,6,22,.68) 100%);
    pointer-events: none;
  }
  .news-card:hover .nc-art img.art-bg {
    transform: scale(1.05);
  }
  .nc-badges {
    position: relative;
    z-index: 2;
    display: flex;
    gap: .4rem;
    flex-wrap: wrap;
    width: 100%;
    justify-content: space-between;
    align-items: center;
  }
  .nc-cat {
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    font-size: .73rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: .24rem .64rem;
    border-radius: 999px;
    background: rgba(10, 8, 26, .78);
    color: #fff;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.2);
  }
  .nc-region {
    font-size: .72rem;
    font-weight: 600;
    padding: .2rem .55rem;
    border-radius: 999px;
    background: rgba(10, 8, 26, .62);
    color: #fff;
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .nc-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 1.05rem 1.2rem 1rem;
    min-width: 0;
  }
  .nc-meta {
    display: flex;
    align-items: center;
    gap: .42rem;
    font-size: .79rem;
    color: var(--muted);
    margin-bottom: .45rem;
    flex-wrap: nowrap;
    white-space: nowrap;
    overflow: hidden;
  }
  .nc-source {
    font-weight: 700;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: .3rem;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 11.5rem;
  }
  .nc-source i {
    flex: none;
    width: .45rem;
    height: .45rem;
    border-radius: 50%;
    background: var(--c, var(--accent));
    display: inline-block;
  }
  .nc-title {
    font-family: var(--display);
    font-size: 1.13rem;
    font-weight: 700;
    line-height: 1.28;
    margin: 0 0 .5rem;
    color: var(--text);
    letter-spacing: -0.015em;
    transition: color .2s;
    display: -webkit-box;
    line-clamp: 3;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card.featured .nc-title {
    font-size: clamp(1.32rem, 2.4vw, 1.66rem);
    line-clamp: 4;
    -webkit-line-clamp: 4;
  }
  .news-card:hover .nc-title {
    color: var(--accent);
  }
  .nc-desc {
    margin: 0 0 .9rem;
    color: var(--muted);
    font-size: .9rem;
    line-height: 1.48;
    letter-spacing: -0.005em;
    max-height: 7.4em;
    overflow: hidden;
  }

  .nc-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    margin-top: auto;
    padding-top: .75rem;
    border-top: 1px solid var(--line);
  }
  .nc-tags {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: .32rem;
    height: 3.42rem;
    max-height: 3.42rem;
    overflow: hidden;
    min-width: 0;
  }
  .nc-tag-row {
    display: flex;
    align-items: center;
    gap: .35rem;
    min-width: 0;
  }
  .nc-tag {
    flex: 0 1 auto;
    width: fit-content;
    height: 1.55rem;
    font-size: .72rem;
    padding: 0 .56rem;
    border-radius: 999px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 8.6rem;
    display: inline-flex;
    align-items: center;
    transition: border-color .2s, color .2s;
  }
  .nc-tag:hover {
    border-color: var(--accent);
    color: var(--text);
    transform: none;
  }
  .nc-actions {
    display: flex;
    align-items: center;
    gap: .25rem;
    flex: none;
  }
  .nc-icon-btn, .nc-ext-link {
    width: 2.35rem;
    height: 2.35rem;
    min-width: 38px;
    min-height: 38px;
    padding: 0;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    text-decoration: none;
    transition: background .2s, color .2s, border-color .2s;
  }
  .nc-icon-btn:hover, .nc-ext-link:hover {
    background: var(--card-2);
    border-color: var(--line);
    color: var(--text);
    transform: none;
  }
  .nc-icon-btn.saved {
    color: var(--accent2);
  }
  .nc-icon-btn.saved svg {
    fill: currentColor;
  }
  .nc-ext-link:hover {
    color: var(--accent);
  }

  .news-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3.5rem 1.5rem;
    border-radius: 20px;
    background: var(--card);
    border: 2px dashed var(--line);
    color: var(--muted);
  }

  .reader-modal {
    position: relative;
  }
  .reader-grabber {
    width: 36px;
    height: 4.5px;
    border-radius: 99px;
    background: var(--line);
    margin: 0 auto .65rem;
  }
  .reader-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .6rem;
    margin-bottom: .75rem;
  }
  .reader-head-meta {
    display: flex;
    align-items: center;
    gap: .45rem;
    flex-wrap: wrap;
    font-size: .82rem;
    color: var(--muted);
    min-width: 0;
  }
  .reader-close-btn {
    flex: none;
    width: 34px;
    height: 34px;
    min-width: 34px;
    min-height: 34px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card-2);
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
  }
  .reader-close-btn svg {
    width: 16px;
    height: 16px;
    stroke-width: 2.3;
  }
  .reader-close-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--line);
    transform: none;
  }
  .reader-banner {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: .95rem;
    border: 1px solid var(--line);
    display: block;
  }
  .reader-takeaways {
    margin: 1rem 0;
    padding: .9rem 1.1rem;
    border-radius: 14px;
    background: var(--card-2);
    border-left: 4px solid var(--accent);
  }
  .reader-takeaways h4 {
    margin: 0 0 .45rem;
    font-size: .82rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--accent);
  }
  .reader-takeaways ul {
    margin: 0;
    padding-left: 1.15rem;
    font-size: .92rem;
    line-height: 1.5;
  }
  .reader-takeaways li {
    margin-bottom: .3rem;
  }
  .reader-body p {
    font-size: .96rem;
    line-height: 1.62;
    margin: 0 0 .9rem;
    color: var(--text);
  }

  @media (max-width: 920px) {
    .news-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .news-card.featured {
      grid-column: span 2;
      grid-template-columns: 1fr;
    }
    .news-card.featured .nc-art {
      height: 210px;
      min-height: 210px;
    }
  }
  @media (max-width: 620px) {
    .news-banner {
      padding: 1.15rem 1.1rem;
      min-height: 148px;
      margin: .2rem 0 .85rem;
      border-radius: 18px;
    }
    .news-banner-copy {
      padding-right: 3rem;
    }
    .news-banner-copy h1 {
      font-size: 1.85rem;
    }
    .news-banner-copy p {
      font-size: .88rem;
      line-height: 1.35;
    }
    .news-top-icons {
      top: .8rem;
      right: .8rem;
    }
    .news-top-icons .iconbtn {
      width: 2.4rem;
      height: 2.4rem;
      min-width: 38px;
      min-height: 38px;
    }
    .news-controls {
      padding: .7rem .8rem .65rem;
      margin-bottom: .85rem;
      border-radius: 16px;
    }
    .search-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .45rem;
    }
    .search-box {
      grid-column: 1 / -1;
      flex: none;
      width: 100%;
    }
    .search-box input {
      height: 40px;
      font-size: .92rem;
      padding: 0 2.4rem 0 2.3rem;
    }
    .search-box .kbd-hint {
      display: none;
    }
    .search-deck .cs {
      width: 100%;
      min-width: 0;
    }
    .cat-strip-wrapper {
      margin-top: .5rem;
      padding-top: .5rem;
    }
    .cat-pill {
      padding: .38rem .78rem;
      min-height: 34px;
      font-size: .82rem;
    }
    .news-grid, .news-grid.compact {
      grid-template-columns: 1fr;
      gap: .85rem;
    }
    .news-card.featured {

<script>
if (window.DB && typeof DB.whenReady === "function") DB.whenReady(() => {
  if (DB.isGuest()) return;
  const $ = id => document.getElementById(id);
  const CLOUD_KEY = "p23.news";

  const EXTRA_IC = {
    globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
    bookmark: '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
    external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/>',
    film: '<rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>',
    music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
    gamepad: '<rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"/>',
    x: '<path d="M18 6L6 18M6 6l12 12"/>'
  };
  const icon = (name, cls="ic") => {
    const out = DB.icon(name, cls);
    if (out.includes("></svg>") && EXTRA_IC[name]) {
      return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${EXTRA_IC[name]}</svg>`;
    }
    return out;
  };

  function ensureAuth(callback) {
    if (typeof DB.isGuest === "function" && DB.isGuest()) {
      if (typeof DB.requireAuth === "function") {
        DB.requireAuth().then(ok => {
          if (ok && typeof callback === "function") callback();
        });
      } else {
        DB.toast("Account Required", "Please sign in to view story details or access news categories.", 3500);
      }
      return false;
    }
    if (typeof callback === "function") callback();
    return true;
  }

  function cleanSummary(raw) {
    if (!raw) return "";
    let s = String(raw).replace(/<[^>]+>/g, " ").replace(/&nbsp;/gi, " ").replace(/\s+/g, " ").trim();
    const hasTrailingCutoff = /(\[\s*(?:\.{3,}|…)\s*\]|\[\s*…\s*\]|\[\s*More\s*\]|\.{3,}|…)\s*$/i.test(s);
    s = s.replace(/\s*(\[\s*(?:\.{3,}|…)\s*\]|\[\s*…\s*\]|\[\s*More\s*\]|\.{3,}|…)\s*$/gi, "").trim();
    s = s.replace(/\[\s*(?:\.{3,}|…)\s*\]/gi, "").trim();

    const DOT_TOKEN = "\u0000";
    let protectedStr = s
      .replace(/(\d)\.(\d)/g, `$1${DOT_TOKEN}$2`)
      .replace(/\b(U\.S\.|U\.K\.|E\.U\.|U\.N\.|Dr\.|Mr\.|Mrs\.|Ms\.|St\.|Jr\.|Sr\.|Prof\.|Gen\.|Rep\.|Sen\.|Gov\.|vs\.|etc\.|e\.g\.|i\.e\.|Jan\.|Feb\.|Mar\.|Apr\.|Aug\.|Sept\.|Oct\.|Nov\.|Dec\.|[A-Z]\.)/g, m => m.replace(/\./g, DOT_TOKEN));

    const matches = protectedStr.match(/[^.!?]+[.!?]+["'”’)]*/g);
    if (matches && matches.length > 0) {
      let complete = matches
        .map(m => m.replace(/\u0000/g, ".").trim())
        .filter(Boolean);
      if (hasTrailingCutoff && complete.length > 1) {
        complete.pop();
      }
      if (complete.length > 0) {
        return complete.join(" ");
      }
    }

    let cleanFrag = s.replace(/[,;:\s\-]+$/g, "").trim();
    if (cleanFrag && !/[.!?]$/.test(cleanFrag)) {
      cleanFrag += ".";
    }
    return cleanFrag;
  }

  function cardSummary(raw, maxChars = 185) {
    const cleaned = cleanSummary(raw);
    if (!cleaned) return "";
    const DOT_TOKEN = "\u0000";
    const protectedStr = cleaned
      .replace(/(\d)\.(\d)/g, `$1${DOT_TOKEN}$2`)
      .replace(/\b(U\.S\.|U\.K\.|E\.U\.|U\.N\.|Dr\.|Mr\.|Mrs\.|Ms\.|St\.|Jr\.|Sr\.|Prof\.|Gen\.|Rep\.|Sen\.|Gov\.|vs\.|etc\.|e\.g\.|i\.e\.|Jan\.|Feb\.|Mar\.|Apr\.|Aug\.|Sept\.|Oct\.|Nov\.|Dec\.|[A-Z]\.)/g, m => m.replace(/\./g, DOT_TOKEN));

    const sentences = (protectedStr.match(/[^.!?]+[.!?]+["'”’)]*/g) || [protectedStr])
      .map(s => s.replace(/\u0000/g, ".").trim())
      .filter(Boolean);

    if (!sentences.length) return cleaned;
    let out = sentences[0];
    for (let i = 1; i < sentences.length; i++) {
      if ((out + " " + sentences[i]).length <= maxChars) {
        out += " " + sentences[i];
      } else {
        break;
      }
    }
    return out;
  }

  function getFourTags(a) {
    const fallbackPool = [a.category || "world", (a.region || "global").toLowerCase().replace(/\s+/g, "-"), "dispatch", "breaking", "update"];
    const out = [];
    const seen = new Set();
    for (const rawTag of [...(a.tags || []), ...fallbackPool]) {
      const clean = String(rawTag || "").toLowerCase().replace(/^#+/, "").trim();
      if (clean && !seen.has(clean)) {
        seen.add(clean);
        out.push(clean);
      }
      if (out.length === 4) break;
    }
    return out;
  }

  const CATEGORIES = [
    { id: "all",      label: "All News",          icon: "grid",     color: "#6c5ce7" },
    { id: "world",    label: "World & Breaking",  icon: "globe",    color: "#4c8dff" },
    { id: "film",     label: "Film & Culture",    icon: "film",     color: "#ff6b6b" },
    { id: "music",    label: "Music & Arts",      icon: "music",    color: "#e64980" },
    { id: "gaming",   label: "Gaming",            icon: "gamepad",  color: "#9775fa" },
    { id: "tech",     label: "Technology & AI",   icon: "sparkle",  color: "#ff5c9d" },

  function upgradeTo1080p(url, fallbackImg) {
    if (!url || !String(url).trim()) return fallbackImg || "";
    return String(url)
      .replace(/^http:\/\/(ichef\.bbci\.co\.uk|images\.unsplash\.com)/i, "https://$1")
      .replace(/\/p0[a-z0-9]+\/(240|320)\//i, "/1024/")
      .replace(/\/(news|standard)\/(240|320|480|640|800)\//i, "/$1/1024/")
      .replace(/width=\d+/i, "width=1080")
      .replace(/height=\d+/i, "height=720");
  }

  function parseRssPubDate(raw) {
    if (!raw) return new Date().toISOString();
    const s = String(raw).trim();
    if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}$/.test(s)) {
      const d = new Date(s.replace(/\s+/, "T") + "Z");
      if (!isNaN(d.getTime())) return d.toISOString();
    }
    const d = new Date(s);
    if (!isNaN(d.getTime())) return d.toISOString();
    return new Date().toISOString();
  }

    const cloud = (typeof DB.get === "function" && DB.get(CLOUD_KEY, null)) || null;

      if (Array.isArray(cloud.savedIds)) state.savedIds = cloud.savedIds;
      if (Array.isArray(cloud.savedArticles)) state.savedArticles = cloud.savedArticles;
    }

  function saveToFirebase() {

      return;
    }
    const payload = {
      savedIds: state.savedIds,
      savedArticles: state.savedArticles
    };
    if (typeof DB.set === "function") {
      DB.set(CLOUD_KEY, payload);
    }
    if (typeof DB.flush === "function") {
      DB.flush();
    }

  function allArticles() {
    const map = new Map();
    const pool = state.activeCat === "saved"
      ? [...(state.savedArticles || []), ...(state.liveArticles || [])]
      : [...(state.liveArticles || []), ...(state.savedArticles || [])];

    pool.forEach(a => {
      if (a && a.id && !map.has(a.id)) {
        const copy = Object.assign({}, a);
        if ((!copy.image || state.failedImages[copy.id]) && state.wikiPhotos[copy.id]) {
          copy.image = state.wikiPhotos[copy.id];
        } else if (state.failedImages[copy.id]) {
          copy.image = CATEGORY_FALLBACK_IMAGES[copy.category] || "";
        }
        map.set(copy.id, copy);
      }
    });
    return [...map.values()];
  }

  async function fetchWikiPhotoForTopic(topic, category) {
    const tryTopic = async t => {
      if (!t) return null;
      try {
        const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(t));
        if (!r.ok) return null;
        const d = await r.json();
        return (d.thumbnail && d.thumbnail.source) || (d.originalimage && d.originalimage.source) || null;
      } catch {
        return null;
      }
    };
    let url = await tryTopic(topic);
    if (!url && category && CATEGORY_WIKI_FALLBACK[category] && CATEGORY_WIKI_FALLBACK[category] !== topic) {
      url = await tryTopic(CATEGORY_WIKI_FALLBACK[category]);
    }
    return url;
  }

  async function handleBannerError(imgEl) {
    if (!imgEl) return;
    const id = imgEl.dataset.artImg;
    const fb = imgEl.dataset.fallback;
    const art = allArticles().find(x => x.id === id);
    const catUnsplash = art ? CATEGORY_FALLBACK_IMAGES[art.category] : "";

    if (catUnsplash && imgEl.src !== catUnsplash && !imgEl.dataset.unsplashTried) {
      imgEl.dataset.unsplashTried = "1";
      imgEl.src = catUnsplash;
      return;
    }
    if (id && state.wikiPhotos[id] && imgEl.src !== state.wikiPhotos[id]) {
      imgEl.src = state.wikiPhotos[id];
      return;
    }
    if (fb && imgEl.src !== fb) {
      imgEl.src = fb;
    }
    if (art && !imgEl.dataset.wikiTried) {
      imgEl.dataset.wikiTried = "1";
      const u = await fetchWikiPhotoForTopic(art.wikiTopic || CATEGORY_WIKI_FALLBACK[art.category], art.category);
      if (u) {
        state.wikiPhotos[id] = u;
        persistPhotoCache();
        const currentEl = document.querySelector(`img[data-art-img="${id}"]`);
        if (currentEl) currentEl.src = u;
      }
    }
  }

  async function hydrateMissingPhotos() {
    const need = (state.liveArticles || []).filter(a => !a.image && !state.wikiPhotos[a.id]);
    if (!need.length) return;
    await Promise.allSettled(need.map(async a => {
      const imgUrl = await fetchWikiPhotoForTopic(a.wikiTopic || CATEGORY_WIKI_FALLBACK[a.category], a.category);
      if (imgUrl) {
        state.wikiPhotos[a.id] = imgUrl;
        const el = document.querySelector(`img[data-art-img="${a.id}"]`);
        if (el) el.src = imgUrl;
      }
    }));
    persistPhotoCache();
  }

  function relTime(iso) {
    const ms = new Date(iso).getTime();
    if (isNaN(ms)) return "Recent";
    const diffMins = Math.round((Date.now() - ms) / 60000);
    if (diffMins < 1) return "Just now";
    if (diffMins < 60) return diffMins + "m ago";
    const hrs = Math.round(diffMins / 60);
    if (hrs < 24) return hrs + "h ago";
    const days = Math.round(hrs / 24);
    if (days < 7) return days + "d ago";
    return new Date(ms).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
  }

  function getFiltered() {
    const q = ($("newsSearch").value || "").trim().toLowerCase();
    const cat = state.activeCat || "all";
    const reg = $("regionSelect").value || "all";
    const sort = $("sortSelect").value || "latest";

    let list = allArticles().filter(a => {
      if (cat === "saved" && !state.savedIds.includes(a.id)) return false;
      if (cat !== "all" && cat !== "saved" && a.category !== cat) return false;
      if (reg !== "all" && a.region !== reg) return false;
      if (q) {
        const hay = `${a.title} ${a.summary} ${a.source} ${a.region} ${(a.tags || []).join(" ")}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    if (sort === "latest") list.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
    else if (sort === "impact") list.sort((a, b) => (b.impact || 85) - (a.impact || 85));
    else if (sort === "quick") list.sort((a, b) => (a.readMins || 3) - (b.readMins || 3));
    else if (sort === "source") list.sort((a, b) => String(a.source).localeCompare(String(b.source)));

    return list;
  }

  function toggleSave(id, ev) {
    if (ev) ev.stopPropagation();
    ensureAuth(() => {
      const idx = state.savedIds.indexOf(id);
      const art = allArticles().find(x => x.id === id);
      if (idx >= 0) {
        state.savedIds.splice(idx, 1);
        state.savedArticles = (state.savedArticles || []).filter(x => x.id !== id);
        DB.toast("Removed from Saved", art ? art.title : "", 2800);
      } else {
        state.savedIds.unshift(id);
        if (art && !(state.savedArticles || []).some(x => x.id === id)) {
          state.savedArticles.unshift(art);
        }
        DB.toast("Saved to your account", art ? art.title : "", 2800);
      }
      saveToFirebase();
      renderCategories();
      renderGrid();
    });
  }

  function renderGrid() {

        <h3 style="margin-bottom:.3rem">${hasAnyLive && hasFilters ? "No stories match your filter" : "No live news available right now"}</h3>
        <p class="muted" style="margin:0 0 1rem">${hasAnyLive && hasFilters ? "Try clearing your search query or switching to All News." : "Live news feeds could not be reached or returned no stories."}</p>
        <button type="button" class="primary" id="emptyActionBtn">${hasAnyLive && hasFilters ? "Reset filters" : "Retry live sync"}</button>
      </div>`;
      const btn = $("emptyActionBtn");
      if (btn) btn.onclick = () => {
        if (hasAnyLive && hasFilters) {
          $("newsSearch").value = "";
          state.activeCat = "all";
          $("regionSelect").value = "all";
          if ($("regionSelect")._cs) $("regionSelect")._cs.refresh();
          renderCategories();
          renderGrid();
        } else {
          syncLiveFeeds(false);
        }
      };
      return;
    }

    grid.innerHTML = list.map((a, idx) => {
      const cm = catMeta(a.category);
      const isSaved = state.savedIds.includes(a.id);
      const isFeatured = idx === 0 && state.view === "grid" && !q && state.activeCat === "all";
      const cleanedDesc = cardSummary(a.summary, isFeatured ? 260 : 185);
      const tags4 = getFourTags(a);
      return `
        <article class="news-card${isFeatured ? " featured" : ""}" data-id="${DB.esc(a.id)}" tabindex="0" role="button" aria-label="Read briefing: ${DB.esc(a.title)}" style="--k:${Math.min(idx, 10)};--c:${cm.color}">
          <div class="nc-art">
            ${cardBannerHTML(a, idx)}
            <div class="nc-badges">
              <span class="nc-cat">${icon(cm.icon)} ${DB.esc(cm.label)}</span>
              <span class="nc-region">${DB.esc(a.region)}</span>
            </div>
          </div>
          <div class="nc-body">
            <div class="nc-meta">
              <span class="nc-source"><i></i>${DB.esc(a.source)}</span>
              <span>•</span>
              <span>${relTime(a.publishedAt)}</span>
              <span>•</span>
              <span>${a.readMins || 3} min read</span>
            </div>
            <h2 class="nc-title">${DB.esc(a.title)}</h2>
            <p class="nc-desc">${DB.esc(cleanedDesc)}</p>
            <div class="nc-foot">
              <div class="nc-tags">
                <div class="nc-tag-row">
                  ${tags4.slice(0, 2).map(t => `<button type="button" class="nc-tag" data-tag="${DB.esc(t)}">#${DB.esc(t)}</button>`).join("")}
                </div>
                <div class="nc-tag-row">
                  ${tags4.slice(2, 4).map(t => `<button type="button" class="nc-tag" data-tag="${DB.esc(t)}">#${DB.esc(t)}</button>`).join("")}
                </div>
              </div>
              <div class="nc-actions">
                <button type="button" class="nc-icon-btn${isSaved ? " saved" : ""}" data-save="${DB.esc(a.id)}" aria-label="${isSaved ? "Remove bookmark" : "Bookmark story"}" title="${isSaved ? "Saved" : "Save for later"}">
                  ${icon("bookmark")}
                </button>
                <a class="nc-ext-link" href="${DB.esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="Open original article at ${DB.esc(a.source)}" title="Open source (${DB.esc(a.source)})">
                  ${icon("external")}
                </a>
              </div>
            </div>
          </div>
        </article>
      `;
    }).join("");

    grid.querySelectorAll("img.art-bg").forEach(imgEl => {
      imgEl.onerror = () => handleBannerError(imgEl);
      if (imgEl.complete && imgEl.naturalWidth === 0) {
        handleBannerError(imgEl);
      }
    });

    grid.querySelectorAll(".news-card").forEach(card => {
      card.onclick = e => {
        if (e.target.closest("[data-save], [data-tag], .nc-ext-link")) return;
        openReader(card.dataset.id);
      };
      card.onkeydown = e => {
        if ((e.key === "Enter" || e.key === " ") && !e.target.closest("[data-save], [data-tag], .nc-ext-link")) {
          e.preventDefault();
          openReader(card.dataset.id);
        }
      };
    });

    grid.querySelectorAll("[data-save]").forEach(btn => {
      btn.onclick = e => toggleSave(btn.dataset.save, e);
    });

    grid.querySelectorAll("[data-tag]").forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        ensureAuth(() => {
          $("newsSearch").value = btn.dataset.tag;
          renderGrid();
        });
      };
    });

    grid.querySelectorAll(".nc-ext-link").forEach(link => {
      link.onclick = e => {
        e.stopPropagation();
        if (typeof DB.isGuest === "function" && DB.isGuest()) {
          e.preventDefault();
          const targetUrl = link.href;
          ensureAuth(() => {
            window.open(targetUrl, "_blank", "noopener,noreferrer");
          });
        }
      };
    });
  }

  function inferRegion(text, fallback = "Global") {
    const s = String(text || "").toLowerCase();
    if (/\b(uk|britain|british|england|london|scotland|wales|ireland|europe|eu|european|france|french|paris|germany|german|berlin|spain|spanish|madrid|italy|italian|rome|ukraine|ukrainian|kyiv|russia|russian|moscow|poland|bosnia|sweden|norway|finland|greece|portugal|switzerland|nato)\b/.test(s)) return "Europe";
    if (/\b(us|u\.s\.|united states|american|america|washington|new york|california|texas|florida|chicago|hollywood|canada|canadian|ottawa|toronto|mexico|mexican|north america)\b/.test(s)) return "North America";
    if (/\b(china|chinese|beijing|shanghai|japan|japanese|tokyo|india|indian|delhi|mumbai|australia|australian|sydney|korea|korean|seoul|taiwan|philippines|indonesia|singapore|vietnam|thailand|pakistan|bangladesh|new zealand|asia|pacific)\b/.test(s)) return "Asia-Pacific";
    if (/\b(turkey|turkish|ankara|istanbul|israel|israeli|gaza|palestine|lebanon|beirut|iran|iranian|tehran|iraq|syria|saudi|qatar|dubai|uae|yemen|red sea|hormuz|middle east|egypt|egyptian|cairo|jordan)\b/.test(s)) return "Middle East";
    return fallback;
  }

  function classifyRssItem(titleAndDesc, feedCat = "world") {
    const text = String(titleAndDesc || "").toLowerCase();

    if (feedCat === "film") {
      if (/\b(video game|gaming|playstation|xbox|nintendo|steam|esports|gamer|zelda|pokemon|gta|call of duty|minecraft|fortnite)\b/.test(text)) {
        return "gaming";
      }
      if (/\b(singer|musician|album|song|rapper|band|concert|glastonbury|grammy|symphony|orchestra|spotify|vocalist|guitarist|pop star|hip-hop|hip hop|tour|single|opera|choir|billboard)\b/.test(text)) {
        return "music";
      }
      return "film";
    }

    if (feedCat === "science") {
      if (/\b(climate|emissions|carbon|global warming|hurricane|cyclone|typhoon|flood|flooding|wildfire|heatwave|drought|glacier|sea level|renewable|solar power|wind power|deforestation|cop2|cop3|net zero|fossil fuel|weather|pollution)\b/.test(text)) {
        return "climate";
      }
      return "science";
    }

    if (feedCat === "tech") {
      if (/\b(video game|playstation|xbox|nintendo switch|esports|steam deck|gta|fortnite|minecraft|game studio)\b/.test(text)) {
        return "gaming";
      }
      return "tech";
    }

    return feedCat;
  }

  function extractTopicFromTitle(title, category) {
    const stop = new Set(["The","And","For","With","From","Into","Over","After","Before","Under","About","Amid","Against","Between","Through","During","Without","Within","Says","Said","Will","Could","Would","Should","Have","More","Most","Some","Many","What","When","Where","Which","While","Who","Why","How","New","First","Last","Report","News","Live","Update","World","Year","Years","Today","Week"]);
    const words = String(title || "").match(/\b[A-Z][a-z]{3,}\b/g) || [];
    for (const w of words) {
      if (!stop.has(w)) return w;
    }
    return CATEGORY_WIKI_FALLBACK[category] || "Earth";
  }

  function parseXmlRssItems(xmlText) {
    try {
      const doc = new DOMParser().parseFromString(xmlText, "text/xml");
      const nodes = [...doc.querySelectorAll("item, entry")];
      return nodes.map(node => {
        const getVal = tag => {
          const el = node.querySelector(tag);
          return el ? (el.textContent || "").trim() : "";
        };
        const title = getVal("title");
        let link = getVal("link");
        if (!link) {
          const linkEl = node.querySelector("link[href]");
          if (linkEl) link = linkEl.getAttribute("href") || "";
        }
        const pubDate = getVal("pubDate") || getVal("published") || getVal("updated");
        const description = getVal("description") || getVal("summary") || getVal("content");

        let thumb = "";
        const mediaThumb = node.getElementsByTagName("media:thumbnail")[0] || node.getElementsByTagName("media:content")[0] || node.querySelector("enclosure[url]");
        if (mediaThumb) {
          thumb = mediaThumb.getAttribute("url") || "";
        }
        return { title, link, pubDate, description, thumbnail: thumb, enclosure: { link: thumb } };
      }).filter(x => x.title && x.link);
    } catch {
      return [];
    }
  }

  async function fetchRssFeedItems(feedConfig) {
    let rawItems = [];
    try {
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedConfig.feed)}`);
      if (res.ok) {
        const data = await res.json();
        if (data && data.status === "ok" && Array.isArray(data.items) && data.items.length) {
          rawItems = data.items;
        }
      }
    } catch {}

    if (!rawItems.length) {
      try {
        const xmlRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(feedConfig.feed)}`);
        if (xmlRes.ok) {
          const xmlText = await xmlRes.text();
          rawItems = parseXmlRssItems(xmlText);
        }
      } catch {}
    }

    return rawItems.map((item, idx) => {
      if (!item || !item.title || !item.link) return null;
      let imageUrl = (item.enclosure && (item.enclosure.link || item.enclosure.thumbnail)) || item.thumbnail || null;
      const rawDesc = String(item.description || item.content || "");
      if (!imageUrl && rawDesc) {
        const imgMatch = rawDesc.match(/<img[^>]+src=["']([^"'>]+)["']/i);
        if (imgMatch) imageUrl = imgMatch[1];
      }
      imageUrl = upgradeTo1080p(imageUrl, feedConfig.img);

      const cleanDesc = cleanSummary(rawDesc) || cleanSummary(item.title);
      const cat = classifyRssItem(item.title + " " + cleanDesc, feedConfig.category);
      const region = inferRegion(item.title + " " + cleanDesc, "Global");
      const pubIso = parseRssPubDate(item.pubDate);
      const slug = String(item.link || item.title).replace(/[^a-zA-Z0-9]/g, "").slice(-36);

      return {
        id: `rss-${cat}-${slug || idx}`,
        title: cleanSummary(item.title).replace(/\.$/, ""),
        summary: cardSummary(cleanDesc, 195),
        body: [cleanDesc],
        takeaways: [
          `Live dispatch from ${feedConfig.source}.`,
          `Published ${new Date(pubIso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}.`
        ],
        category: cat,
        region,
        source: feedConfig.source,
        url: item.link,
        image: imageUrl,
        wikiTopic: extractTopicFromTitle(item.title, cat),
        publishedAt: pubIso,
        readMins: Math.max(2, Math.min(6, Math.round(cleanDesc.split(/\s+/).length / 40) + 2)),
        impact: Math.max(78, 97 - idx),
        tags: [cat, region.toLowerCase().replace(/\s+/g, "-"), feedConfig.source.toLowerCase().split(/\s+/)[0], "live"]
      };
    }).filter(Boolean);
  }

  async function syncLiveFeeds(silent = false) {
    const btn = $("syncFeedsBtn");
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.classList.add("spinning");

    if (!state.liveArticles.length) {
      state.isLoading = true;
      renderGrid();
    }

    let added = 0;
    const isManualRefresh = !silent;
    const seenKeys = new Set(isManualRefresh ? [] : (state.liveArticles || []).map(x => x.title.toLowerCase()));
    const freshPool = isManualRefresh ? [] : [...(state.liveArticles || [])];

    const mergeBatch = items => {
      let batchAdded = 0;
      items.forEach(item => {
        if (!item || !item.title || !item.url) return;
        const key = item.title.toLowerCase();
        if (!seenKeys.has(key)) {
          seenKeys.add(key);
          freshPool.push(item);
          added++;
          batchAdded++;
        }
      });
      if (batchAdded > 0) {
        state.liveArticles = freshPool
          .sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt))
          .slice(0, 120);
        state.isLoading = false;
        persistLiveCache();
        renderCategories();
        renderGrid();
      }
    };

    try {
      const customCats = (typeof DB.get === "function" && DB.get("p23.custom_news_cats", [])) || [];
      const extraFeeds = Array.isArray(customCats)
        ? customCats
            .filter(c => c && c.feed && !LIVE_RSS_FEEDS.some(f => f.feed === c.feed))
            .map(c => ({
              category: classifyRssItem(c.name || "", "world"),
              source: String(c.name || "Custom Wire").replace(/^[^a-zA-Z0-9]+/, "").trim() || "Custom Wire",
              feed: c.feed,
              img: c.img || CATEGORY_FALLBACK_IMAGES.world
            }))
        : [];

      const allFeedConfigs = [...LIVE_RSS_FEEDS, ...extraFeeds];

      const rssTasks = allFeedConfigs.map(async cfg => {
        const items = await fetchRssFeedItems(cfg);
        if (items.length) mergeBatch(items);
      });

      const fetchSpaceflightNews = async () => {
        const artData = await fetch("https://api.spaceflightnewsapi.net/v4/articles/?limit=10")
          .then(r => (r && r.ok) ? r.json() : null)
          .catch(() => null);
        const results = (artData && Array.isArray(artData.results)) ? artData.results : [];
        const snItems = results.map(item => {
          if (!item || !item.title || !item.url) return null;
          const fullDesc = cleanSummary(item.summary) || "Live science, aerospace, and orbital dispatch from " + (item.news_site || "Spaceflight News") + ".";
          const textForCat = item.title + " " + fullDesc;
          const cat = /\b(climate|weather|methane|hurricane|sea level|wildfire|emissions|earth observation|atmosphere)\b/i.test(textForCat)
            ? "climate"
            : "science";
          const region = inferRegion(textForCat, "Global");
          return {
            id: "live-sn-" + item.id,
            title: item.title,
            summary: cardSummary(fullDesc, 195),
            body: [fullDesc],
            takeaways: [
              "Live dispatch via Spaceflight News Open API.",
              "Publisher: " + (item.news_site || "Spaceflight News")
            ],
            category: cat,
            region,
            source: item.news_site || "Spaceflight News",
            url: item.url,
            image: upgradeTo1080p(item.image_url, CATEGORY_FALLBACK_IMAGES[cat]),
            wikiTopic: extractTopicFromTitle(item.title, cat),
            publishedAt: item.published_at || new Date().toISOString(),
            readMins: 3,
            impact: 91,
            tags: [cat, "space", region.toLowerCase().replace(/\s+/g, "-"), "live"]
          };
        }).filter(Boolean);
        mergeBatch(snItems);
      };

      await Promise.allSettled([...rssTasks, fetchSpaceflightNews()]);
    } catch {} finally {
      state.isLoading = false;
      btn.disabled = false;
      btn.classList.remove("spinning");
      renderCategories();
      renderGrid();
      hydrateMissingPhotos();
      if (!silent) {
        if (state.liveArticles.length) {
          DB.toast(added ? `Loaded ${added} live stories` : "Live feed is up to date", `${state.liveArticles.length} real-time stories synced across all categories.`, 3000);
        } else {
          DB.toast("Error Occurred", "Could not reach live news feeds. Please try again later.", 3200);
        }
      }
    }
  }

  DB.enhanceSelect($("regionSelect"));
  DB.enhanceSelect($("sortSelect"));

  $("newsSearch").addEventListener("input", renderGrid);
  $("clearSearch").onclick = e => {
    e.stopPropagation();
    $("newsSearch").value = "";
    $("newsSearch").focus();
    renderGrid();
  };
  $("regionSelect").addEventListener("change", renderGrid);
  $("sortSelect").addEventListener("change", renderGrid);

  document.addEventListener("keydown", e => {
    if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes((document.activeElement || {}).tagName)) {
      e.preventDefault();
      $("newsSearch").focus();
    }
  });

  const syncViewBtns = () => {
    $("viewGridBtn").setAttribute("aria-pressed", state.view === "grid");
    $("viewCompactBtn").setAttribute("aria-pressed", state.view === "compact");
  };
  $("viewGridBtn").onclick = () => { state.view = "grid"; syncViewBtns(); renderGrid(); };
  $("viewCompactBtn").onclick = () => { state.view = "compact"; syncViewBtns(); renderGrid(); };
  syncViewBtns();

  $("syncFeedsBtn").onclick = () => syncLiveFeeds(false);

  if (typeof DB.onLogin === "function") {
    DB.onLogin(() => {
      syncFromFirebase();
      renderCategories();
      renderGrid();
    });
  }

  renderCategories();
  renderGrid();
  syncLiveFeeds(true);
});
</script>
