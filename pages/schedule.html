<!DOCTYPE html>
<html lang="en">
<head>
<base href="../">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule | Project 23</title>
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Project 23">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/site-config.js"></script>
<script src="js/core.js"></script>
<style>
  :root {
    --apple-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --apple-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --glass-surface: color-mix(in srgb, var(--card-solid) 82%, transparent);
    --glass-elevated: color-mix(in srgb, var(--card-2) 90%, transparent);
    --glass-border: color-mix(in srgb, var(--text) 10%, var(--line));
    --glass-spec: inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    --hour-h: 64px;
  }

  main {
    max-width: 1260px;
    margin: 0 auto;
    padding: 1.2rem 1rem 4rem;
  }

  .pagetitle {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center;
    margin: 1.2rem auto 1.35rem;
    padding: 0 1rem;
    gap: 0.45rem;
  }
  .pagetitle h1 {
    display: block;
    width: 100%;
    font-family: var(--display);
    font-size: clamp(2.3rem, 7.5vw, 4.2rem);
    font-weight: 800;
    letter-spacing: 0.05em;
    line-height: 1.06;
    background: linear-gradient(135deg, var(--text) 25%, var(--accent) 68%, var(--accent3, var(--accent2)) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 30px rgba(108, 92, 231, 0.28);
    margin: 0;
  }
  .pagetitle .badge-row-wrap {
    display: flex;
    justify-content: center;
    width: 100%;
  }
  .pagetitle .badge-sub {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.3rem 0.9rem;
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--accent3, var(--accent));
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pagetitle .badge-sub svg {
    width: 14px;
    height: 14px;
  }
  .pagetitle p {
    margin: 0.15rem auto 0;
    color: var(--muted);
    font-size: clamp(0.92rem, 1.8vw, 1.04rem);
    max-width: 580px;
    line-height: 1.5;
  }

  .sp-shell {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    width: 100%;
  }

  .apple-panel {
    position: relative;
    background:
      radial-gradient(120% 130% at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 58%),
      var(--glass-surface);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-spec), 0 20px 44px -16px rgba(0, 0, 0, 0.4);
    border-radius: 26px;
    padding: clamp(1.1rem, 2.5vw, 1.5rem);
    display: flex;
    flex-direction: column;
    gap: 0.95rem;
    z-index: 30;
  }

  .sp-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .sp-title-box {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    min-width: 0;
    flex: 1 1 220px;
  }

  .sp-schedule-name {
    font-family: var(--display);
    font-size: clamp(1.18rem, 2.2vw, 1.42rem);
    font-weight: 800;
    color: var(--text);
    background: var(--glass-elevated);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 0.42rem 0.85rem;
    min-width: 0;
    width: min(290px, 100%);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .sp-schedule-name:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }

  .sp-actions-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .sp-btn {
    height: 42px;
    min-height: 42px;
    padding: 0 0.95rem;
    border-radius: 13px;
    font-size: 0.84rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
    transition: transform 0.16s var(--apple-ease), border-color 0.2s, background 0.2s, color 0.2s;
  }
  .sp-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .sp-btn.primary {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: var(--on-accent);
    border-color: transparent;
    font-weight: 700;
    box-shadow: var(--glow);
  }
  .sp-btn.danger-red {
    background: color-mix(in srgb, #ff3b30 14%, var(--glass-elevated));
    border-color: color-mix(in srgb, #ff3b30 45%, var(--line));
    color: #ff453a;
    font-weight: 700;
  }
  .sp-btn.danger-red:hover {
    background: #ff3b30;
    border-color: #ff3b30;
    color: #ffffff;
  }
  .sp-btn svg {
    width: 16px;
    height: 16px;
    flex: none;
  }

  .sp-pop-wrap {
    position: relative;
    display: inline-flex;
  }
  .sp-dropdown-pop {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 256px;
    background: color-mix(in srgb, var(--card-solid) 94%, transparent);
    backdrop-filter: blur(28px) saturate(190%);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    border: 1.5px solid color-mix(in srgb, var(--accent) 38%, var(--line));
    border-radius: 18px;
    padding: 0.65rem;
    box-shadow: 0 22px 52px rgba(0, 0, 0, 0.52), var(--glass-spec);
    z-index: 120;
    display: none;
    flex-direction: column;
    gap: 0.5rem;
  }
  .sp-dropdown-pop.open {
    display: flex;
    animation: rise 0.18s var(--apple-ease) both;
  }
  .sp-pop-lbl {
    font-family: var(--mono);
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 0.15rem 0.35rem 0.05rem;
  }
  .sp-style-seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.32rem;
    background: var(--card-2);
    padding: 0.25rem;
    border-radius: 12px;
    border: 1px solid var(--line);
  }
  .sp-style-opt {
    padding: 0.38rem 0.5rem;
    border-radius: 9px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 0.76rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.32rem;
    cursor: pointer;
    transition: background 0.16s, color 0.16s;
  }
  .sp-style-opt:hover {
    color: var(--text);
    transform: none;
  }
  .sp-style-opt.active {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: var(--on-accent);
    box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .sp-style-opt svg {
    width: 13px;
    height: 13px;
  }
  .sp-pop-divider {
    height: 1px;
    background: color-mix(in srgb, var(--line) 75%, transparent);
    margin: 0.1rem 0;
  }
  .sp-export-item {
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    padding: 0.52rem 0.65rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 0.65rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.16s, border-color 0.16s;
  }
  .sp-export-item:hover {
    background: var(--card-2);
    border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    transform: none;
  }
  .sp-exp-ic {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 16%, var(--card-2));
    color: var(--accent);
    display: grid;
    place-items: center;
    flex: none;
  }
  .sp-exp-ic svg {
    width: 17px;
    height: 17px;
  }
  .sp-exp-txt {
    display: flex;
    flex-direction: column;
    gap: 0.06rem;
    min-width: 0;
  }
  .sp-exp-txt b {
    font-size: 0.84rem;
    font-weight: 700;
    line-height: 1.2;
  }
  .sp-exp-txt span {
    font-size: 0.7rem;
    color: var(--muted);
    line-height: 1.2;
  }

  .sp-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .sp-pills {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 100%;
    padding: 0.1rem 0;
  }
  .sp-pills::-webkit-scrollbar {
    display: none;
  }

  .sp-pill {
    flex: none;
    border: 1px solid var(--line);
    background: var(--glass-elevated);
    color: var(--muted);
    font-size: 0.79rem;
    font-weight: 600;
    padding: 0.36rem 0.78rem;
    min-height: 36px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 0.32rem;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .sp-pill:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .sp-pill[aria-pressed="true"] {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: var(--on-accent);
    border-color: transparent;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 28%, transparent);
  }

  .sp-toolbar-right {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .sp-hours-btn {
    height: 36px;
    min-height: 36px;
    padding: 0 0.82rem;
    border-radius: 999px;
    font-size: 0.79rem;
    font-weight: 600;
    background: var(--glass-elevated);
    border: 1px solid var(--line);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    cursor: pointer;
    transition: border-color 0.18s;
  }
  .sp-hours-btn:hover,
  .sp-hours-btn[aria-expanded="true"] {
    border-color: var(--accent);
    transform: none;
  }
  .sp-hours-btn svg {
    width: 14px;
    height: 14px;
    color: var(--accent);
  }
  .sp-hours-pop {
    min-width: 268px;
  }
  .sp-hr-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }
  .sp-hr-col {
    display: flex;
    flex-direction: column;
    gap: 0.28rem;
  }
  .sp-hr-col-lbl {
    font-family: var(--mono);
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
  }
  .sp-hr-wheel {
    max-height: 176px;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.24rem;
    display: flex;
    flex-direction: column;
    gap: 0.14rem;
    scrollbar-width: thin;
  }
  .sp-hr-opt {
    padding: 0.34rem 0.5rem;
    border-radius: 8px;
    border: 0;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.76rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    transition: background 0.14s, color 0.14s;
  }
  .sp-hr-opt:hover {
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    transform: none;
  }
  .sp-hr-opt.active {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: var(--on-accent);
  }

  .sp-mobile-days {
    display: none;
    align-items: center;
    gap: 0.32rem;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0.15rem 0;
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 14px), transparent 100%);
  }
  .sp-mobile-days::-webkit-scrollbar {
    display: none;
  }

  .tt-board-panel {
    padding: 0 !important;
    overflow: hidden;
    border-radius: 26px;
    background: var(--glass-surface);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-spec), 0 22px 48px -16px rgba(0, 0, 0, 0.45);
  }

  .tt-scroll-wrap {
    width: 100%;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
  }

  .tt-board {
    min-width: 780px;
    width: 100%;
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  .tt-board.single-day-mode {
    min-width: 0;
  }

  .tt-header {
    display: grid;
    grid-template-columns: 68px repeat(var(--tt-cols, 7), minmax(0, 1fr));
    border-bottom: 1.5px solid var(--line);
    background: color-mix(in srgb, var(--card-solid) 88%, transparent);
    position: sticky;
    top: 0;
    z-index: 15;
  }
  .tt-corner {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.75rem 0.35rem;
    font-family: var(--mono);
    font-size: 0.66rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-right: 1px solid var(--line);
  }
  .tt-day-head {
    padding: 0.75rem 0.45rem;
    text-align: center;
    border-right: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.16rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .tt-day-head:last-child {
    border-right: 0;
  }
  .tt-day-head:hover {
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .tt-day-name {
    font-family: var(--display);
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 0.32rem;
  }
  .tt-day-head.is-today .tt-day-name {
    color: var(--accent);
  }
  .tt-today-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .tt-day-sub {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    font-weight: 600;
  }

  .tt-body {
    display: grid;
    grid-template-columns: 68px repeat(var(--tt-cols, 7), minmax(0, 1fr));
    position: relative;
  }

  .tt-time-col {
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--card-solid) 65%, transparent);
    position: relative;
  }
  .tt-time-cell {
    height: var(--hour-h);
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 0.25rem;
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
  }
  .tt-time-cell:last-child {
    border-bottom: 0;
  }

  .tt-day-col {
    position: relative;
    border-right: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    background: transparent;
  }
  .tt-day-col:last-child {
    border-right: 0;
  }
  .tt-day-col.is-today {
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, transparent), transparent 60%);
  }

  .tt-hour-slot {
    height: var(--hour-h);
    border-bottom: 1px solid color-mix(in srgb, var(--line) 68%, transparent);
    position: relative;
    cursor: pointer;
    transition: background 0.14s;
  }
  .tt-hour-slot:last-child {
    border-bottom: 0;
  }
  .tt-hour-slot::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    border-top: 1px dashed color-mix(in srgb, var(--line) 38%, transparent);
    pointer-events: none;
  }
  .tt-hour-slot:hover {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .tt-slot-plus {
    position: absolute;
    inset: 4px;
    border-radius: 8px;
    border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.14s;
    pointer-events: none;
  }
  .tt-hour-slot:hover .tt-slot-plus {
    opacity: 1;
  }

  .tt-event {
    position: absolute;
    z-index: 6;
    border-radius: 10px;
    background: color-mix(in srgb, var(--ev-color) 14%, var(--card-solid));
    border: 1.5px solid var(--ev-color);
    border-top: 5.5px solid var(--ev-color);
    box-shadow: 0 6px 16px -4px rgba(0, 0, 0, 0.28);
    padding: 0.34rem 0.46rem 0.32rem;
    display: flex;
    flex-direction: column;
    gap: 0.14rem;
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    transition: transform 0.16s var(--apple-ease), box-shadow 0.18s, background 0.18s;
  }
  [data-theme="light"] .tt-event {
    background: color-mix(in srgb, var(--ev-color) 10%, #ffffff);
    box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
  }
  .tt-event:hover {
    z-index: 12;
    transform: translateY(-1px) scale(1.01);
    background: color-mix(in srgb, var(--ev-color) 22%, var(--card-solid));
    box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.42);
  }
  .tt-ev-title {
    font-family: var(--display);
    font-size: 0.79rem;
    font-weight: 800;
    line-height: 1.2;
    color: var(--ev-color);
    display: flex;
    align-items: center;
    gap: 0.3rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tt-ev-ic {
    width: 13px;
    height: 13px;
    flex: none;
    display: inline-grid;
    place-items: center;
  }
  .tt-ev-ic svg {
    width: 13px;
    height: 13px;
    display: block;
  }
  [data-theme="dark"] .tt-ev-title,
  [data-theme="space"] .tt-ev-title {
    color: color-mix(in srgb, var(--ev-color) 82%, #ffffff);
  }
  .tt-ev-time {
    font-family: var(--mono);
    font-size: 0.67rem;
    font-weight: 700;
    line-height: 1.2;
    color: color-mix(in srgb, var(--ev-color) 85%, var(--text));
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  [data-theme="dark"] .tt-ev-time,
  [data-theme="space"] .tt-ev-time {
    color: color-mix(in srgb, var(--ev-color) 68%, #e8eaed);
  }
  .tt-ev-loc {
    font-size: 0.68rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.2rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tt-ev-loc svg {

  function isLightPageTheme() {
    return document.documentElement.dataset.theme === "light";
  }

  function getPaletteSwatches() {
    const monoHex = isLightPageTheme() ? "#2b2d42" : "#f8fafc";
    return [
      { id: "crimson", hex: "#e6194b" },
      { id: "orange", hex: "#f58231" },
      { id: "violet", hex: "#7c3aed" },
      { id: "cyan", hex: "#00a8e8" },
      { id: "lime", hex: "#7cb518" },
      { id: "mono", hex: monoHex },
      { id: "blue", hex: "#3b5bdb" },
      { id: "emerald", hex: "#12b886" },
      { id: "amber", hex: "#eab308" },
      { id: "rose", hex: "#ff4f79" }
    ];
  }

  function isMonoColor(c) {
    const low = String(c || "").toLowerCase();
    return low === "mono" || low === "#2b2d42" || low === "#ffffff" || low === "#f8fafc";
  }

  function resolveBlockDisplayColor(rawColor, forLightSurface = isLightPageTheme()) {
    if (isMonoColor(rawColor)) {
      return forLightSurface ? "#2b2d42" : "#f8fafc";
    }
    return rawColor || "#7c3aed";
  }

  function getIconSvg(iconId) {
    if (!iconId) return "";
    const found = CUSTOM_ICONS.find(x => x.id === iconId);
    return found ? found.svg : "";
  }

  const state = {
    weekMode: 7,
    mobileDay: "all",
    startHour: 8,
    endHour: 24,
    exportTheme: "light"
  };

  if (matchMedia("(max-width: 640px)").matches) {
    const jsDay = new Date().getDay();
    const todayIdx = (jsDay + 6) % 7;
    state.mobileDay = String(todayIdx);
  }

  async function ensureAccountAccess() {
    if (!DB.isGuest()) return true;
    const ok = await DB.requireAuth();
    if (ok) {
      syncMetaUI();
      renderAll();
    }
    return Boolean(ok);
  }

  const mainEl = document.querySelector("main");
  if (mainEl) {
    mainEl.addEventListener("click", e => {
      if (!DB.isGuest()) return;
      const interactive = e.target.closest("button, a, input, select, textarea, .tt-hour-slot, .tt-event, .tt-day-head");
      if (interactive) {
        e.preventDefault();
        e.stopPropagation();
        ensureAccountAccess();
      }
    }, true);
    mainEl.addEventListener("focusin", e => {
      if (!DB.isGuest()) return;
      const inp = e.target.closest("input, select, textarea");
      if (inp) {
        inp.blur();
        ensureAccountAccess();
      }
    }, true);
  }

  function loadBlocks() {
    if (DB.isGuest()) return [];
    const raw = DB.get(SCHEDULE_KEY, []);
    return Array.isArray(raw) ? raw : [];
  }

  function saveBlocks(list) {
    if (DB.isGuest()) {
      ensureAccountAccess();
      return;
    }
    DB.set(SCHEDULE_KEY, list);
    if (typeof DB.flush === "function") DB.flush();
    renderAll();
  }

  function loadMeta() {
    if (DB.isGuest()) return { title: "My Schedule", startHour: 8, endHour: 24 };
    return Object.assign({ title: "My Schedule", startHour: 8, endHour: 24 }, DB.get(META_KEY, {}) || {});
  }

  function saveMeta(patch) {
    if (DB.isGuest()) return;
    const next = Object.assign({}, loadMeta(), patch);
    DB.set(META_KEY, next);
    if (typeof DB.flush === "function") DB.flush();
  }

  function syncMetaUI() {
    const m = loadMeta();
    const inp = $("scheduleTitleInput");
    if (inp && document.activeElement !== inp) {
      inp.value = m.title || "My Schedule";
    }
    const sh = Number(m.startHour);
    const eh = Number(m.endHour);
    if (Number.isFinite(sh) && sh >= 0 && sh <= 23) state.startHour = sh;
    if (Number.isFinite(eh) && eh >= 1 && eh <= 24 && eh > state.startHour) state.endHour = eh;
    updateHoursRangeButtonLabel();
  }

  function updateHoursRangeButtonLabel() {
    const lbl = $("hoursRangeLbl");
    if (lbl) {
      lbl.textContent = `Day Hours: ${String(state.startHour).padStart(2, "0")}:00 – ${String(state.endHour).padStart(2, "0")}:00`;
    }
  }

  function timeToMins(tStr) {
    const [h, m] = String(tStr || "08:00").split(":").map(Number);
    return (Number.isFinite(h) ? h : 8) * 60 + (Number.isFinite(m) ? m : 0);
  }

  function minsToTime(mins) {
    const clamped = Math.max(0, Math.min(24 * 60, Math.round(mins)));
    const h = Math.floor(clamped / 60);
    const m = clamped % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }

  function fmtDurMins(mins) {
    const m = Math.max(0, Math.round(Number(mins) || 0));
    if (!m) return "0h 0m";
    const h = Math.floor(m / 60);
    const rem = m % 60;
    return h > 0 ? (rem > 0 ? `${h}h ${rem}m` : `${h}h`) : `${rem}m`;
  }

  function computeVisibleHourBounds() {
    const minH = Math.max(0, Math.min(23, Number(state.startHour) ?? 8));
    const maxH = Math.max(minH + 1, Math.min(24, Number(state.endHour) || 24));
    return { minH, maxH };
  }

  function computeDayLayout(dayBlocks) {
    const sorted = dayBlocks.slice().sort((a, b) => {
      const diff = timeToMins(a.startTime) - timeToMins(b.startTime);
      if (diff !== 0) return diff;
      return timeToMins(b.endTime) - timeToMins(a.endTime);
    });

    const clusters = [];
    let currentCluster = [];
    let clusterEnd = -1;

    for (const ev of sorted) {
      const s = timeToMins(ev.startTime);
      const e = Math.max(s + 15, timeToMins(ev.endTime));
      if (!currentCluster.length || s < clusterEnd) {
        currentCluster.push({ ev, s, e });
        clusterEnd = Math.max(clusterEnd, e);
      } else {
        clusters.push(currentCluster);
        currentCluster = [{ ev, s, e }];
        clusterEnd = e;
      }
    }
    if (currentCluster.length) clusters.push(currentCluster);

    const positioned = [];
    for (const cluster of clusters) {
      const cols = [];
      for (const item of cluster) {
        let placedCol = -1;
        for (let c = 0; c < cols.length; c++) {
          if (cols[c] <= item.s) {
            placedCol = c;
            cols[c] = item.e;
            break;
          }
        }
        if (placedCol === -1) {
          placedCol = cols.length;
          cols.push(item.e);
        }
        item.col = placedCol;
      }
      const totalCols = Math.max(1, cols.length);
      for (const item of cluster) {
        positioned.push({
          ev: item.ev,
          startMins: item.s,
          endMins: item.e,
          col: item.col,
          totalCols
        });
      }
    }
    return positioned;
  }

  function renderMobileDayBar(blocks) {
    const bar = $("mobileDayBar");
    const maxDays = state.weekMode === 5 ? 5 : 7;
    const visibleDays = DAYS.slice(0, maxDays);
    const pills = [
      { key: "all", label: `All ${maxDays} Days` },
      ...visibleDays.map(d => {
        const cnt = blocks.filter(b => Number(b.day) === d.idx).length;
        return { key: String(d.idx), label: `${d.short}${cnt ? ` (${cnt})` : ""}` };
      })
    ];

    bar.innerHTML = pills.map(p => `
      <button type="button" class="sp-pill" data-mob-day="${p.key}" aria-pressed="${state.mobileDay === p.key}">
        ${DB.esc(p.label)}
      </button>
    `).join("");

    bar.querySelectorAll("[data-mob-day]").forEach(btn => {
      btn.onclick = async () => {
        if (!(await ensureAccountAccess())) return;
        state.mobileDay = btn.dataset.mobDay;
        renderAll();
      };
    });
  }

  function renderEmptyBanner() {
    const wrap = $("emptyScheduleBanner");
    if (DB.isGuest()) {
      wrap.innerHTML = `
        <div class="sp-empty-banner">
          <div>
            <b>Sign in to build and sync your weekly timetable</b>
            <p>Click any time slot or button to sign in with Google and save your schedule to Firestore across all your devices.</p>
          </div>
          <button type="button" class="sp-btn primary" id="bannerSignInBtn">Sign in to continue</button>
        </div>
      `;
      const btn = $("bannerSignInBtn");
      if (btn) btn.onclick = () => ensureAccountAccess();
      return;
    }
    wrap.innerHTML = "";
  }

  function renderTimetable(blocks) {
    const board = $("timetableBoard");
    const header = $("timetableHeader");
    const body = $("timetableBody");

    const maxDays = state.weekMode === 5 ? 5 : 7;
    let activeDays = DAYS.slice(0, maxDays);
    const isMobileNarrow = matchMedia("(max-width: 860px)").matches;
    if (isMobileNarrow && state.mobileDay !== "all") {
      const picked = activeDays.find(d => String(d.idx) === state.mobileDay);
      if (picked) activeDays = [picked];
    }

    board.style.setProperty("--tt-cols", activeDays.length);
    board.classList.toggle("single-day-mode", activeDays.length === 1);

    const { minH, maxH } = computeVisibleHourBounds();
    const totalHours = maxH - minH;
    const HOUR_PX = 64;
    const todayIdx = (new Date().getDay() + 6) % 7;

    header.innerHTML = `
      <div class="tt-corner">TIME</div>
      ${activeDays.map(d => {
        const dayBlocks = blocks.filter(b => Number(b.day) === d.idx);
        const dayMins = dayBlocks.reduce((acc, b) => acc + Math.max(0, timeToMins(b.endTime) - timeToMins(b.startTime)), 0);
        const isToday = d.idx === todayIdx;
        return `
          <div class="tt-day-head ${isToday ? "is-today" : ""}" data-add-day="${d.idx}" title="Click to add event on ${d.full}">
            <span class="tt-day-name">
              ${isToday ? '<i class="tt-today-dot"></i>' : ""}
              ${d.full}
            </span>
            <span class="tt-day-sub">${dayMins ? fmtDurMins(dayMins) : "No blocks"}</span>
          </div>
        `;
      }).join("")}
    `;

    header.querySelectorAll("[data-add-day]").forEach(hd => {
      hd.onclick = async () => {
        if (!(await ensureAccountAccess())) return;
        const startH = Math.max(minH, Math.min(maxH - 1, 9));
        openBlockModal({
          day: Number(hd.dataset.addDay),
          startTime: `${String(startH).padStart(2, "0")}:00`,
          endTime: `${String(Math.min(24, startH + 1)).padStart(2, "0")}:00`
        });
      };
    });

    const hoursList = [];
    for (let h = minH; h < maxH; h++) hoursList.push(h);

    const timeColHtml = `
      <div class="tt-time-col">
        ${hoursList.map(h => `<div class="tt-time-cell">${String(h).padStart(2, "0")}:00</div>`).join("")}
      </div>
    `;

    const pinSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;

    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const showNowLine = nowMins >= minH * 60 && nowMins <= maxH * 60;
    const nowTopPx = ((nowMins - minH * 60) / 60) * HOUR_PX;

    const dayColsHtml = activeDays.map(d => {
      const isToday = d.idx === todayIdx;
      const dayBlocks = blocks.filter(b => Number(b.day) === d.idx);
      const positioned = computeDayLayout(dayBlocks).filter(
        pos => pos.endMins > minH * 60 && pos.startMins < maxH * 60
      );

      const slotsHtml = hoursList.map(h => {
        const sTime = `${String(h).padStart(2, "0")}:00`;
        const eTime = `${String(Math.min(24, h + 1)).padStart(2, "0")}:00`;
        return `
          <div class="tt-hour-slot" data-day="${d.idx}" data-start="${sTime}" data-end="${eTime}" title="Add block at ${sTime} on ${d.short}">
            <span class="tt-slot-plus">+ ${sTime}</span>
          </div>
        `;
      }).join("");

      const eventsHtml = positioned.map(pos => {
        const ev = pos.ev;
        const clampedStart = Math.max(minH * 60, pos.startMins);
        const clampedEnd = Math.min(maxH * 60, pos.endMins);
        const topPx = Math.max(0, ((clampedStart - minH * 60) / 60) * HOUR_PX);
        const durMins = Math.max(20, clampedEnd - clampedStart);
        const heightPx = Math.max(26, (durMins / 60) * HOUR_PX - 2);
        const widthPct = 100 / pos.totalCols;
        const leftPct = pos.col * widthPct;
        const color = resolveBlockDisplayColor(ev.color, isLightPageTheme());
        const icSvg = getIconSvg(ev.icon);
        const isCompact = durMins <= 50;

        return `
          <div class="tt-event ${isCompact ? "compact" : ""}"
               data-ev-id="${DB.esc(ev.id)}"
               style="--ev-color:${DB.esc(color)};top:${topPx.toFixed(1)}px;height:${heightPx.toFixed(1)}px;left:calc(${leftPct.toFixed(2)}% + 3px);width:calc(${widthPct.toFixed(2)}% - 6px);">
            <div class="tt-ev-title">${icSvg ? `<span class="tt-ev-ic">${icSvg}</span>` : ""}<span>${DB.esc(ev.title)}</span></div>
            <div class="tt-ev-time">${DB.esc(ev.startTime)} - ${DB.esc(ev.endTime)}</div>
            ${ev.location && durMins >= 45 ? `<div class="tt-ev-loc">${pinSvg}<span>${DB.esc(ev.location)}</span></div>` : ""}
            ${ev.description && durMins >= 75 ? `<div class="tt-ev-desc">${DB.esc(ev.description)}</div>` : ""}
          </div>
        `;
      }).join("");

      return `
        <div class="tt-day-col ${isToday ? "is-today" : ""}" style="height:${totalHours * HOUR_PX}px">
          ${slotsHtml}
          ${isToday && showNowLine ? `<div class="tt-now-line" style="top:${nowTopPx.toFixed(1)}px" title="Current time"></div>` : ""}
          ${eventsHtml}
        </div>
      `;
    }).join("");

    body.innerHTML = timeColHtml + dayColsHtml;

    body.querySelectorAll(".tt-hour-slot").forEach(slot => {
      slot.onclick = async e => {
        if (e.target.closest(".tt-event")) return;
        if (!(await ensureAccountAccess())) return;
        openBlockModal({
          day: Number(slot.dataset.day),
          startTime: slot.dataset.start,
          endTime: slot.dataset.end
        });
      };
    });

    body.querySelectorAll(".tt-event").forEach(card => {
      card.onclick = async e => {
        e.stopPropagation();
        if (!(await ensureAccountAccess())) return;
        const list = loadBlocks();
        const found = list.find(x => x.id === card.dataset.evId);
        if (found) openBlockModal(found);
      };
    });
  }

  function parseTypedTime(rawStr, fallbackMins) {
    const clean = String(rawStr || "").trim();
    if (!clean) return fallbackMins;
    const colonMatch = clean.match(/^(\d{1,2})\s*[:.]\s*(\d{1,2})$/);
    if (colonMatch) {
      const h = Math.max(0, Math.min(23, parseInt(colonMatch[1], 10)));
      const m = Math.max(0, Math.min(59, parseInt(colonMatch[2], 10)));
      return h * 60 + m;
    }
    const digits = clean.replace(/\D/g, "");
    if (digits.length === 1 || digits.length === 2) {
      const h = Math.max(0, Math.min(23, parseInt(digits, 10)));
      return h * 60;
    }
    if (digits.length === 3) {
      const h = Math.max(0, Math.min(23, parseInt(digits.slice(0, 1), 10)));
      const m = Math.max(0, Math.min(59, parseInt(digits.slice(1), 10)));
      return h * 60 + m;
    }
    if (digits.length >= 4) {
      const h = Math.max(0, Math.min(23, parseInt(digits.slice(0, 2), 10)));
      const m = Math.max(0, Math.min(59, parseInt(digits.slice(2, 4), 10)));
      return h * 60 + m;
    }
    return fallbackMins;
  }

  function attachCustomTimeScroller(wrapEl, initialTimeStr, onChange) {
    let curMins = timeToMins(initialTimeStr);
    const groupEl = wrapEl.querySelector(".sp-time-input-group");
    const textInp = wrapEl.querySelector(".sp-time-input");
    const clockBtn = wrapEl.querySelector(".sp-clock-btn");
    const popEl = wrapEl.querySelector(".sp-time-popover");
    const hrCol = wrapEl.querySelector(".sp-tp-hours");
    const minCol = wrapEl.querySelector(".sp-tp-mins");

    const renderWheels = (syncInput = true) => {
      const curH = Math.floor(curMins / 60);
      const curM = curMins % 60;
      if (syncInput && document.activeElement !== textInp) {
        textInp.value = minsToTime(curMins);
      }

      let hHtml = "";
      for (let h = 0; h <= 23; h++) {
        hHtml += `<button type="button" class="sp-tp-item ${h === curH ? "active" : ""}" data-h="${h}">${String(h).padStart(2, "0")}</button>`;
      }
      hrCol.innerHTML = hHtml;

      const minuteSteps = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
      if (!minuteSteps.includes(curM)) minuteSteps.push(curM);
      minuteSteps.sort((a, b) => a - b);

      minCol.innerHTML = minuteSteps.map(m => `
        <button type="button" class="sp-tp-item ${m === curM ? "active" : ""}" data-m="${m}">:${String(m).padStart(2, "0")}</button>
      `).join("");

      hrCol.querySelectorAll("[data-h]").forEach(b => {
        b.onclick = e => {
          e.stopPropagation();
          const newH = Number(b.dataset.h);
          curMins = newH * 60 + (curMins % 60);
          textInp.value = minsToTime(curMins);
          renderWheels(false);
          onChange(minsToTime(curMins));
        };
      });

      minCol.querySelectorAll("[data-m]").forEach(b => {
        b.onclick = e => {
          e.stopPropagation();
          const newM = Number(b.dataset.m);
          curMins = Math.floor(curMins / 60) * 60 + newM;
          textInp.value = minsToTime(curMins);
          renderWheels(false);
          onChange(minsToTime(curMins));
        };
      });
    };

    textInp.value = minsToTime(curMins);
    renderWheels(false);

    textInp.addEventListener("focus", () => {
      popEl.classList.remove("open");
      groupEl.classList.remove("open");
      clockBtn.setAttribute("aria-expanded", "false");
    });

    textInp.addEventListener("input", () => {
      const raw = textInp.value;
      if (/^\d{2}$/.test(raw) && parseInt(raw, 10) <= 23) {
      }
      if (/^\d{1,2}:\d{2}$/.test(raw.trim())) {
        curMins = parseTypedTime(raw, curMins);
        renderWheels(false);
        onChange(minsToTime(curMins));
      }
    });

    const commitTyped = () => {
      curMins = parseTypedTime(textInp.value, curMins);
      textInp.value = minsToTime(curMins);
      renderWheels(false);
      onChange(minsToTime(curMins));
    };

    textInp.addEventListener("blur", commitTyped);
    textInp.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        commitTyped();
        textInp.blur();
      }
    });

    clockBtn.onclick = e => {
      e.stopPropagation();
      commitTyped();
      const willOpen = !popEl.classList.contains("open");
      document.querySelectorAll(".sp-time-popover.open, .sp-icon-menu.open").forEach(el => {
        if (el !== popEl) el.classList.remove("open");
      });
      document.querySelectorAll(".sp-time-input-group.open").forEach(el => {
        if (el !== groupEl) el.classList.remove("open");
      });
      popEl.classList.toggle("open", willOpen);
      groupEl.classList.toggle("open", willOpen);
      clockBtn.setAttribute("aria-expanded", String(willOpen));
      if (willOpen) {
        const actH = hrCol.querySelector(".sp-tp-item.active");
        const actM = minCol.querySelector(".sp-tp-item.active");
        if (actH) actH.scrollIntoView({ block: "center" });
        if (actM) actM.scrollIntoView({ block: "center" });
      }
    };

    wrapEl.querySelectorAll("[data-step-m]").forEach(stepBtn => {
      stepBtn.onclick = e => {
        e.stopPropagation();
        const delta = Number(stepBtn.dataset.stepM) || 0;
        curMins = Math.max(0, Math.min(23 * 60 + 59, curMins + delta));
        textInp.value = minsToTime(curMins);
        renderWheels(false);
        onChange(minsToTime(curMins));
      };
    });

    const doneBtn = wrapEl.querySelector(".sp-tp-done");
    if (doneBtn) {
      doneBtn.onclick = e => {
        e.stopPropagation();
        popEl.classList.remove("open");
        groupEl.classList.remove("open");
        clockBtn.setAttribute("aria-expanded", "false");
      };
    }

    return {
      getValue: () => {
        curMins = parseTypedTime(textInp.value, curMins);
        return minsToTime(curMins);
      },
      setValue: newStr => {
        curMins = timeToMins(newStr);
        textInp.value = minsToTime(curMins);
        renderWheels(false);
      }
    };
  }

        if (siblingBlocks.length > 1) {
          const sibIds = new Set(siblingBlocks.map(x => x.id));
          cur = cur.filter(x => !sibIds.has(x.id));
        } else {
          cur = cur.filter(x => x.id !== item.id);
        }
      }

      selectedDays.forEach((dayIdx, i) => {
        cur.push({
          id: (isEdit && i === 0 && dayIdx === Number(item.day)) ? item.id : DB.uid(),
          title,
          day: dayIdx,
          startTime,
          endTime,
          location,
          description,
          color: chosenColor,
          icon: chosenIcon,
          updatedAt: Date.now()
        });
      });

      saveBlocks(cur);
      close();
      DB.toast(isEdit ? "Schedule Updated" : "Added to Schedule", `${title} (${startTime} – ${endTime}) synced to Firestore.`, 2500);
    };
  }

  function renderScheduleToCanvas() {
    const blocks = loadBlocks();
    const meta = loadMeta();
    const title = (meta.title || "My Schedule").trim();
    const maxDays = state.weekMode === 5 ? 5 : 7;
    const exportDays = DAYS.slice(0, maxDays);
    const { minH, maxH } = computeVisibleHourBounds();
    const totalHours = maxH - minH;
    const isLight = state.exportTheme !== "dark";

    const scale = 2;
    const padX = 52;
    const topBarH = 110;
    const colHeadH = 54;
    const timeAxisW = 86;
    const dayColW = maxDays === 5 ? 260 : 196;
    const hourH = 88;
    const bottomPad = 48;

    const logicalW = padX * 2 + timeAxisW + dayColW * maxDays;
    const logicalH = topBarH + colHeadH + totalHours * hourH + bottomPad;

    const cv = document.createElement("canvas");
    cv.width = logicalW * scale;
    cv.height = logicalH * scale;
    const ctx = cv.getContext("2d");
    ctx.scale(scale, scale);

    const bgCol = isLight ? "#f8f9fb" : "#0b0918";
    const boardBg = isLight ? "#ffffff" : "#141029";
    const textCol = isLight ? "#16181d" : "#f3eeff";
    const mutedCol = isLight ? "#667085" : "#a396cc";
    const gridLineCol = isLight ? "#dfe3ea" : "rgba(190, 160, 255, 0.16)";
    const halfLineCol = isLight ? "#eef1f5" : "rgba(190, 160, 255, 0.08)";

    ctx.fillStyle = bgCol;
    ctx.fillRect(0, 0, logicalW, logicalH);

    ctx.fillStyle = textCol;
    ctx.font = "800 18px 'Bricolage Grotesque', 'Outfit', system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText("PROJECT 23", padX + timeAxisW, 44);
    ctx.font = "700 12px 'Space Mono', monospace";
    ctx.fillStyle = mutedCol;
    ctx.fillText("WEEKLY SCHEDULE", padX + timeAxisW, 64);

    ctx.fillStyle = textCol;
    ctx.font = "800 30px 'Bricolage Grotesque', 'Outfit', system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(title, logicalW / 2, 52);

    const gridLeft = padX + timeAxisW;
    const gridTop = topBarH + colHeadH;
    const gridW = dayColW * maxDays;
    const gridH = totalHours * hourH;

    exportDays.forEach((d, idx) => {
      const cx = gridLeft + idx * dayColW + dayColW / 2;
      ctx.fillStyle = textCol;
      ctx.font = "800 13px 'Bricolage Grotesque', 'Outfit', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(d.full, cx, topBarH + colHeadH / 2);
    });

    ctx.fillStyle = boardBg;
    ctx.fillRect(gridLeft, gridTop, gridW, gridH);

    for (let i = 0; i <= totalHours; i++) {
      const y = gridTop + i * hourH;
      const hr = minH + i;

      ctx.strokeStyle = gridLineCol;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(gridLeft, y);
      ctx.lineTo(gridLeft + gridW, y);
      ctx.stroke();

      if (i < totalHours) {
        ctx.fillStyle = mutedCol;
        ctx.font = "700 12px 'Space Mono', monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText(`${String(hr).padStart(2, "0")}:00`, gridLeft - 14, y);

        const halfY = y + hourH / 2;
        ctx.strokeStyle = halfLineCol;
        ctx.beginPath();
        ctx.moveTo(gridLeft, halfY);
        ctx.lineTo(gridLeft + gridW, halfY);
        ctx.stroke();
      }
    }

    for (let i = 0; i <= maxDays; i++) {
      const x = gridLeft + i * dayColW;
      ctx.strokeStyle = gridLineCol;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, gridTop);
      ctx.lineTo(x, gridTop + gridH);
      ctx.stroke();
    }

    const roundRectPath = (x, y, w, h, r) => {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
      ctx.lineTo(x + rad, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
      ctx.lineTo(x, y + rad);
      ctx.quadraticCurveTo(x, y, x + rad, y);
      ctx.closePath();
    };

    const clipText = (str, maxW) => {
      let s = String(str || "");
      if (ctx.measureText(s).width <= maxW) return s;
      while (s.length > 1 && ctx.measureText(s + "…").width > maxW) {
        s = s.slice(0, -1);
      }
      return s + "…";
    };

    exportDays.forEach((d, dayColIdx) => {
      const colX = gridLeft + dayColIdx * dayColW;
      const dayBlocks = blocks.filter(b => Number(b.day) === d.idx);
      const positioned = computeDayLayout(dayBlocks).filter(
        pos => pos.endMins > minH * 60 && pos.startMins < maxH * 60
      );

      positioned.forEach(pos => {
        const ev = pos.ev;
        const clampedStart = Math.max(minH * 60, pos.startMins);
        const clampedEnd = Math.min(maxH * 60, pos.endMins);
        const topY = gridTop + Math.max(0, ((clampedStart - minH * 60) / 60) * hourH) + 1.5;
        const durMins = Math.max(20, clampedEnd - clampedStart);
        const boxH = Math.max(30, (durMins / 60) * hourH - 3);
        const colW = dayColW / pos.totalCols;
        const boxX = colX + pos.col * colW + 2.5;
        const boxW = colW - 5;
        const color = resolveBlockDisplayColor(ev.color, isLight);

        ctx.save();
        roundRectPath(boxX, topY, boxW, boxH, 9);
        ctx.fillStyle = isLight ? "#ffffff" : "#1c1638";
        ctx.fill();
        ctx.clip();

        ctx.fillStyle = color + (isLight ? "14" : "24");
        ctx.fillRect(boxX, topY, boxW, boxH);

        ctx.fillStyle = color;
        ctx.fillRect(boxX, topY, boxW, 6.5);

        const innerX = boxX + 10;
        const maxTextW = boxW - 20;
        let curY = topY + 19;

        const icOffset = drawCanvasVectorIcon(ctx, ev.icon, innerX, curY, 13, color);
        ctx.fillStyle = color;
        ctx.font = "800 13.5px 'Outfit', system-ui, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(clipText(ev.title || "Untitled", maxTextW - icOffset), innerX + icOffset, curY);

        curY += 18;
        if (curY + 6 <= topY + boxH) {
          ctx.fillStyle = color;
          ctx.font = "600 11.5px 'Space Mono', monospace";
          ctx.fillText(clipText(`${ev.startTime} - ${ev.endTime}`, maxTextW), innerX, curY);
        }

        curY += 17;
        if (ev.location && curY + 6 <= topY + boxH) {
          ctx.fillStyle = color;
          ctx.font = "600 11.5px 'Outfit', system-ui, sans-serif";
          ctx.fillText(clipText(ev.location, maxTextW), innerX, curY);
          curY += 16;
        }

        if (ev.description && curY + 6 <= topY + boxH) {
          ctx.fillStyle = mutedCol;
          ctx.font = "500 11px 'Outfit', system-ui, sans-serif";
          ctx.fillText(clipText(ev.description, maxTextW), innerX, curY);
        }

        ctx.restore();

        ctx.save();
        roundRectPath(boxX, topY, boxW, boxH, 9);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.6;
        ctx.stroke();
        ctx.restore();
      });
    });

    return cv;
  }

  function buildPdfFromJpegDataUrl(jpegDataUrl, imgWidthPx, imgHeightPx) {
    const base64 = jpegDataUrl.split(",")[1];
    const binStr = atob(base64);
    const jpegBytes = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) jpegBytes[i] = binStr.charCodeAt(i);

    const pageW = 842;
    const pageH = Math.round((imgHeightPx / imgWidthPx) * pageW);

    const enc = str => {
      const arr = new Uint8Array(str.length);
      for (let i = 0; i < str.length; i++) arr[i] = str.charCodeAt(i) & 0xff;
      return arr;
    };

    const chunks = [];
    const offsets = [];
    let byteLen = 0;
    const pushBytes = u8 => { chunks.push(u8); byteLen += u8.length; };
    const pushStr = s => pushBytes(enc(s));
    const startObj = id => { offsets[id] = byteLen; pushStr(`${id} 0 obj\n`); };
    const endObj = () => pushStr("endobj\n");

    pushStr("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");

    startObj(1);
    pushStr("<< /Type /Catalog /Pages 2 0 R >>\n");
    endObj();

    startObj(2);
    pushStr("<< /Type /Pages /Kids [3 0 R] /Count 1 >>\n");
    endObj();

    startObj(3);
    pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\n`);
    endObj();

    startObj(4);
    pushStr(`<< /Type /XObject /Subtype /Image /Width ${imgWidthPx} /Height ${imgHeightPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
    pushBytes(jpegBytes);
    pushStr("\nendstream\n");
    endObj();

    const contentStream = `q\n${pageW} 0 0 ${pageH} 0 0 cm\n/Im0 Do\nQ\n`;
    startObj(5);
    pushStr(`<< /Length ${contentStream.length} >>\nstream\n${contentStream}endstream\n`);
    endObj();

    const xrefOffset = byteLen;
    pushStr("xref\n0 6\n0000000000 65535 f \n");
    for (let i = 1; i <= 5; i++) {
      pushStr(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
    }
    pushStr(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`);

    return new Blob(chunks, { type: "application/pdf" });
  }

  function safeFilenameBase() {
    const raw = (loadMeta().title || "Weekly-Schedule").trim();
    return raw.replace(/[^a-zA-Z0-9_-]+/g, "-").replace(/^-+|-+$/g, "") || "Weekly-Schedule";
  }

  function exportAsPng() {
    const blocks = loadBlocks();
    if (!blocks.length) {
      DB.toast("Schedule is Empty", "Add at least one block before exporting.", 2600);
      return;
    }
    const cv = renderScheduleToCanvas();
    cv.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${safeFilenameBase()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      DB.toast("Exported Image", `Downloaded ${safeFilenameBase()}.png`, 2600);
    }, "image/png");
  }

  function exportAsPdf() {
    const blocks = loadBlocks();
    if (!blocks.length) {
      DB.toast("Schedule is Empty", "Add at least one block before exporting.", 2600);
      return;
    }
    const cv = renderScheduleToCanvas();
    const jpegUrl = cv.toDataURL("image/jpeg", 0.95);
    const pdfBlob = buildPdfFromJpegDataUrl(jpegUrl, cv.width, cv.height);
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${safeFilenameBase()}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    DB.toast("Exported PDF", `Downloaded ${safeFilenameBase()}.pdf`, 2600);
  }

  function renderDayHourWheels() {
    let sHtml = "";

      sHtml += `<button type="button" class="sp-hr-opt ${h === state.startHour ? "active" : ""}" data-start-h="${h}">${String(h).padStart(2, "0")}:00</button>`;

    startWheel.innerHTML = sHtml;

    let eHtml = "";
    for (let h = state.startHour + 1; h <= 24; h++) {
      eHtml += `<button type="button" class="sp-hr-opt ${h === state.endHour ? "active" : ""}" data-end-h="${h}">${String(h).padStart(2, "0")}:00</button>`;

        state.startHour = Number(b.dataset.startH);

          state.endHour = Math.min(24, state.startHour + 1);

        saveMeta({ startHour: state.startHour, endHour: state.endHour });
        renderDayHourWheels();

      return;
    }
    const node = document.createElement("div");
    node.innerHTML = `
      <h2>Clear Entire Schedule?</h2>
      <p>Are you sure you want to remove all ${cur.length} scheduled block${cur.length === 1 ? "" : "s"} from your weekly timetable?</p>
      <div class="actions">
        <button type="button" class="ghost left" id="spCancelClear">Cancel</button>
        <button type="button" class="danger" id="spConfirmClear">Clear All Blocks</button>
      </div>
    `;
    const close = DB.modal(node);
    node.querySelector("#spCancelClear").onclick = close;
    node.querySelector("#spConfirmClear").onclick = () => {
      saveBlocks([]);
      close();
      DB.toast("Schedule Cleared", "All weekly blocks have been removed.", 2400);
    };
  };

  document.querySelectorAll("[data-week-mode]").forEach(btn => {
    btn.onclick = async () => {
      if (!(await ensureAccountAccess())) return;
      state.weekMode = Number(btn.dataset.weekMode);
      if (state.weekMode === 5 && (state.mobileDay === "5" || state.mobileDay === "6")) {
        state.mobileDay = "all";
      }
      document.querySelectorAll("[data-week-mode]").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
      renderAll();
    };
  });

  document.addEventListener("themechange", () => {
    renderAll();
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => renderAll(), 150);
  });

  if (typeof DB.onLogin === "function") {
    DB.onLogin(() => {
      syncMetaUI();
      renderAll();
    });
  }

  document.addEventListener("p23schedule", () => {
    syncMetaUI();
    renderAll();
  });

  syncMetaUI();
  renderAll();
});
</script>
</body>
</html>
