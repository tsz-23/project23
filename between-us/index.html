<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21172b">
  <meta name="description" content="Between Us — a two-player branching high-school romance visual novel.">
  <title>Between Us — A Two-Player Romance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a href="#" class="wordmark" id="homeLink" aria-label="Between Us home"><span class="logo-mark heart-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><defs><linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe3f0"/><stop offset=".52" stop-color="#f3a9c7"/><stop offset="1" stop-color="#b9b4ff"/></linearGradient></defs><path d="M20 32S5 23.3 5 13.8C5 5.5 15 3.8 20 11c5-7.2 15-5.5 15 2.8C35 23.3 20 32 20 32Z" fill="url(#heartGrad)" stroke="#fff0f7" stroke-width="1.2"/><path d="M10 13c.8-3.2 4-4.2 6.5-2.6" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="1.5"/><path d="M20 14c-2.7 4-2.8 8.5 0 12" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1"/></svg></span><span>BETWEEN <b>US</b><small>A TWO-PLAYER STORY</small></span></a>
    <div class="topbar-right"><span class="connection-dot" id="connectionDot"></span><span id="connectionLabel">Preview</span><button class="icon-button" id="soundToggle" aria-label="Toggle sound" title="Toggle sound">♫</button></div>
  </header>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status"></div>
  <div id="cinematic" class="cinematic hidden" aria-modal="true" role="dialog" aria-label="Story cinematic">
    <div class="cinema-grain"></div><div class="cinema-topbar"><span>BETWEEN US ORIGINAL</span><button class="icon-button" id="skipCinema">SKIP ↗</button></div>
    <div class="cinema-scene" id="cinemaScene"><span class="scene-kicker" id="cinemaKicker">CHAPTER ONE</span><h2 id="cinemaTitle">First Impressions</h2><p id="cinemaText"></p></div>
    <div class="cinema-bottom"><span class="cinema-progress"><i id="cinemaProgress"></i></span><button class="primary-button" id="continueCinema">Continue <span>→</span></button></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="data/story-data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
