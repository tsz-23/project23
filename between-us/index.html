<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21172b">
  <meta name="description" content="Between Us — a two-player branching high-school romance visual novel.">
  <title>Between Us | Two-Player Romance</title>
  <link rel="icon" type="image/png" href="assets/between_us.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home-screen">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a href="#" class="wordmark" id="homeLink" aria-label="Between Us home"><span class="logo-mark" aria-hidden="true"><img src="assets/between_us.png" alt="" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;"></span><span>BETWEEN <b>US</b><small>A TWO-PLAYER STORY</small></span></a>
    <!-- <div class="topbar-right">
      <div class="connection-badge"><span class="connection-dot" id="connectionDot"></span><span id="connectionLabel">Preview</span></div>
      <button class="avatar" id="profileBtn" title="Account and settings" aria-label="Account and settings"><span>·</span></button>
    </div> -->
  </header>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status"></div>
  <div id="cinematic" class="cinematic hidden" aria-modal="true" role="dialog" aria-label="Story cinematic">
    <div class="cinema-grain"></div><div class="cinema-topbar"><span>BETWEEN US ORIGINAL</span><button class="icon-button" id="skipCinema">SKIP ↗</button></div>
    <div class="cinema-scene" id="cinemaScene"><span class="scene-kicker" id="cinemaKicker">CHAPTER ONE</span><h2 id="cinemaTitle">First Impressions</h2><p id="cinemaText"></p></div>
    <div class="cinema-bottom"><span class="cinema-progress"><i id="cinemaProgress"></i></span><button class="primary-button" id="continueCinema">Continue <span>→</span></button></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="data/story-data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
