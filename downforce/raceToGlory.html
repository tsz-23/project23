</head>
<body>

function buildGrass(img){
  const IW=img.width,IH=img.height,cv=document.createElement('canvas');cv.width=IW;cv.height=IH;
  const cx=cv.getContext('2d');cx.drawImage(img,0,0);
  const d=cx.getImageData(0,0,IW,IH);
  for(let i=0;i<d.data.length;i+=4){                     // black background -> transparent
    d.data[i+3]=clamp((Math.max(d.data[i],d.data[i+1],d.data[i+2])-14)*12,0,255);
  }

  const mat=new THREE.MeshStandardMaterial({map:tex,alphaTest:0.45,side:THREE.DoubleSide,roughness:1,metalness:0});

  const tuftGeo=([x0,y0,x1,y1],h)=>{
    const w=h*(x1-x0)/(y1-y0),u0=x0/IW,u1=x1/IW,v0=1-y1/IH,v1=1-y0/IH,pos=[],uv=[],idx=[];

      uv.push(u0,v0,u1,v0,u1,v1,u0,v1);
      idx.push(k*4,k*4+1,k*4+2,k*4,k*4+2,k*4+3);
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(Array.from({length:24},(_,i)=>i%3===1?1:0),3)); // light from above

  };

// into the instance buffers. Outer rings are thinned out so the grass fades away instead of ending at an edge.

  const FADE=[1,1,1,0.7,0.5,0.35,0.25,0.18];         // density of ring 0,1,2... around the car

  }

    m.setColorAt(0,new THREE.Color(1,1,1));scene.add(m);return m;
  });

  const m4=new THREE.Matrix4(),q4=new THREE.Quaternion(),yA=new THREE.Vector3(0,1,0),pv=new THREE.Vector3(),sv=new THREE.Vector3();
  const SM=meshes.map(()=>new Float32Array(GDENS*16)),SC=meshes.map(()=>new Float32Array(GDENS*3)),cache=new Map();

  };
}

const SCENERY=[

function paintWith(root,url){
  new THREE.TextureLoader().load(url,cm=>{
    cm.flipY=false;cm.colorSpace=THREE.SRGBColorSpace;cm.magFilter=cm.minFilter=THREE.NearestFilter;cm.generateMipmaps=false;
    root.traverse(o=>{if(o.isMesh)for(const mt of [].concat(o.material)){mt.map=cm;mt.color.set(0xffffff);mt.needsUpdate=true;}});
  },undefined,()=>console.warn('Missing '+url));
}
function tintYacht(root){            // a yacht model without its palette: colour the parts by their names (white by default)
  root.traverse(o=>{
    if(!o.isMesh)return;
    const arr=[].concat(o.material).map(mt=>{
      const nm=((o.name||'')+' '+(mt.name||'')).toLowerCase();
      const m=new THREE.MeshStandardMaterial({color:0xf3f3f0,roughness:0.35,metalness:0.1});
      if(/glass|window|wind|cockpit|screen/.test(nm)){m.color.set(0x14212b);m.roughness=0.08;m.metalness=0.6;}
      else if(/wood|deck|teak|floor/.test(nm))m.color.set(0x8b6b4a);
      else if(/black|rubber|tyre|tire|dark|engine/.test(nm))m.color.set(0x25272b);
      else if(/metal|chrome|rail|steel|silver|mast/.test(nm)){m.color.set(0xc4c8cf);m.metalness=0.8;m.roughness=0.25;}
      else if(/blue|hull/.test(nm))m.color.set(0x1b3f7a);
      return m;
    });
    o.material=arr.length>1?arr:arr[0];
  });
}

function edgePoly(a,b,side,off){const pts=[];for(let i=a;i<=b;i+=4)pts.push([C[i].x+Nn[i].x*side*off,C[i].z+Nn[i].z*side*off]);return pts;}
const gOff=W/2+9.8;                                                      // starts just behind the outer wall
const grassW=[edgePoly(nearestPx(1275,665),nearestPx(1210,380),1,gOff),edgePoly(nearestPx(75,775),nearestPx(268,615),1,gOff)];
{
  const gtex=noiseTex(58,112,44,40,1,60);gtex.repeat.set(1/6,1/6);
  for(const poly of grassW){
    const gg=new THREE.ShapeGeometry(new THREE.Shape(poly.map(q=>new THREE.Vector2(q[0],-q[1]))));gg.rotateX(-Math.PI/2);
    const m=new THREE.Mesh(gg,new THREE.MeshStandardMaterial({map:gtex,roughness:1}));m.position.y=0.02;m.receiveShadow=true;scene.add(m);
  }
  function tuftGeo(blades,h,seed){
    const pos=[],col=[];let sd=seed;const r=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
    for(let b=0;b<blades;b++){
      const a=r()*6.28,rad=r()*0.12,x=Math.cos(a)*rad,z=Math.sin(a)*rad,lean=(r()-.5)*0.25,hh=h*(0.6+r()*0.6),w=0.035;
      const tx=Math.cos(a+1.57)*w,tz=Math.sin(a+1.57)*w,ux=Math.cos(a)*lean*hh,uz=Math.sin(a)*lean*hh;
      pos.push(x-tx,0,z-tz,x+tx,0,z+tz,x+ux,hh,z+uz);
      col.push(0.12,0.26,0.07,0.12,0.26,0.07,0.5,0.68,0.26);
    }
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(Array.from({length:pos.length},(_,i)=>i%3===1?1:0),3));
    return g;
  }
  const kinds=[tuftGeo(7,0.30,11),tuftGeo(9,0.38,23),tuftGeo(6,0.25,37)];
  const gmat=new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,roughness:1});
  const GCELL=20,GRAD=3,GDENS=1500,CAPG=12000,FADEG=[1,1,0.7,0.4];     // GDENS: tufts per 20 m square (lower = lighter)
  const gm=kinds.map(g=>{const m=new THREE.InstancedMesh(g,gmat,CAPG);m.frustumCulled=false;m.count=0;scene.add(m);return m;});
  const SMg=gm.map(()=>new Float32Array(GDENS*16)),cacheG=new Map();
  const mg=new THREE.Matrix4(),qg=new THREE.Quaternion(),yg=new THREE.Vector3(0,1,0),pg=new THREE.Vector3(),sg=new THREE.Vector3();
  const inG=(x,z)=>grassW.some(pl=>inPoly(x,z,pl));
  const polyBB=grassW.map(pl=>[Math.min(...pl.map(q=>q[0])),Math.min(...pl.map(q=>q[1])),Math.max(...pl.map(q=>q[0])),Math.max(...pl.map(q=>q[1]))]);
  function cellG(a,b){
    const id=a*100003+b;let d=cacheG.get(id);if(d)return d;
    const cx0=a*GCELL,cz0=b*GCELL;                      // squares that do not touch any grass area are skipped at once
    if(!polyBB.some(bb=>cx0<bb[2]&&cx0+GCELL>bb[0]&&cz0<bb[3]&&cz0+GCELL>bb[1])){d=gm.map(()=>({n:0,m:new Float32Array(0)}));d.a=a;d.b=b;cacheG.set(id,d);return d;}
    let sd=(a*374761393+b*668265263)>>>0;
    const rnd=()=>{sd=(sd+0x6D2B79F5)>>>0;let t=sd;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
    const sn=gm.map(()=>0);
    for(let n=0;n<GDENS;n++){
      const px=(a+rnd())*GCELL,pz=(b+rnd())*GCELL,k=Math.floor(rnd()*gm.length),sc=0.7+rnd()*0.8,rot=rnd()*6.28;
      if(!inG(px,pz))continue;
      qg.setFromAxisAngle(yg,rot);mg.compose(pg.set(px,0.02,pz),qg,sg.set(sc,sc,sc));
      SMg[k].set(mg.elements,sn[k]*16);sn[k]++;
    }
    d=gm.map((_,k)=>({n:sn[k],m:SMg[k].slice(0,sn[k]*16)}));d.a=a;d.b=b;cacheG.set(id,d);return d;
  }
  let gcx=1e9,gcz=1e9;
  updateGrass=(x,z)=>{
    const cx=Math.floor(x/GCELL),cz=Math.floor(z/GCELL);
    if(cx===gcx&&cz===gcz)return;
    gcx=cx;gcz=cz;
    const cnt=gm.map(()=>0);
    for(let a=cx-GRAD;a<=cx+GRAD;a++)for(let b=cz-GRAD;b<=cz+GRAD;b++){
      const f=FADEG[Math.max(Math.abs(a-cx),Math.abs(b-cz))],d=cellG(a,b);
      d.forEach((e,k)=>{
        const n=Math.min(Math.floor(e.n*f),CAPG-cnt[k]);if(n<=0)return;
        gm[k].instanceMatrix.array.set(e.m.subarray(0,n*16),cnt[k]*16);cnt[k]+=n;
      });
    }
    gm.forEach((m,k)=>{m.count=cnt[k];m.instanceMatrix.needsUpdate=true;});
    for(const [id,d] of cacheG)if(Math.abs(d.a-cx)>GRAD+3||Math.abs(d.b-cz)>GRAD+3)cacheG.delete(id);
  };
}

function nearest(x,z,full){
  let best=1e18,bi=hint;
  const from=full?0:-25,to=full?N-1:25;
  for(let j=from;j<=to;j++){
    const k=full?j:(hint+j+N)%N,dx=x-C[k].x,dz=z-C[k].z,d=dx*dx+dz*dz;

}

  b=new THREE.Box3().setFromObject(w);const ctr=b.getCenter(new THREE.Vector3());
  m.position.set(-ctr.x,-b.min.y,-ctr.z);                                // centre it, wheels on the ground
  w.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  m.traverse(o=>{if(/wheel/i.test(o.name)&&!(o.parent&&/wheel/i.test(o.parent.name)))carWheels.push({o,base:o.quaternion.clone(),front:/front/i.test(o.name)});});
  carMesh.children.forEach(o=>o.visible=false);carMesh.add(w);
  new THREE.TextureLoader().load(ASSETS.colormap,cm=>{          // paint the car with its colour palette
    cm.flipY=false;cm.colorSpace=THREE.SRGBColorSpace;          // glTF models expect an un-flipped texture
    cm.magFilter=cm.minFilter=THREE.NearestFilter;cm.generateMipmaps=false; // keep the palette squares crisp
    w.traverse(o=>{if(o.isMesh){const arr=[].concat(o.material).map(()=>new THREE.MeshPhysicalMaterial({map:cm,color:0xffffff,metalness:0.35,roughness:0.28,clearcoat:1,clearcoatRoughness:0.06,envMapIntensity:0.8}));o.material=arr.length>1?arr:arr[0];}});
  },undefined,()=>console.warn('Missing '+ASSETS.colormap));           // hide the built-in car
},undefined,()=>console.warn('No car model at '+ASSETS.car+' - using the built-in car.'));

/* ---------- Physics ---------- */
const G=9.81,M=800,A=1.98,B=1.62,L=A+B,IZ=1500;
// STEERING TUNING - change these numbers to taste
const TUNE={
  lockBase:0.115, lockLow:0.34, falloff:18, // wheel angle: lockBase at top speed, plus lockLow when slow (halves at 'falloff' m/s)
  rate:4.5,        // how fast a key press turns the wheel; bigger = quicker
  slipAllow:0.17,  // extra wheel angle (rad) the tyres may use beyond the "no-slip" angle; bigger = sharper but slides more
  yawAssist:8      // how hard the car is nudged to rotate at the rate you asked for; 0 = off, bigger = snappier, harder to spin
};
const steerMax=v=>TUNE.lockBase+TUNE.lockLow/(1+(v/TUNE.falloff)**2);   // CG sits 45% from the front axle
const GR=[0,3.0,2.45,2.05,1.75,1.5,1.3,1.13,1.0],FD=5.74,RW=0.36,ETA=0.92,IDLE=4500,MAXRPM=15000;
const torque=r=>620*Math.max(0.3,1-((r-11500)/7500)**2);   // ~780 kW peak
const car={x:0,z:0,psi:0,vx:0,vy:0,r:0,steer:0,thr:0,brk:0,gear:1,rpm:IDLE,shift:0,mu:2,grass:false,d:0,idx:0};
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='KeyR')resetCar(true);
});
addEventListener('keyup',e=>keys[e.code]=false);

function resetCar(invalidate){
  const k=invalidate?nearest(car.x,car.z,true):idxAt(-8);               // pole position, 8 m behind the line
  const lat=invalidate?0:3.2;car.x=C[k].x+Nn[k].x*lat;car.z=C[k].z+Nn[k].z*lat;car.psi=Math.atan2(T[k].x,T[k].z);
  car.vx=car.vy=car.r=0;car.gear=1;car.thr=car.brk=car.steer=0;
  if(invalidate&&lapStart!==null)lapValid=false;
}

function step(dt){
  const c=car,v=Math.hypot(c.vx,c.vy);
  const up=keys.KeyW||keys.ArrowUp,rv=keys.KeyS||keys.ArrowDown,bk=keys.KeyB;
  const lf=keys.KeyA||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;

  // driver inputs (keyboard smoothing)
  c.thr+=((up?1:0)-c.thr)*Math.min(1,dt*10);
  c.brk+=((bk?1:0)-c.brk)*Math.min(1,dt*14);
  c.rev=(c.rev||0)+((rv?1:0)-(c.rev||0))*Math.min(1,dt*10);
  const tgt=(lf?1:0)-(rt?1:0);
  const rate=(tgt===0||Math.sign(tgt)!==Math.sign(c.steer))?7:TUNE.rate/(1+v/150);
  c.steer+=clamp(tgt-c.steer,-rate*dt,rate*dt);
  const ayMax=c.mu*(M*G+2.3*v*v)/M,dg=L*ayMax/Math.max(v*v,25)+TUNE.slipAllow;
  const dl=c.dl=clamp(c.steer*steerMax(v),-dg,dg);            // less lock at speed

  // engine + automatic gearbox
  const rpmAt=()=>Math.max(IDLE,Math.max(c.vx,0)/RW*GR[c.gear]*FD*9.5493);
  let rpm=rpmAt();
  if(c.shift>0)c.shift-=dt;
  else if(rpm>14300&&c.gear<8){c.gear++;c.shift=0.06;}
  else if(rpm<7800&&c.gear>1){c.gear--;c.shift=0.06;}
  rpm=c.rpm=rpmAt();
  const drive=(c.shift>0||rpm>=MAXRPM)?0:c.thr*(1-c.brk)*torque(rpm)*GR[c.gear]*FD*ETA/RW;

  // vertical loads: weight + aero downforce (grows with v^2)
  const down=2.3*v*v,mg=M*G;
  const Fzf=mg*B/L+0.45*down,Fzr=mg*A/L+0.55*down;
  const limF=c.mu*Fzf,limR=c.mu*Fzr;

  // tyre slip angles and lateral forces
  // slip angles measured against the direction the tyre is rolling, so they also work when reversing
  const vxs=Math.max(Math.abs(c.vx),1),ca=Math.cos(dl),sa=Math.sin(dl);
  const vf=c.vy+A*c.r,vlat=vf*ca-c.vx*sa,vlong=Math.abs(c.vx*ca+vf*sa);
  const af=-Math.atan2(vlat,Math.max(vlong,1)),ar=-Math.atan2(c.vy-B*c.r,vxs);
  const lowF=clamp((Math.abs(c.vx)-1)/5,0,1);
  let Fyf=limF*Math.sin(1.4*Math.atan(11*af))*lowF;
  let Fyr=limR*1.25*Math.sin(1.4*Math.atan(11*ar))*lowF;

  // longitudinal forces: 58/42 brake bias, rear drive, friction circle per axle
  const moving=c.vx>0.3?1:c.vx<-0.3?-1:0;
  const Fb=c.brk*moving*42000;
  let Fxf=clamp(-Fb*0.58,-limF,limF),Fxr=clamp(drive-(c.vx>-14?c.rev*(1-c.brk)*6500:0)-Fb*0.42,-0.7*limR,0.55*limR);
  Fyf*=Math.sqrt(Math.max(0,1-(Fxf/limF)**2));
  Fyr*=Math.sqrt(Math.max(0,1-(Fxr/limR)**2));

  // drag, rolling resistance, grass
  const gr=c.grass?0.35*M:0;
  const Fdx=-0.95*v*c.vx-120*moving-gr*c.vx;
  const Fdy=-0.95*v*c.vy-gr*c.vy;

  c.slip=Math.max(clamp((Math.abs(ar)-0.08)*8,0,1),Math.abs(c.vx)>8?clamp((Math.abs(Fxf)/limF-0.92)*10,0,1):0); // how much the tyres are sliding
  const cs=Math.cos(dl),sn=Math.sin(dl);
  const Fx=Fxr+Fxf*cs-Fyf*sn+Fdx;
  const Fy=Fyr+Fyf*cs+Fxf*sn+Fdy;
  c.vx+=(Fx/M+c.r*c.vy)*dt;
  c.vy+=(Fy/M-c.r*c.vx)*dt;
  const aw=clamp((Math.abs(c.vx)-2)/4,0,1),rMax=0.95*ayMax/Math.max(Math.abs(c.vx),5),rT=clamp(c.vx*Math.tan(dl)/L,-rMax,rMax);
  c.r+=((A*(Fyf*cs+Fxf*sn)-B*Fyr)/IZ+TUNE.yawAssist*(rT-c.r)*aw)*dt;
  if(c.brk>0.1&&Math.abs(c.vx)<1.2){            // brake holds the car at a full stop
    const k=1-Math.min(1,dt*15);c.vx*=k;c.vy*=k;c.r*=k;if(Math.abs(c.vx)<0.08)c.vx=0;
  }else if(Math.abs(c.vx)<0.5&&c.thr<0.05&&c.rev<0.05)c.vx*=1-dt*3;
  c.psi+=c.r*dt;
  const sp=Math.sin(c.psi),co=Math.cos(c.psi);
  c.x+=(c.vx*sp+c.vy*co)*dt;
  c.z+=(c.vx*co-c.vy*sp)*dt;
}

/* ---------- Timing ---------- */
let lapStart=null,lapValid=true,lapNo=1,best=null,lastLap=null,prevIdx=0,curSec=0,secStart=null;
const secT=[null,null,null];
const fmt=ms=>ms==null?'-':`${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}.${String(Math.floor(ms%1000)).padStart(3,'0')}`;

function updateTrackState(now){
  const c=car,k=nearest(c.x,c.z);
  c.idx=k;
  c.d=(c.x-C[k].x)*Nn[k].x+(c.z-C[k].z)*Nn[k].z;
  const out=Math.abs(c.d)>W/2+1.2;
  const rel=(k-PIT0+N)%N,pitZone=rel<PIT_LEN;
  const inGap=rel<PIT_GAP||rel>=PIT_LEN-PIT_GAP;
  const lane=pitZone&&c.d<W/2+14.5&&(inGap?c.d>W/2+0.8:c.d>W/2+2.3);c.inPitLane=lane;   // entry/exit are part of the lane (no track-limits penalty)
  const gr=Math.abs(c.d)>W/2+6&&!lane;c.grass=gr;c.mu=lane?1.8:gr?0.7:out?1.5:2.0;
  // the WHOLE car has to stay inside: how far it sticks out sideways depends on how it is angled to the track
  let dpsi=c.psi-Math.atan2(T[k].x,T[k].z);dpsi=Math.atan2(Math.sin(dpsi),Math.cos(dpsi));
  const ext=1.0*Math.abs(Math.cos(dpsi))+2.75*Math.abs(Math.sin(dpsi));
  const lim=(c.d>0&&pitZone)?W/2+13.7:OFFW-0.05,hit=Math.abs(c.d)+ext-lim;
  if(hit>0){                                   // barrier contact
    const sg=Math.sign(c.d);c.x-=Nn[k].x*sg*hit;c.z-=Nn[k].z*sg*hit;
    c.vx*=0.85;c.vy*=0.85;c.r*=0.85;if(lapStart!==null)lapValid=false;
  }
  if(rel>PIT_GAP&&rel<PIT_LEN-PIT_GAP&&c.d>W/2+1.0&&c.d<W/2+4.5){   // pit wall (solid except at entry and exit)
    const nd=c.d<W/2+2.3?Math.min(c.d,W/2+2.05-ext):Math.max(c.d,W/2+2.55+ext);
    if(nd!==c.d){const sh=c.d-nd;c.x-=Nn[k].x*sh;c.z-=Nn[k].z*sh;c.vx*=0.85;c.vy*=0.85;c.r*=0.85;}
  }
  const sRel=((k*DS+LAP_LENGTH/2)%LAP_LENGTH)-LAP_LENGTH/2;           // metres from the start line
  if(lane&&now>pit.cool&&Math.abs(sRel-PITBOX_M)<5&&Math.abs(c.d-PIT_LAT)<5&&Math.abs(c.vx)<1){pit.until=now+2500;pit.cool=now+9000;}
  if(out&&!lane&&lapStart!==null)lapValid=false;
  if(lapStart===null){                                  // lap 1 starts when you first cross the line
    if(prevIdx>N*0.8&&k<N*0.2){lapStart=secStart=now;curSec=0;lapValid=true;}
    prevIdx=k;return;
  }
  if(prevIdx>N*0.8&&k<N*0.2){                    // crossed the line
    secT[2]=now-secStart;secStart=now;curSec=0;
    if(lapValid){lastLap=now-lapStart;if(best===null||lastLap<best)best=lastLap;}
    lapNo++;lapStart=now;lapValid=true;
  }
  const sec=Math.floor(k/(N/3));
  if(sec!==curSec){if(sec===curSec+1){secT[curSec]=now-secStart;secStart=now;}curSec=sec;}
  prevIdx=k;
}

/* ---------- HUD ---------- */
const lightsEl=document.getElementById('lights'),lights=[];
for(let i=0;i<15;i++){lights.push(lightsEl.appendChild(document.createElement('i')));}
const lightCol=i=>i<5?'#34d27b':i<10?'#ff3b30':'#3aa0ff';
const $=id=>document.getElementById(id);
function updateHud(now){
  $('speed').textContent=Math.abs(car.vx)<0.3?0:Math.round(Math.abs(car.vx)*3.6);
  $('gear').textContent=car.vx<-1?'R':car.vx<1?'N':car.gear;
  const lit=clamp(Math.floor((car.rpm-9000)/6000*15),0,15);
  lights.forEach((l,i)=>l.style.background=i<lit?lightCol(i):'#2a2d36');
  $('lapNo').textContent=lapNo;
  $('cur').textContent=lapStart===null?'Cross the line to start':fmt(now-lapStart);
  $('last').textContent=fmt(lastLap);$('best').textContent=fmt(best);
  $('sec').textContent=secT.map(fmt).join('  ');
  $('warn').textContent=now<pit.until?'PIT STOP  '+((pit.until-now)/1000).toFixed(1)+' s':(car.inPitLane&&Math.abs(car.vx)>22.2)?'Pit lane speed limit: 80 km/h':!lapValid?'Track limits - lap deleted':'';
}

/* ---------- Visuals + loop ---------- */
let camPsi=0,wheelSpin=0,orbYaw=0,orbPitch=0,orbZoom=1,tYaw=0,tPitch=0,tZoom=1,dragging=false,lastDrag=0;
const cvs=renderer.domElement;cvs.style.touchAction='none';
cvs.style.cursor='grab';
cvs.addEventListener('pointerdown',e=>{dragging=true;cvs.style.cursor='grabbing';cvs.setPointerCapture(e.pointerId);});
cvs.addEventListener('dblclick',()=>{tYaw=tPitch=0;tZoom=1;});   // double-click: reset the view
cvs.addEventListener('pointerup',()=>{dragging=false;cvs.style.cursor='grab';lastDrag=performance.now();});
cvs.addEventListener('pointermove',e=>{
  if(!dragging)return;
  tYaw-=e.movementX*0.005;tPitch=clamp(tPitch+e.movementY*0.004,-0.12,1.1);lastDrag=performance.now();
});
cvs.addEventListener('wheel',e=>{tZoom=clamp(tZoom*(1+e.deltaY*0.001),0.5,3);e.preventDefault();},{passive:false});
function updateVisuals(dt){
  carMesh.position.set(car.x,0,car.z);
  carMesh.rotation.y=car.psi;
  const v=Math.hypot(car.vx,car.vy);
  wheelSpin+=car.vx*dt/RW;
  const dl=car.dl||0;
  for(const w of wheels){w.w.rotation.x=wheelSpin;if(w.front)w.pivot.rotation.y=dl;}
  for(const cw of carWheels){                                    // wheels of your car.glb: spin + steer
    qS.setFromAxisAngle(AX[ASSETS.wheelAxis],wheelSpin*ASSETS.wheelSign);
    cw.o.quaternion.copy(cw.base);
    if(cw.front){qT.setFromAxisAngle(AX.y,dl);cw.o.quaternion.multiply(qT);}
    cw.o.quaternion.multiply(qS);
  }
  let da=car.psi-camPsi;da=Math.atan2(Math.sin(da),Math.cos(da));
  camPsi+=da*Math.min(1,dt*6);
  if(!dragging&&performance.now()-lastDrag>3000){          // glide back behind the car after 3 s
    const k=Math.min(1,dt*1.5);tYaw*=1-k;tPitch*=1-k;tZoom+=(1-tZoom)*k;
  }
  const sm=Math.min(1,dt*12);                                  // smooth the mouse so the view eases instead of jerking
  orbYaw+=(tYaw-orbYaw)*sm;orbPitch+=(tPitch-orbPitch)*sm;orbZoom+=(tZoom-orbZoom)*sm;
  const yaw=camPsi+orbYaw,dx=Math.sin(yaw),dz=Math.cos(yaw);
  const ahead=4*Math.max(0,1-Math.abs(orbYaw));                // look slightly ahead only when not orbiting
  const px=car.x+Math.sin(camPsi)*ahead,pz=car.z+Math.cos(camPsi)*ahead;
  const R=(13+v*0.04)*orbZoom,el=0.22+orbPitch;               // orbit around the car: distance R, elevation el
  camera.position.set(px-dx*R*Math.cos(el),Math.max(0.7,1.2+R*Math.sin(el)+v*0.01),pz-dz*R*Math.cos(el));
  camera.lookAt(px,1.2,pz);
  camera.fov=74+v*0.12;camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  if(waterNormal){waterNormal.offset.x+=dt*0.006;waterNormal.offset.y+=dt*0.003;}
  if(ferris)ferris.rotation.z+=dt*0.07;
  sun.position.set(car.x+sunDir.x*150,sunDir.y*150,car.z+sunDir.z*150);
  sun.target.position.set(car.x,0,car.z);
}

// ---------- tyre effects: skid marks and smoke ----------
const AX={x:new THREE.Vector3(1,0,0),y:new THREE.Vector3(0,1,0),z:new THREE.Vector3(0,0,1)},qS=new THREE.Quaternion(),qT=new THREE.Quaternion();
const SKID_MAX=1200;
const skid=new THREE.InstancedMesh(new THREE.PlaneGeometry(0.32,1).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0x0b0b0d,transparent:true,opacity:0.5,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2}),SKID_MAX);
skid.frustumCulled=false;skid.count=0;scene.add(skid);
let skidN=0,skidFilled=0,puffI=0;
const smokeTex=(()=>{
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,0.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();
const puffs=Array.from({length:90},()=>{
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:smokeTex,color:0xe8e8e8,transparent:true,opacity:0,depthWrite:false}));
  sp.visible=false;sp.userData={life:0,max:1,vx:0,vz:0};scene.add(sp);return sp;
});
const skm=new THREE.Matrix4(),skq=new THREE.Quaternion(),skp=new THREE.Vector3(),sks=new THREE.Vector3();
function updateTireFx(dt){
  const sp=Math.hypot(car.vx,car.vy),f=Math.sin(car.psi),g=Math.cos(car.psi),lx=g,lz=-f;
  const wvx=car.vx*f+car.vy*g,wvz=car.vx*g-car.vy*f;
  if(car.slip>0.25&&sp>3){                                  // sliding: leave rubber on the road and make smoke
    const yaw=Math.atan2(wvx,wvz),len=Math.max(0.3,sp*dt*1.3);
    for(const sx of [-0.85,0.85]){
      const px=car.x-f*1.62+lx*sx,pz=car.z-g*1.62+lz*sx;
      skq.setFromAxisAngle(AX.y,yaw);skm.compose(skp.set(px,0.05,pz),skq,sks.set(1,1,len));
      skid.setMatrixAt(skidN,skm);skidN=(skidN+1)%SKID_MAX;skidFilled=Math.min(SKID_MAX,skidFilled+1);
      if(car.slip<0.4||Math.random()<0.5)continue;
      const sm=puffs[puffI=(puffI+1)%puffs.length];
      sm.visible=true;sm.position.set(px,0.3,pz);sm.scale.setScalar(0.8);
      sm.userData={life:0,max:0.9+Math.random()*0.5,vx:wvx*0.2+(Math.random()-.5)*1.5,vz:wvz*0.2+(Math.random()-.5)*1.5};
    }
    skid.count=skidFilled;skid.instanceMatrix.needsUpdate=true;
  }
  for(const sm of puffs){
    if(!sm.visible)continue;
    const u=sm.userData;u.life+=dt;
    if(u.life>=u.max){sm.visible=false;continue;}
    const t=u.life/u.max;
    sm.position.x+=u.vx*dt;sm.position.z+=u.vz*dt;sm.position.y+=0.9*dt;
    sm.scale.setScalar(0.6+t*2.2);sm.material.opacity=0.32*(1-t);
  }
}
// ---------- optional picture effects (off by default because they are heavy) ----------
let composer=null;
if(QUALITY.post){
  composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(innerWidth*curRatio,innerHeight*curRatio,{samples:4,type:THREE.HalfFloatType}));
  composer.addPass(new RenderPass(scene,camera));
  if(QUALITY.bloom)composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.22,0.6,0.92));
  composer.addPass(new ShaderPass({
    uniforms:{tDiffuse:{value:null},sat:{value:1.3},con:{value:1.1},vig:{value:0.35}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform sampler2D tDiffuse;uniform float sat,con,vig;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(.2126,.7152,.0722));vec3 col=mix(vec3(l),c.rgb,sat);col=(col-0.18)*con+0.18;col*=1.0-vig*smoothstep(.35,.9,distance(vUv,vec2(.5)));gl_FragColor=vec4(max(col,0.),c.a);}'
  }));
  composer.addPass(new OutputPass());
}
carMesh.traverse(o=>{o.userData.keepShadow=true;});
scene.traverse(o=>{if(o.isMesh&&!o.userData.keepShadow)o.castShadow=false;});     // shadows only from the car (much faster)
{const seen=new Set();                                                           // dim the brightest white materials a little
 scene.traverse(o=>{if(!o.isMesh)return;for(const m of [].concat(o.material)){
   if(seen.has(m)||!m.color||m.isMeshBasicMaterial)continue;seen.add(m);
   const c=m.color,l=c.r*0.2126+c.g*0.7152+c.b*0.0722;if(l>0.6)c.multiplyScalar(0.8);}});}
resetCar(false);camPsi=car.psi;
let prev=performance.now(),acc=0,frames=0,msAcc=0,lastHud=0;const fpsEl=document.getElementById('fps');
function frame(t){
  const dt=Math.min(0.05,(t-prev)/1000);prev=t;acc+=dt;
  frames++;msAcc+=dt*1000;
  if(frames===45){
    const ms=msAcc/45;frames=0;msAcc=0;fpsEl.textContent=Math.round(1000/ms)+' fps  (resolution x'+curRatio.toFixed(2)+')';
    if(QUALITY.adaptive&&!composer){
      if(ms>24&&curRatio>0.55){curRatio=Math.max(0.55,curRatio-0.15);renderer.setPixelRatio(curRatio);renderer.setSize(innerWidth,innerHeight);}
      else if(ms<13&&curRatio<QUALITY.pixelRatio){curRatio=Math.min(QUALITY.pixelRatio,curRatio+0.1);renderer.setPixelRatio(curRatio);renderer.setSize(innerWidth,innerHeight);}
    }
  }
  updateTrackState(t);
  if(t<pit.until){car.vx=car.vy=car.r=0;car.thr=0;}                  // pit stop: car is held for 2.5 s
  while(acc>=1/240){step(1/240);acc-=1/240;}
  updateVisuals(dt);updateTireFx(dt);if(updateGrass)updateGrass(car.x,car.z);if(t-lastHud>66){lastHud=t;updateHud(t);}
  if(composer)composer.render();else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
